cap:"Two state routes for protecting interests in land (p. 27); the allocation is revisable, which is Needham's opening for 'markets in property rights'.",
table:{head:["Situation (pp. 31–34)","Usual public-law route","Property-rights route","Verdict in the chapter"],rows:[
["Amenity in housing estates","Plan conditions, permits, monitoring","Covenants enforced by a residents' association (US 'private community associations', English 'scheme of development')","Feasible; not legally binding in NL (membership cannot be compulsory)"],
["Well-maintained industrial estates","Building/planning plus environmental permits (poor at maintenance)","One investor-landlord owns and leases the estate, maintaining its value","Works in England/US; in NL estates decay; fix: make unexpired leases tradable"],
["Urban public spaces","Municipality provides and maintains","Privately owned, publicly accessible spaces (malls, resident-owned spaces) under permit conditions","Rights deliberately created for a type of urban environment"],
["Coherent regional development","Land-use plans and infrastructure","Market in rights hardly realistic: effects too dispersed","Only public bodies/trusts using private law, e.g. US conservation agreements buying development rights"]]},
example:"Dutch industrial estates (p. 32): firms that own their buildings cannot be obliged to join an association that maintains shared spaces, and tenants avoid long leases because an unexpired lease cannot be sold on. So nobody holds the rights needed to protect the shared interest in quality, estates deteriorate quickly, and only large amounts of public money improve them. In England/US one investor-landlord holds the rights and maintains the estate to protect his investment.",
quotes:["\"Land-use planning will succeed only if it can influence the private decisions.\" (p. 24)","\"The authority is acting not so much to uphold some general public interest, as to uphold the identifiable interests of many identifiable private persons.\" (p. 26)","\"It is the fact that something is protected that makes it a right, rather than that something is protected because it is a right\" (Bromley 1998, quoted p. 27)","\"creating markets in property rights is a feasible alternative only under certain limited circumstances\" (p. 34)"],
dims:{sa:60,rt:75,de:15,us:45,mp:65,norm:"Protecting the legitimate interests of identifiable citizens; effectiveness (remediability) rather than efficiency; freedom and responsibility of rights holders; empowering the poor through rights; wary of exclusion and fragmentation."},
exam:"Know the two routes (private vs public law), the political vs technical allocation (door colour, right of support, clean air), rights as state-created and changeable, and the modest conclusion (feasible only in limited circumstances; feasibility is not desirability). Traps: Needham does NOT reject planning's goals or legitimacy, does NOT argue for replacing planning with markets, does NOT assume efficiency is the goal, and says the approach is neither left nor right. The lecture's 'veto of landowners' and 'dual role of the state' matrix are course framings. Link to Olson: the clean-air case is a collective action problem (many diffuse victims cannot organise). Critique angles: Marxism/political economy (rights reflect and reproduce class power; Needham himself concedes gated communities and fragmentation), communicative planning (interests are formed in deliberation, not given), historical institutionalism (path dependence makes rights hard to change: 'high ideological content')."},

{id:"olson", wk:3, title:"Hindmoor (2006) Mancur Olson and the logic of collective action", cite:"Hindmoor, A. (2006). Mancur Olson and the logic of collective action. In Rational Choice (ch. 5, pp. 102–128). Basingstoke: Palgrave Macmillan", theory:"Rational choice (collective action / public choice)", status:"full",
statusNote:"Built from the full chapter (OCR of scanned pages 102–128). Pages 124–125 (Box 5.5 on norms and part of the Marwell & Ames discussion) are badly garbled in the OCR; only clearly legible content from them is used. Lecture HC6 (Airbnb as a collective action problem) used for the course application. Note: 'exploitation of the great by the small', 'by-product theory' and a lobby of 'concentrated vs diffuse interests' do NOT appear in this chapter.",
one:"Collective goods are non-excludable, so each rational, self-interested member may free-ride and the good goes under-provided: a collective action problem, best modelled as an (N-person) prisoners' dilemma. Olson does not claim collective action is impossible; groups overcome the problem through coercion, privileged members, selective incentives, process benefits, or conditional cooperation. The self-interest assumption and the lack of a full theory of group formation limit the account.",
summary:["The problem (pp. 102–105): Olson (1965) challenged the assumption that people with common interests will act on them: 'unless the number of individuals is quite small, or there is coercion or some other special device', self-interested individuals will not act for their group interest. Goods are classed by excludability and rivalness (Box 5.1): public goods (defence), common-pool goods (fisheries), toll goods, private goods. Olson defines public goods only by non-excludability, so the problem covers common goods too. Examples: union dues, Marxist revolution (why risk the barricades?), pluralists such as Truman and Bentley (latent groups like migrant workers may never form), CO2 emissions, the security dilemma.",
"Game theory (pp. 105–112; Olson himself used none): the prisoners' dilemma (Jake and Keith) has a dominant strategy of defection and a Pareto-inferior equilibrium; the N-person version (join a protest or stay home) shows free-riding. Not every collective action problem is a PD: in the assurance game (the dam needs both farmers) there is no dominant strategy and cooperation should be easy; in chicken (either farmer can fix the dam) each tries to make the other do it, and 'anything can happen'.",
"Solutions (pp. 113–121): Olson 'does not suggest that groups will always fail'. (1) Coercion by the state (taxes; Hardin's leviathan for the tragedy of the commons, against which free-market economists propose property rights and tradeable permits based on Coase) or by gangs (Gambetta's Mafia enforcing exchange). (2) Privileged groups: at least one member values the good enough to pay the whole cost (flatmate who cleans; hegemonic stability); several such members can turn it into chicken. (3) Selective incentives: positive (union legal aid) or negative (ostracism); they raise a second-order collective action problem, possibly solved by entrepreneurs. (4) Process benefits: participation itself is rewarding (Chong on civil rights; kibbutz gossip). (5) Conditional cooperation in intermediate groups, where members notice who contributes: tit-for-tat won Axelrod's tournaments; Ostrom shows communities manage commons without leviathan or market when interaction is long-term, exit is costly, monitoring is cheap and groups are tightly integrated.",
"Group size (p. 121): large groups are more likely to be latent, because contributions are easier to see in small groups, but the link is 'at most, an empirical tendency' (a mining community vs strangers in a bed-sit). Limits (pp. 122–128): people also contribute because norms say they ought to; Olson concedes his theory cannot explain 'non-economic' groups like Greenpeace or Amnesty. Experiments (Marwell & Ames) find substantial group contributions that fall, but stay positive, when stakes rise; a few unconditional cooperators may be needed to pass the threshold at which cooperation becomes stable. Assessment: Olson was the first to give a general analysis and inspired many case studies, but he offers no comprehensive theory of how interests and group identities form, how platforms are agreed, how collective action changes policy, or why groups collapse; social psychology and insider-group research are needed too.",
"Course application (HC6, not in the chapter): Airbnb regulation lags because hosts/investors organise while neighbours free-ride. Hindmoor's chapter supports the free-riding part, but warns that size is only a tendency and that small groups organise when one member gains enough (privileged) or when members can monitor each other (intermediate). The link with Needham: diffuse harms such as air pollution cannot be protected by individual property rights because victims cannot organise to sue."],
concepts:[["Collective action problem","All members gain if they act together, but no individual gains from contributing to the collective good: free-riding (p. 102)."],["Public / common-pool / toll / private goods","Classified by excludability and rivalness (Box 5.1); Olson's definition uses non-excludability only, so common-pool goods face the problem too."],["Prisoners' dilemma","Game where defection is the dominant strategy and the equilibrium is Pareto-inferior to mutual cooperation (pp. 105–110)."],["Assurance and chicken","Collective action games without a dominant strategy: assurance (both needed, cooperation easy); chicken (one suffices, each waits for the other) (pp. 110–112)."],["Latent / privileged / intermediate group","Latent: nobody bears their share; privileged: at least one member will pay the full cost (Olson 1965: 48–50); intermediate: members notice whether others contribute (Olson 1965: 50)."],["Selective incentives","Excludable rewards for contributors (e.g. free legal representation) or punishments for non-contributors (e.g. ostracism) (Olson 1965: 133–5)."],["Second-order collective action problem","Applying selective incentives (e.g. punishing free-riders) is itself a collective good, risking an infinite regress (pp. 116–117)."],["Process benefits","Instrumental or expressive rewards from participating itself; tied to the collective good, so the problem 'simply dissolves' (pp. 117–118)."],["Conditional cooperation / tit-for-tat","Cooperate as long as others do; in iterated games tit-for-tat wins on average via simplicity, generosity, responsiveness (pp. 118–120)."],["Ostrom's self-governed commons","Communities build rules of allocation, monitoring and sanctioning for common-pool resources without a leviathan or the market (p. 120)."]],

cap:"Hindmoor's structure: one problem, five routes out; the chapter stresses that Olson never said collective action is impossible.",
table:{head:["Game","Story in the chapter","Dominant strategy?","Outcome"],rows:[
["Prisoners' dilemma","Jake and Keith: confess or stay quiet","Yes: defect (confess)","Both confess (3, 3) although both prefer (2, 2)"],
["N-person prisoners' dilemma","Join a street protest or stay home","Yes: stay home","Everyone defects; cooperation Pareto-superior but individually irrational"],
["Assurance","Dam survives only if both farmers work","No","Cooperation should be easily achieved if rationality is common knowledge"],
["Chicken","One day of work by either farmer saves the dam","No","Each tries to pre-commit to defect; in a single play 'anything can happen'"]]},
example:"Ostrom's Valencia irrigation system (p. 121): it is designed so that the person whose turn is next has a built-in incentive to check that the current user does not take more than their share, lowering monitoring costs so conditional cooperation can last without state coercion or privatisation. Course application (HC6): short-term rental hosts organise while neighbours free-ride, so regulation lags.",
quotes:["\"Olson argues that groups face a collective action problem but recognizes that they may be able to overcome it.\" (p. 102)","\"Though all of the members of a group therefore have a common interest in obtaining this collective benefit, they have no common interest in paying the cost of providing that collective good.\" (Olson 1965: 21, quoted p. 104)","\"Yet the relationship between size and 'latency' is, at most, an empirical tendency.\" (p. 121)","\"Successful collective action will not usually depend upon everyone in a group eschewing their self-interest. In its early stages it may however require that a few are prepared to do so.\" (p. 127)"],
dims:{sa:85,rt:40,de:50,us:20,mp:20,norm:"Explanatory rather than normative; implicitly, collective goods are under-provided without coercion, incentives or institutions; Hindmoor stresses the limits of the self-interest assumption."},
exam:"Definitions are MCQ material: privileged (one member bears full cost) vs intermediate (members can notice others' contribution) vs latent; positive vs negative selective incentives; PD vs assurance vs chicken (which have a dominant strategy?). Big trap: 'Olson shows collective action is impossible/irrational': the chapter says this reading is wrong. Second trap: small group size is not the definition of a privileged group, and size predicts latency only as a tendency. Framework: methodological individualism (agency), universal rationality assumptions (monist, universal), change deliberate (incentive design, coercion) or emergent (tit-for-tat norms, Ostrom). Critique angles: sociological institutionalism and norms (people contribute because they ought to), communicative planning (identity and interests formed in interaction), Marxism/power (who can organise reflects structural resources, not only group size)."}
];

const FC_A=[
["hayek","How does Hayek define what all collectivist systems share?","'The deliberate organisation of the labours of society for a definite social goal' (p. 42). Communism and fascism differ only in the goal; all refuse autonomous spheres where individual ends are supreme."],
["hayek","Why is 'the common good' or 'general welfare' no basis for a single plan (Hayek)?","The terms are too vague to decide any action; welfare cannot be measured on one scale. A single plan presupposes a 'complete ethical code' ranking every need, which does not exist (pp. 42–43)."],
["hayek","Does Hayek's individualism assume people are selfish?","No, explicitly not (p. 44). It starts from the limits of imagination: nobody can include more than a sector of society's needs in his scale of values, so only partial, inconsistent scales exist, and the individual should judge his own ends."],
["hayek","Hayek: why does state control spread once the public sector is large?","Agreement falls as the scope of common action grows; once the state controls a large share of resources (Germany 1928: 53% of national income) it indirectly controls almost the whole economy (p. 45)."],
["hayek","Hayek's journey metaphor","Agreeing on central planning without agreeing on ends is like committing to a journey together without agreeing where to go: most end up on a journey they do not want (p. 46)."],
["hayek","Why can a parliament not adopt an economic plan by majority vote (Hayek)?","Majorities form between limited alternatives; it is a 'superstition' that there is a majority on everything. A plan needs a unitary conception, so voting clause by clause 'makes nonsense' and the task is delegated to experts (pp. 47–48)."],
["hayek","Hayek's military-campaign analogy","Like a campaign, a plan gets delegated to experts; but a general has one supreme goal, while an economic planner must choose between competing ends of different people, so experts impose their own scale of preferences (p. 48)."],
["hayek","When is delegation objectionable for Hayek?","Not delegation as such: delegating general rule-making, even to local authorities, can be fine. It is objectionable when it delegates discretion over particular cases ('judging the case on its merits'), which amounts to arbitrary power (p. 49)."],
["hayek","Hayek on the value of democracy","A means, 'a utilitarian device for safeguarding internal peace and individual freedom' (p. 52), not the highest end; a homogeneous majority can be oppressive. What prevents arbitrary power is 'not the source but the limitation of power' (p. 53)."],
["hayek","Which lecture ideas about Hayek are NOT in 'Planning and democracy'?","Spontaneous order/kosmos vs taxis (later work, e.g. Law, Legislation and Liberty), dispersed local knowledge (Hayek 1945, via Cozzolino), complex phenomena/indeterminism, and 'equality of rights' as a label. The chapter argues from value pluralism and the mechanics of majority rule and delegation."],
["needham","Why does Needham reject 'the public interest' as the justification for planning?","It is hard to substantiate, economic 'distortion' arguments no longer convince, and it depersonalises those affected: 'But we too are the public!' (p. 25). Planning upholds 'the identifiable interests of many identifiable private persons' (p. 26)."],
["needham","Is land-use planning 'command and control' for Needham?","No. Owners' decisions stay voluntary; the authority cannot decide unless it owns the land. It influences via permits, subsidies/levies, persuasion and infrastructure; only (compulsory) purchase takes the decision away (pp. 24–25)."],
["needham","Needham's two ways the state protects interests in land","Private law: the interest becomes a property right that the holder enforces in court. Public law: a public authority (e.g. a municipality) restricts how others use their rights, via permits and prohibitions, for those who cannot protect themselves (p. 27)."],
["needham","Why is there a right of support but no property right to clean air (Needham)?","Technical reasons: foundation damage has a clear cause and few parties, so private enforcement works. Air pollution is diffuse and affects hundreds who would struggle to cooperate in a lawsuit, so it is protected by public law (p. 28)."],
["needham","Needham's example of an interest protected neither way, and why","The colour of the neighbour's front door: it was decided politically that my interest in it matters less than hers (p. 28)."],
["needham","What makes something a property right, according to Needham (quoting Bromley)?","Court protection: 'It is the fact that something is protected that makes it a right, rather than that something is protected because it is a right' (p. 27). Rights are state-created, not natural (contra Locke), so they differ between countries and can be a 'policy variable'."],
["needham","Why is 'planning or the market?' the wrong question for Needham?","Voluntary exchange cannot be excluded from land-use processes (Lindblom), so the real question is the mix of planning and market (Buitelaar). Shifting protection from public to private law creates markets in property rights (p. 29)."],
["needham","What is Williamson's 'remediability' approach as Needham uses it?","Not assuming economic efficiency is the goal of policy, but comparing how effectively different instruments achieve the same politically chosen goals (p. 30)."],
["needham","Why do US-style residents' covenants not exist in the Netherlands (Needham)?","Dutch property law does not allow owners to be obliged to join a residents' association (Van Velten 2003), so the market route to residential amenity is blocked; the law could be changed (p. 31)."],
["needham","Needham's overall conclusion on markets in property rights","Feasible 'only under certain limited circumstances' (p. 34), and feasibility is not desirability. Pros: less inflexible, no public compensation for 'takings'; cons: exclusivity (gated communities), fragmentation. Politically neither left nor right (pp. 34–35)."],
["olson","Hindmoor: is Olson arguing that collective action is impossible or irrational?","No. 'This is simply not the case' (p. 102): Olson says groups face a collective action problem but may overcome it, and much of The Logic analyses how (p. 113)."],
["olson","How does Olson define a public good, and why does it matter (Box 5.1)?","Solely by non-excludability: those who do not pay cannot be kept from consuming it (Olson 1965: 12). So the collective action problem affects common-pool goods (rival but non-excludable, e.g. fisheries) as well as pure public goods."],
["olson","Privileged vs intermediate group","Privileged: at least one member values the good so much they will bear the entire cost and tolerate free-riding (Olson 1965: 48–50). Intermediate: members can notice whether others contribute, enabling conditional cooperation (Olson 1965: 50)."],
["olson","What is the second-order collective action problem?","Selective incentives such as ostracising free-riders are themselves a collective good: why would anyone bear the cost of punishing? This threatens an infinite regress; entrepreneurs or process benefits may solve it (pp. 116–118)."],
["olson","Process benefits (Hindmoor)","Participation itself yields instrumental or expressive benefit (civil rights activists' 'adrenaline rush'; enjoyable kibbutz gossip), so the problem dissolves. Unlike legal aid, the benefit is tied to, even constitutive of, the collective good (pp. 117–118)."],
["olson","Why did tit-for-tat win Axelrod's tournaments?","It cooperates first, then copies the other's last move. It wins on average (not every game) through simplicity, generosity (rewards cooperation) and responsiveness (punishes defection) (pp. 119–120)."],
["olson","Ostrom's conditions for conditional cooperation (Hindmoor)","Long-term interaction (reputation), costly exit, cheap monitoring (e.g. Valencia irrigation turns), and tightly integrated groups. Then communities manage commons without a leviathan or the market (pp. 120–121)."],
["olson","Is group size the key to latency, according to Hindmoor?","Olson suggests large groups are more likely latent because contributions are harder to see, but the link is 'at most, an empirical tendency' (p. 121): a large mining community can know its free-riders; bed-sit neighbours may not know each other."],
["olson","Two limits of Olson's account (Hindmoor's assessment)","(1) The self-interest assumption: norms make people contribute, and Olson concedes he cannot explain 'non-economic' groups like Greenpeace or Amnesty. (2) No comprehensive theory of how group interests and identities form, platforms are agreed, policy changes or groups collapse (pp. 122–128)."],
["olson","Hardin's tragedy of the commons: coercive vs free-market solution (Box 5.3)","Hardin: a 'leviathan' must control access to common-pool resources. Free-market economists: define property rights (Demsetz) and use tradeable permits based on the Coase theorem (pp. 113–114). Links to Needham's markets in property rights."]
];

const OPEN_A=[
{t:"hayek",pts:12,q:"A Dutch municipality wants to meet its housing target by deciding every large development 'on its merits' through negotiated, discretionary deals, with the council approving the overall programme only as a package. (a) Explain how Hayek (1944, 'Planning and democracy') would criticise this approach, using at least three concepts from the chapter. (b) Contrast this with how a Marxist-inspired planner (as presented in HC4) would evaluate the same approach.",
model:"(a) Hayek would see a small-scale version of the mechanism in ch. 5. A housing programme serves many competing ends (affordability, density, green space, profit), and there is no 'complete ethical code' ranking them; the council can agree that there must be a plan but not on its content. Presenting it as a package leaves parliament (here the council) only to accept or reject the whole, so criticism 'cannot direct' (p. 51). Deciding cases 'on their merits' is exactly the delegation of discretion Hayek calls arbitrary power (p. 49); general rules, even local ones, would be acceptable. The officials negotiating deals must choose between ends and therefore impose their own scale of preferences (p. 48). What prevents arbitrariness is 'not the source but the limitation of power' (p. 53): democratic approval of the package does not make the discretion legitimate. Hayek's alternative is to restrict collective action to where true agreement exists and to use general rules. (b) A Marxist planner (Madden & Marcuse in HC4) would judge the approach on outcomes: markets turn housing into a commodity and produce material inequality, so the problem is not too much discretion but that deals with developers reproduce the structural logic of profit. They would support stronger, deliberate intervention (decommodified public or cooperative housing) and treat Hayek's formal equality of rights as blind to property power. Contrast: liberty and limited, rule-bound power vs material equality and structural transformation.",
rubric:["Uses at least three chapter concepts correctly (complete ethical code, delegation/discretion vs general rules, plebiscitarian/take-it-or-leave-it plan, limitation of power)","Applies them to the case rather than reciting","Marxist evaluation: structure, commodification, material equality, deliberate transformation","Explicit contrast of normative commitments (liberty/equality of rights vs material equality)"]},
{t:"needham",pts:12,q:"(a) Explain Needham's (2012) distinction between the private-law and public-law ways in which the state protects interests in land, and why the choice between them is partly political and partly technical. (b) Use Olson's logic of collective action (Hindmoor 2006) to explain the 'technical' part. (c) What does this imply for Needham's proposal to reach planning goals by creating markets in property rights?",
model:"(a) People have interests in how land is used, their own and others' (neighbours, traffic, clean air). The state protects some by making them property rights: the holder enforces them in court (private law). It protects others by empowering a public authority to restrict how owners exercise their rights, through permits or prohibitions (public law = land-use planning). Some interests are not protected. Whether an interest is protected is political (my interest in my neighbour's door colour is judged less important than hers). Which route is used is partly technical: a right of support works because cause and effect are clear and few people are involved; for air pollution affecting hundreds, a property right would be ineffective (p. 28). (b) The clean-air case is a collective action problem: winning a lawsuit against the factory is a non-excludable good for all residents, so each has an incentive to free-ride on others' legal action. It is a latent group with diffuse, small individual stakes, while the factory is a single concentrated actor. Unless there are selective incentives, a privileged member or low monitoring costs, nobody sues, so the state provides the good through public law (coercion). (c) Markets in property rights work only where interests can be organised: small estates with covenants and a residents' association (an intermediate group with monitoring), or one landlord who internalises the shared interest (a privileged actor). At regional scale, effects are too dispersed, which explains Needham's conclusion: feasible 'only under certain limited circumstances' (p. 34).",
rubric:["Correct private vs public law distinction with examples","Political (door colour) vs technical (right of support vs clean air) allocation","Correct Olson concepts (non-excludability, free-riding, latent group, possible solutions) applied to the case","Links back to Needham's limited-feasibility conclusion (e.g. residents' association / landlord vs regional scale)"]},
{t:"olson",pts:10,q:"In HC6, the slow regulation of short-term rentals (Airbnb) was explained as a collective action problem. (a) Explain, using Hindmoor's (2006) account of Olson, why neighbours affected by short-term rentals may fail to act collectively. (b) Discuss two mechanisms from the chapter through which they might still organise. (c) Give one limitation of the Olsonian explanation that Hindmoor himself identifies.",
model:"(a) Stricter regulation is a collective good for all neighbours: non-excludable, because every resident benefits from less noise and more housing supply whether or not they campaigned. Campaigning costs time and effort, and each individual's contribution makes little difference, so each prefers to free-ride. This is an N-person prisoners' dilemma: staying home is the dominant strategy, even though everyone campaigning is Pareto-superior. Many dispersed neighbours who hardly know each other form a latent group, while hosts or investors have concentrated stakes (lecture). Hindmoor notes that size is only 'an empirical tendency'; what matters is whether members can see who contributes. (b) Selective incentives: a residents' association (VvE) could offer members-only benefits such as legal advice (positive) or social pressure on non-participants (negative), though this raises a second-order problem that an entrepreneur (an active neighbour or local politician) may solve. Conditional cooperation in intermediate groups: in one building or street, long-term neighbours can monitor each other and cooperate tit-for-tat style, as Ostrom shows for commons. Process benefits (the satisfaction of protecting 'our' neighbourhood) or a privileged member who pays the whole cost are also valid. (c) Olson assumes self-interest: people also act because norms say they ought to, and the theory cannot explain how residents come to identify with a group or how collective action changes policy (pp. 122–128).",
rubric:["Collective good, non-excludability and free-riding correctly applied","Two mechanisms from the chapter, explained and applied (selective incentives, conditional cooperation, process benefits, privileged group, coercion)","Nuance: size only an empirical tendency / Olson does not say it is impossible","One limitation taken from Hindmoor (self-interest and norms; no theory of identity or group formation)"]}
];

const NEW_B=[
{id:"harvey", wk:6, title:"Harvey (1989) From managerialism to entrepreneurialism", cite:"Harvey, D. (1989). From managerialism to entrepreneurialism: the transformation in urban governance in late capitalism. Geografiska Annaler: Series B, Human Geography 71(1), 3–17. DOI 10.1080/04353684.1989.11879583", theory:"Marxist political economy (historical-geographical materialism, dialectical)", status:"full",
 statusNote:"Built from the full 1989 article (JSTOR copy, pp. 3–17); all page numbers are the journal's. The two-column JSTOR text was interleaved, so quotes were reassembled line by line and checked. One clearly labelled note on Harvey's wider framework (spatial fix, accumulation by dispossession) comes from the encyclopedia entry (Woodward & Jones 2009) and is NOT in the 1989 article.",
 one:"Since the early 1970s urban governance in advanced capitalist countries has shifted from managerialism (local provision of services, facilities and benefits) to entrepreneurialism: public-private partnerships, speculative projects in which the local public sector absorbs risk, and a focus on the construction of place rather than on territory. Inter-urban competition, sharpened by mobile capital, acts as an 'external coercive law' after the event: it spreads copied projects, regressive redistribution and instability and helps the transition to flexible accumulation. Yet Harvey sees a potential for a progressive urban corporatism built on alliances across space.",
 summary:[
  "The shift and its drivers (pp. 3–5): the 'managerial' approach typical of the 1960s gave way to initiatory, 'entrepreneurial' forms of action in the 1970s and 1980s; a 1985 colloquium in Orleans (eight large cities, seven countries) showed consensus that cities must be more innovative and entrepreneurial, a consensus that holds 'across national boundaries and even across political parties and ideologies' (p. 4). Examples: British local authorities' economic development activity, Blunkett's Labour Sheffield; in the US, cuts in federal redistribution after 1972 revived boosterism. The shift is incomplete and 'checkered' (New Orleans stayed a ward of federal government). Backdrop: the 1973 recession, deindustrialisation, 'structural' unemployment, fiscal austerity, neoconservatism and appeal to market rationality and privatisation, and the declining power of the nation state over multinational money flows; it may play a role in the transition from Fordist-Keynesian accumulation to 'flexible accumulation' (p. 5). Zero-sum competition would force even municipal socialists to play 'the capitalist game', but under the right circumstances competition 'may open the way to a non zero-sum pattern of development' (p. 5).",
  "Conceptual issues (pp. 5–7): Harvey warns against reifying cities: 'cities' seem active agents 'when they are mere things'; urbanisation is 'a spatially grounded social process' in which diverse actors interact, with class content hegemonic under capitalism. Its artefacts (built form, institutions) dominate and constrain later action, a dialectic of process and thing. Urban 'governance' means much more than 'government': the power to organise space lies in coalitions and class alliances (chambers of commerce, financiers, developers in 'growth machine' politics, unions, universities, parties, social movements, local state apparatuses); a charismatic mayor or business leader can stamp their mark (Mayor Schaeffer in Baltimore; private entrepreneurs in Halifax or Gateshead).",
  "Three broad assertions (pp. 7–8), true for Baltimore (the underpinning case) and perhaps more general: (1) the centrepiece is the 'public-private partnership', integrating traditional boosterism with local government powers to attract external funding, investment and jobs; Baltimore's 1978 referendum sanctioned city land for the private development that became Harborplace. (2) The partnership is entrepreneurial because it is speculative in execution and design; often 'the public sector assumes the risk and the private sector takes the benefits' (p. 7), though not always (Gateshead's Metrocenter). Risk-absorption by the local (not national) public sector distinguishes it from earlier civic boosterism. (3) It focuses on the political economy of place rather than of territory: building places (civic centres, industrial parks, cultural and retail centres) whose benefits are indirect and may be wider or narrower than the jurisdiction, and which divert attention from region-wide problems.",
  "Four basic options (pp. 8–10), not mutually exclusive: (1) competition within the international division of labour: advantages for producing goods and services (resource base, location, infrastructure, subsidies, cheap or skilled labour, agglomeration economies; Bologna/Emilia Romagna); (2) the spatial division of consumption: tourism, retirement, quality of life, gentrification, spectacle, stadia, marinas; the city must appear 'innovative, exciting, creative, and safe'; Baltimore's tourism jobs rose from under one to over fifteen thousand; (3) acquisition of control and command functions in high finance, government, information and media; (4) redistribution of surpluses through central (US: state) governments, e.g. defence contracts (Bristol, Long Beach-San Diego). Synergy between strategies explains uneven growth (Los Angeles). Inter-urban competition, strengthened by falling transport costs and mobile capital, acts as an 'external coercive power' that may force 'serial reproduction' (world trade centres, waterfronts, malls; p. 10). Speculation arises because nobody can predict which package will succeed (p. 11).",
  "Macro-economic consequences and critique (pp. 11–16): public risk-absorption makes multinational capital more, not less, mobile; localities become sites of labour regulation (local bargaining), facilitating flexible accumulation and linked to postmodern design of 'urban fragments'. PPPs subsidise affluent consumers, corporations and command functions at the expense of collective consumption for the working class and poor; jobs polarise; imitation renders advantage ephemeral; the urban system becomes unstable (Houston, New Orleans' World Fair) and credit-financed malls and stadia feed overaccumulation. Image production brings social control ('bread and circuses'). Theoretically, entrepreneurialism looks like local autonomy, but Marx's 'coercive laws of competition' discipline it after the event (pp. 14–15). Critique should contrast surface vigour with a 'dual city'; yet the city as collective corporation (Paris Commune) offers potential for 'a progressive urban corporatism' with a geopolitical strategy of inter-urban alliances (p. 16). Encyclopedia note (not in the article): Harvey's wider concepts of the spatial fix and accumulation by dispossession (Woodward & Jones 2009, pp. 24, 27)."
 ],
 concepts:[
  ["Urban managerialism","Governance focused on 'the local provision of services, facilities and benefits to urban populations' (p. 3); typical of the 1960s (p. 4)."],
  ["Urban entrepreneurialism","Governance preoccupied with fostering local development and employment growth (p. 3); rests on a public-private partnership and the speculative construction of place (p. 8)."],
  ["Urban governance vs government","Governance means much more than government: the power to reorganise urban life lies in a broader coalition of forces and class alliances, in which government has a facilitative, coordinating role (p. 6)."],
  ["Public-private partnership","Centrepiece of the new entrepreneurialism: local boosterism integrated with local government powers to attract external funding, investment and jobs (p. 7)."],
  ["Speculation and risk-absorption","The partnership is speculative in execution and design; often the public sector assumes the risk and the private sector takes the benefits; local risk-absorption distinguishes it from earlier civic boosterism (p. 7)."],
  ["Place vs territory","Territory: projects (housing, education) improving conditions within a jurisdiction; place: constructing or enhancing specific places whose impacts may be smaller or greater than the territory (pp. 7–8)."],
  ["Four basic options","Competition in the international division of labour (production), the spatial division of consumption, for control and command functions, and for redistributions via central government (pp. 8–10)."],
  ["Inter-urban competition as coercive law","An 'external coercive power/law' that disciplines cities into the logic of capitalist development, after the event rather than before (pp. 10, 12, 15)."],
  ["Serial reproduction","Repetitive copying of development forms (world trade centres, waterfronts, cultural centres, malls, science parks) that renders competitive advantage ephemeral (pp. 10–12)."],
  ["Progressive urban corporatism","The city as a collective corporation with democratic decision-making (Paris Commune), armed with a geopolitical strategy of alliances across space to mitigate capitalist accumulation (p. 16)."]
 ],

 example:"Baltimore (the case underpinning the argument, p. 7): a 1978 referendum narrowly sanctioned city land for the private development that became Harborplace, giving public-private partnership a popular mandate. Tourism jobs rose from under one to over fifteen thousand (p. 9); the city was hailed as a 'renaissance city' on the cover of Time, yet local studies found 'rot beneath the glitter', a 1984 Congressional Report called it one of the 'neediest' US cities, and Levine (1987) showed limited benefits and accelerating decline (p. 14). The image consolidated the power of the partnership and gave residents place-bound identity: \"The circus succeeds even if the bread is lacking. The triumph of image over substance is complete.\" (p. 14). Course link: Hyötyläinen & Haila use Harvey's managerial/entrepreneurial pair for Helsinki's sale of Eiranranta (their p. 140).",
 quotes:[
  "\"Put simply, the \"managerial\" approach so typical of the 1960s has steadily given way to initiatory and \"entrepreneurial\" forms of action in the 1970s and 1980s.\" (p. 4)",
  "\"The new urban entrepreneurialism typically rests, then, on a public-private partnership focussing on investment and economic development with the speculative construction of place rather than amelioration of conditions within a particular territory as its immediate (though by no means exclusive) political and economic goal.\" (p. 8)",
  "\"... competition seems to operate not as a beneficial hidden hand, but as an external coercive law forcing the lowest common denominator of social responsibility and welfare provision within a competitively organised urban system.\" (p. 12)",
  "\"Socialism within one city is not, of course, a feasible project even under the best of circumstances. Yet cities are important power bases from which to work.\" (p. 16)"
 ],
 dims:{sa:30, rt:40, de:65, us:35, mp:20, norm:"Social justice and anti-capitalist critique: exposes regressive redistribution, the dual city and image over substance; favours collective consumption and democratic, progressive urban corporatism linked by inter-urban alliances rather than competition."},
 exam:"Commentary angle: grounded in Marxist political economy (a dialectical historical geography of capital): structural drivers (1973 crisis, mobile capital, fiscal austerity) explain the shift; agency lies in class coalitions, but inter-urban competition is Marx's 'coercive law' and the 'bearer' of capitalist social relations, disciplining choices after the event (pp. 14–15). Note his nuance: local governance is not simply captive of capital (he distances himself from Cockburn's local state theory), the shift is incomplete, competition can be non zero-sum, and progressive corporatism is possible. Best critiques: (1) historical/sociological neo-institutionalism: national land, fiscal and legal regimes produce different varieties (Helsinki's public land; Milan's PII); (2) regime theory/urban politics: coalitions have more room than 'realistic' constraint suggests; (3) governmentality/discourse: entrepreneurialism as a constructed rationality; (4) Hayek/public choice (Tiebout, Peterson's City Limits is cited): competition can discipline wasteful government. Also monism and functionalist risk. MCQ traps: the 'three broad assertions' vs 'four basic options'; place vs territory reversed; risk absorbed by the LOCAL (not national) public sector; entrepreneurialism spans parties; Orleans (France) colloquium, not New Orleans; serial reproduction makes advantage ephemeral; spatial fix is not an 1989 term."},

{id:"fog", wk:6, title:"Foglesong (1986/2003) Planning the capitalist city", cite:"Foglesong, R.E. (2003). Planning the capitalist city. In S. Campbell & S.S. Fainstein (eds), Readings in Planning Theory (2nd ed.), pp. 102–107. Oxford: Blackwell. Excerpt from Foglesong, R.E. (1986), Planning the Capitalist City: The Colonial Era to the 1920s. Princeton: Princeton University Press.", theory:"Marxist theory of the state / political economy", status:"missing",
 statusNote:"NOT on file. Everything on this page is built from general knowledge of Foglesong's argument, not from the assigned excerpt, and must be checked against the text on Brightspace (Campbell & Fainstein, pp. 102–107). No quotes and no page numbers are given. Treat specific formulations as provisional.",
 one:"Planning in capitalist cities is best explained as a response to contradictions of capitalist urbanisation: above all the property contradiction between the social character of urban land and its private ownership and control, and the capitalism–democracy contradiction. Planning is needed to socialise some control over land for capital's collective interest, yet it is constrained because it must not undermine private property or hand control to democratic majorities.",
 summary:[
  "Problem (general knowledge; verify): mainstream planning theory treats planning as a neutral, technical pursuit of the public interest, or explains it by market failure, without asking why planning exists in capitalist societies and why it takes the limited form it does. Foglesong proposes a Marxist political-economy account that links planning to the structural needs and contradictions of capitalist urbanisation, while rejecting crude functionalism.",
  "Property contradiction (general knowledge; verify): urban land and the built environment are social in character: their value and use depend on collective investment (infrastructure, neighbouring uses) and they serve the reproduction of labour and capital as a whole. Yet land is privately owned and controlled, and individual owners pursue their own returns, producing congestion, incompatible uses, housing crises and threats to property values. Capital collectively needs some socialisation of control over land use (via planning, zoning, public works), but individual capitalists and property owners resist it. Planning is thus both necessary for capital and restricted by it.",
  "Capitalism–democracy contradiction (general knowledge; verify): socialising control over land means transferring decisions to the state, which in a democracy is exposed to popular pressure. The danger for capital is that democratic control over land could go further than capital wants (e.g. redistribution, public housing, limits on property rights). Planning institutions therefore tend to be insulated from democratic control (expert commissions, technical procedures, independent boards), so that planning helps capital while containing popular demands.",
  "Theory of the state (general knowledge; verify): Foglesong positions himself within Marxist debates. Instrumentalist accounts see the state (and planning) as a tool directly controlled by capitalists; structuralist accounts stress that the state has relative autonomy and serves the long-term, collective interests of capital even against individual capitalists. Foglesong leans to a structural, contradiction-based view while leaving room for class struggle and contingency: planning outcomes are shaped by conflicts between capital fractions, property owners and working-class movements. In the 1986 book he applies this to US planning history from the colonial era to the 1920s (housing reform, City Beautiful, zoning)."
 ],
 concepts:[
  ["Property contradiction","Tension between the social character of urban land (collectively produced, collectively needed) and its private ownership and control (general knowledge; verify)."],
  ["Capitalism–democracy contradiction","Socialising land-use control via the state risks democratic control going further than capital accepts; hence planning is insulated from popular pressure (general knowledge; verify)."],
  ["Social character of land","Land value and use depend on collective investments and surrounding uses, not only on the owner's actions."],
  ["Instrumentalist theory of the state","The state (planning) is a tool directly controlled by the capitalist class."],
  ["Structuralist theory / relative autonomy","The state serves capital's long-term collective interests because of structural constraints, even against individual capitalists; it has relative autonomy from specific capitalists."],
  ["Planning as contradictory response","Planning both serves capital (coordination, legitimation) and is constrained by it (property rights, fear of democratic control)."],
  ["Legitimation","Planning also helps legitimise capitalist urban development by presenting it as the public interest."]
 ],

 exam:"Commentary angle: grounded in Marxist political economy and a structuralist theory of the capitalist state (relative autonomy), with planning explained by contradictions rather than by the public interest. Best critiques: (1) liberal pluralism / communicative planning: planning outcomes reflect many competing groups and deliberation, not just capital; Foglesong risks functionalism (explaining planning by its usefulness to capital); (2) Hayek/liberal: the 'social character' of land does not justify central control; prices and property rights coordinate dispersed knowledge better; (3) public choice: planners and politicians pursue their own interests (bureau-maximising), not capital's; (4) neo-institutionalism: planning systems differ nationally (e.g. Dutch/Nordic public landownership) in ways a general theory of capitalism cannot explain. MCQ traps: the property contradiction is NOT between capital and labour but between social character of land and private ownership/control; the capitalism–democracy contradiction concerns the risk of democratic control of property; instrumentalist vs structuralist definitions swapped."},

{id:"hh", wk:6, title:"Hyötyläinen & Haila (2018) Entrepreneurial public real estate policy: Eiranranta, Helsinki", cite:"Hyötyläinen, M. & Haila, A. (2018). Entrepreneurial public real estate policy: The case of Eiranranta, Helsinki. Geoforum 89, 137–144. DOI 10.1016/j.geoforum.2017.04.001", theory:"Political economy of urban land / neoliberal urbanism (Harvey, Brenner & Theodore)", status:"full",
 statusNote:"Built from the full text of the published article (Geoforum 89, pp. 137–144). Page numbers refer to the journal pagination.",
 one:"Finnish cities and the Finnish state, which own much land, have shifted from administrative allocation and leasing to an 'entrepreneurial public real estate policy': selling land or charging market rent to maximise revenue. The Eiranranta case in Helsinki shows unintended harmful effects: the City ceded planning power, dropped its social housing requirement, reinforced exclusion via record prices, and allowed a fenced enclave for the wealthy that is new in a Nordic welfare city.",
 summary:[
  "Concept and method: entrepreneurial public real estate policy is a rent-maximising land and real estate policy carried out not by private landlords, developers or REITs but by municipalities and the state; it takes two forms, selling public land or charging market rent when leasing, and can be called neoliberal in the sense of introducing a market logic to public land (p. 137). Helsinki owns 60% of its land area (p. 138, fn 3). Leasing had kept planning power with town planners and helped produce a heterogeneous urban fabric without glaring inequalities (p. 138). Data: agendas and minutes of the City Council and Real Estate Committee (REC), interviews with 5 of the 9 REC members who decided the 2005 sale, and field observations/photographs (pp. 137–138). Contribution: political economy of urban land and neoliberal urban policies.",
  "Enabling conditions (pp. 138–139): after the early-1990s recession the state closed the National Board of Public Building (1995) and created state real estate companies (Kapiteeli, Senaatti, Sponda); Helsinki began selling land in 1993, calculated 'shadow rents', and in 2005 set up the Premises Centre charging market rent. Three changes 'scaled down' land-use decisions: (1) a new state urban policy making cities compete for state subsidies via 'urban programmes' and public-private partnerships; (2) a redistribution shift under the ideology of 'the necessity to save', turning the welfare state into welfare cities; (3) the Land Use and Building Act (MRL, 1999), which removed state ratification of local plans and legalised 'development areas' and development contracts. The state, now a real estate player itself, lost its impartial mediating role.",
  "Justification (pp. 139–140): four arguments: put public assets to work (Sipilä); make land use efficient; increase transparency; create diversity. The 'necessity to save' became a Bourdieuian 'strong discourse' that made market rule appear natural; the media and some urban scholars (celebrating diversity of 'luxury' and 'rough' areas) supported it. In Eiranranta (former industrial/depot shore next to prestigious Eira, rezoned residential 2001) the REC decided to sell in March 2004; the highest bid would win. Deputy Mayor Pekka Korpinen, an economist, promoted selling shoreline land to maximise revenue and even renamed the area for marketing. REC members cited the budget's sales targets, inter-city competition with Espoo and Kauniainen for 'good taxpayers', and a 'global city' image vis-à-vis Copenhagen, Stockholm and Tallinn: in Harvey's (1989) terms, managerial strategies were replaced with entrepreneurial ones (p. 140).",
  "The deal and outcomes (pp. 141–142): bids hit a Finnish record of €2621/m², €54 million in total; the newcomer investment company Apollo outbid household developers (SRV, NCC, Tarkala) by €3 million; the Real Estate Department preferred Skanska despite its lower bid. The authors suggest established developers were used to undervaluing land and capturing the value created by public development rights; only one councillor opposed the sale. Apartments sold at €10,000–16,000/m². Eiranranta has no social housing, contradicting the metropolitan social-mix policy; REC members saw concentrations of social housing (Kontula, Jakomäki) as the problem, not concentrations of wealth. The master plan required 1.2 m fences and gated entrances; ads stressed that 'no common laundries are needed'.",
  "Conclusion (pp. 142–144): the authors do not call Eiranranta a gated community, since residents pay city taxes, use public services and the fences allow right of passage, but it manifests Harvey's 'neoliberal turn'. Unlike the UK state, the Finnish state itself became a land-rent maximiser, treating land as a financial asset 'according to the rent it yields' (Harvey 1982), and lost the impartiality needed to manage the contradictions of marketisation. Privatising land can mean privatising development rights. Selling to investors like Apollo may break developers' monopoly but risks 'creating liquidity out of spatial fixity' (Gotham 2009). Eiranranta is an experiment at the upper end of the market that contradicts Helsinki's welfare instruments (social housing, tenure mix)."
 ],
 concepts:[
  ["Entrepreneurial public real estate policy","Rent-maximising land policy by municipalities and the state: selling public land or charging market rent (p. 137; concept from Haila 2016)."],
  ["Planning monopoly / development rights","In Finland cities have the sole right to assign development rights, so the value increase due to development belongs to them (p. 138)."],
  ["'Necessity to save'","Post-recession ideology that justified spending cuts and market-based use of public assets; a 'strong discourse' (Bourdieu) naturalising market rule (pp. 139–140)."],
  ["Four justifications","Put public assets to work; efficient land use; transparency; diversity (p. 139)."],
  ["MRL (Land Use and Building Act 1999)","Ended state ratification of local plans and legalised development areas/contracts (PPP), enabling disconnected enclaves (p. 139)."],
  ["Welfare state to welfare cities","Shift of responsibility for social services from state to municipalities, creating pressure to save (p. 139)."],
  ["Inter-city competition for 'good taxpayers'","Helsinki sold Eiranranta to attract high-income residents from Espoo and Kauniainen (income tax is municipalities' main revenue) (p. 140)."],
  ["State as real estate player","By corporatising its real estate, the Finnish state lost impartiality and its capacity to mediate conflicts (pp. 139, 143)."],
  ["Gated community vs exclusive enclave","Eiranranta is fenced and exclusive but not a full gated community: residents pay city taxes, use public services, and passage is allowed (p. 143)."]
 ],

  "\"by selling the land to private developers who developed the area for homeowners, the City ceded its planning power with no demands that the area should include social housing.\" (p. 137)",
  "\"A wish to represent Helsinki as a ‘global city’ was, at that time, one of the key drivers for replacing managerial strategies with entrepreneurial ones (to borrow Harvey’s (1989) terms for these two types of urban governance).\" (p. 140)",
  "REC member: \"Those are the rules of the game today. If you wish to succeed, then city real estate policy must live with the programme. And this isn’t a politically divisive question.\" (p. 141)",

 ],
 dims:{sa:55, rt:70, de:45, us:80, mp:35, norm:"Nordic welfare-city ideals: public land ownership and leasing, social mix, social housing, public capture of land value, equality; critique of neoliberal marketisation."},
 exam:"Commentary angle: grounded in the political economy of urban land (Harvey's land as financial asset, Haila's land rent theory) and neoliberal urbanism (Brenner & Theodore, Peck); Harvey's (1989) managerialism/entrepreneurialism is used explicitly (p. 140). Note it also has a discursive element (Bourdieu's 'strong discourse', Weber's 'discursive practice') and an institutional one (MRL, state urban policy). Best critiques: (1) rational/public choice and Hayek: the 'apologists' argue market prices reveal opportunity costs of land and make subsidies transparent (Pursiainen & Saarimaa); the authors dismiss this without testing welfare effects or counterfactuals (would Eiranranta with leasing have produced social housing?); (2) neo-institutionalism: the story is path-dependent institutional change (MRL, state reform) more than a structural capitalist logic, and Finland's land regime mediates neoliberalism; (3) communicative planning: the REC was a representative forum but there was no real debate and excluded groups had no say, so the problem is also democratic deliberation. Methodological: single case, 5 of 9 interviews, 'unintended' effects partly inferred. MCQ traps: the authors do NOT call Eiranranta a gated community; the Real Estate Department preferred Skanska, not Apollo; it was the state (not only cities) that pioneered entrepreneurial real estate policy."},

{id:"savini", wk:6, title:"Savini & Aalbers (2016) De-contextualisation of land use planning through financialisation: Milan", cite:"Savini, F. & Aalbers, M.B. (2016). The de-contextualisation of land use planning through financialisation: Urban redevelopment in Milan. European Urban and Regional Studies 23(4), 878–894. DOI 10.1177/0969776415585887", theory:"Political economy of financialisation (Harvey's capital switching, land as fictitious capital), with an institutional reading of local government capacity", status:"full",
 statusNote:"Built from the full text of the authors' accepted manuscript ('forthcoming in EURS, OnlineFirst 2015'). Page numbers refer to the manuscript pagination (pp. 1–15), NOT the journal pagination (878–894). Tutorial 4 seminar article.",
 one:"Financialisation turns land into a liquid financial asset whose valuation and investment decisions are made by layered investors far from the site; this de-contextualises land capital from local socio-political contexts and makes planning instrumental to unlocking capital. In the Falck site in Sesto San Giovanni, successive owners and SPVs inflated the programme and land price, while a weak, yield-dependent municipality ended up in gridlocked negotiations.",
 summary:[
  "Argument and trends (pp. 1–4): finance increasingly penetrates land planning and development, but fine-grained case studies of the mechanisms are rare. Building on Harvey's 'capital switching' and land as financial asset, the authors identify three features of contemporary urban development: (a) investment relocation towards riskier peripheral, out-of-prime locations (brownfields in urban belts) expected to yield more in the long run; (b) clustering and enlargement of projects into bigger packages that dissolve demand variations and outplay smaller investors, with standardisation and starchitecture to increase liquidity; (c) instrumental land use planning geared to attracting finance, especially where fiscal stress makes municipalities dependent on incoming capital. They are more sceptical than Weber (2010) that municipalities can use financial markets for their own agenda (p. 2).",
  "De-contextualised land capital (pp. 4–7): as land becomes liquid and part of global portfolios, decisions on its exchange and use are disconnected from the local values, norms and needs where they land; valuations rest on simplified yield projections. Decisions on land-use programmes (local needs) separate from decisions on investment (shareholder profit expectations), with many layers of intermediaries. Land is also used as collateral to create credit for investments elsewhere. Special-purpose vehicles (SPVs) are the key tool: they isolate project risk from the holding, can be bought and sold, and link project gains to shareholders; they are 'both separators and connectors'. Local governments try value capture via regulation, betterment levies, public land development or TIF, but detachment of investment from land-use decisions weakens their understanding and bargaining power.",
  "The Falck case (pp. 7–13): a 150 ha polluted former steelworks in Sesto San Giovanni (80,000+ inhabitants; about a quarter of its area vacant industrial land), negotiated under the PII regime; 15 years without agreement; land sold four times. Periodisation (Table 1): 1990s: Falck Corporation and a public-private agency (PSTA, later ASNM; municipality 80%, province 5%, Falck 15%) pursuing reindustrialisation. 2000: sold (€180M in the text; €140M land cost in Table 1) to local investor Gruppo Pasini, SPV Immobiliare Cascina Rubina with a Banca Intesa loan; modest plan, 9% expected return; not approved. 2005: ICR sold to Risanamento (Gruppo Zunino), clustered with Santa Giulia etc.; Renzo Piano masterplan, ~double floor area, 50% high-end housing, 15% expected gain on ~€5bn. 2009: credit crunch, bankruptcy procedure. 2010: Sesto Immobiliare (Bizzi & Partners; Korean and other investors) buys for €405M, largely via land transfer to creditor banks, conditional on approval of ≥962,000 m² within two years; programme grows to ~1.2M m²; 12% expected return. 2011: council approves; region commits €323M for a health campus.",
  "Explanation and conclusion (pp. 13–15): the outcome results from two concurrent trends: growing institutional distance between developer and investors/creditors, and the municipality's increasing dependence on the project's yields, which weakened its negotiating position. Each transfer bound the project more tightly to financial returns and promises of future yields, and the programme was intensified to cover rising costs and debts; planning became 'functional to the urgent need to unlock capital' rather than a response to local needs. Main features of de-contextualisation: separation of ownership and planning responsibility; SPVs insulating risk; complexified, nested property structures. Theoretically, financialisation goes 'one step further than Harvey foresaw in 1982': land is not only a spatial fix but collateral to create credit elsewhere. The outcome is not inevitable: the complexity of financial constructions and the regulatory position of public authorities differentiate outcomes; governing property-led development requires strong regulation combined with proactive intervention capacity."
 ],
 concepts:[
  ["Financialisation of land","Land treated as a financial asset valued by expected yields and traded in portfolios; increasingly used as collateral to create credit (pp. 2, 5–6, 14–15)."],
  ["De-contextualisation","The detachment of land investment decisions from the socio-economic and political contexts where their effects are felt (pp. 4–5, 14)."],
  ["Three trends","Investment relocation (riskier peripheries), clustering/enlargement of projects, instrumental land use planning (pp. 3–4)."],
  ["Special-purpose vehicle (SPV)","Project company that isolates risk from its generator/holding, can be traded, and channels gains to shareholders; 'both separators and connectors' between planning and investment (p. 6)."],
  ["Capital switching","Harvey's notion of capital moving into the built environment; finance invents new strategies to reconnect global strategies with local production of space (p. 1)."],
  ["Land as fictitious capital","What is bought and sold is title to future ground rent; land becomes an interest-bearing investment (Harvey 1982, quoted p. 14)."],
  ["Value capture","Public capture of land value increments for public benefits; harder when investment decisions are detached from land-use processes (pp. 6–7)."],
  ["Yield dependence of local government","A fiscally weak municipality depends on project returns for public gains, weakening its bargaining capacity (pp. 13–14)."],
  ["PII (Programmi Integrati d'Intervento)","Italian regulatory framework requiring close negotiation between municipal executives and the developer (p. 7)."]
 ],

 exam:"Commentary angle (likely model for the 5 Nov exam): grounded in Marxist political economy of financialisation (Harvey 1982/1985: capital switching, land as financial/fictitious capital, spatial fix), extended by the claim that land now also serves as collateral. But it is not purely structural: the authors deny the outcome is inevitable and name institutional variables (complexity of financial constructions; regulatory versus proactive role of public authorities), which invites a neo-institutionalist reading. Best critiques: (1) neo-institutionalism: the gridlock may stem from Italian institutions (PII negotiation regime, corruption: the 2000s events are under bribery investigation, fn 3, weak municipal capacity) rather than financialisation per se; single extreme case limits generalisation; (2) Weber / agency and regime theory: other cities (Chicago) use finance for their own agenda; local coalitions matter; (3) rational choice / game theory: value capture is a bargaining game (the paper cites Samsura & van der Krabben); a rational choice analysis would explain outcomes by pay-offs and credible commitments; (4) Hayek/liberal: long vacancy could be read as over-regulation blocking market adjustment, which the authors themselves partly admit ('Overregulation might disengage investors', p. 7). MCQ traps: the three trends (relocation, clustering, instrumental planning); SPVs are separators AND connectors; the paper says financialisation goes further than Harvey foresaw (land as collateral), not that Harvey was wrong; the municipality took a regulative, not proactive, role in later phases."}

const FC_B=[
["harvey","What distinguishes urban managerialism from entrepreneurialism (Harvey 1989)?","Managerialism (typical of the 1960s) focused on the local provision of services, facilities and benefits to urban populations; entrepreneurialism (1970s and 1980s) is preoccupied with fostering local development and employment growth through initiatory action (p. 3; p. 4)."],
["harvey","Name the three features of urban entrepreneurialism.","Harvey's 'three broad assertions', true for Baltimore (p. 7): (1) the public-private partnership, integrating local boosterism with local government powers to attract funding, investment and jobs; (2) speculative execution and design, so often the public sector assumes the risk and the private sector takes the benefits; (3) a focus on the political economy of place rather than territory (pp. 7–8)."],
["harvey","What are Harvey's four strategies of inter-urban competition?","His 'four basic options for urban entrepreneurialism' (p. 8), not mutually exclusive: (1) competition within the international division of labour (advantages for producing goods and services); (2) the spatial division of consumption (tourism, spectacle, gentrification, quality of life); (3) acquisition of control and command functions in high finance, government, information and media; (4) redistributions of surpluses through central (US: state) governments, e.g. defence contracts (pp. 8–10)."],
["harvey","What is serial reproduction, and what does it do to competitive advantage?","Inter-urban competition, as an 'external coercive power', may force serial reproduction of world trade centres, cultural and entertainment centres, waterfronts and postmodern malls (p. 10); rapid imitation renders any competitive advantage 'ephemeral' (p. 12). Harvey does not claim competition is necessarily zero-sum: it may open the way to a non zero-sum pattern (p. 5)."],
["harvey","Why does Harvey warn against reifying 'the city'?","It makes it seem as if 'cities' can be active agents 'when they are mere things' (p. 5). Urbanisation is a spatially grounded social process of many actors; urban governance is a coalition and class alliance, much more than urban government (pp. 5–6)."],
["harvey","What is the 'spatial fix' (encyclopedia entry)?","The tendency of capitalism to remake spaces, in new places or by transforming existing ones, to resolve crises of production and overaccumulation (Woodward & Jones 2009, p. 24). Not a term used in the 1989 article."],
["harvey","What is accumulation by dispossession?","Creating new spaces for capital by dispossessing people of spaces and services to which they have rights, e.g. privatisation of state services (encyclopedia entry, p. 27). Later Harvey (2003/2005), not in the 1989 article."],
["harvey","Which theoretical perspective grounds Harvey (1989), and which course perspective best critiques its convergence thesis?","Marxist political economy: inter-urban competition is the 'bearer' of capitalist social relations and a coercive law acting after the event (pp. 14–15). Neo-institutionalism (path dependence, national variation) or regime theory (coalition agency) critique the claim that cities broadly converge; note Harvey himself calls the shift incomplete (pp. 4–5)."],
["harvey","What distinguishes today's urban entrepreneurialism from earlier civic boosterism?","Boosterism is old (Hanseatic League, Italian city states, p. 15); what is new is risk-absorption by the local (rather than national or federal) public sector, whereas earlier private capital was less risk averse (p. 7)."],
["harvey","How does Harvey reconcile seemingly autonomous urban entrepreneurialism with Marxist theory?","Local governance is not automatically captive of capital (unlike Cockburn's local state theory), but Marx's 'coercive laws of competition' discipline its 'lawless caprice' after the event; its relative autonomy is like that of firms exploring paths to accumulation (pp. 14–15)."],
["harvey","What does Baltimore show about image and reality (Harvey 1989)?","Harborplace (1978 referendum) made Baltimore a 'renaissance city' and grew tourism jobs from under 1,000 to over 15,000 (pp. 7, 9), but impoverishment and decline continued ('rot beneath the glitter'); the image consolidated the public-private partnership's power: 'The circus succeeds even if the bread is lacking' (p. 14)."],
["harvey","What progressive potential does Harvey see in urban entrepreneurialism?","The city as a collective corporation with democratic decision-making (Paris Commune) could become a 'progressive urban corporatism' with a geopolitical strategy of inter-urban alliances that mitigates competition; 'Socialism within one city' is not feasible, but cities are power bases (p. 16)."],
["fog","What is Foglesong's property contradiction?","The tension between the social character of urban land (collectively produced and needed) and its private ownership and control (general knowledge; verify against text)."],
["fog","What is the capitalism–democracy contradiction?","Capital needs some socialised control over land via the state, but democratic control could go further than capital wants; planning is therefore insulated from popular pressure (general knowledge; verify)."],
["fog","Instrumentalist vs structuralist theory of the state?","Instrumentalist: the state is a tool directly controlled by capitalists. Structuralist: the state has relative autonomy and serves capital's long-term collective interest, even against individual capitalists."],
["fog","Why is planning both enabled and constrained under capitalism (Foglesong)?","It is needed to coordinate land use and legitimise development for capital as a whole, but it must not undermine private property or hand control to democratic majorities (general knowledge; verify)."],
["fog","Foglesong meets Week 6 cases: where do you see the property contradiction?","In Helsinki (public development rights and land value captured by developers after sale) and in Falck (land's social uses subordinated to financial owners' yields): the social character of land versus private/financial control."],
["fog","Why does Foglesong ask 'why does planning exist' at all?","Because mainstream theory assumes planning pursues the public interest (or corrects market failure) without explaining why it arises in capitalist cities or why it takes its limited form (general knowledge; verify)."],
["fog","What is the functionalism critique of Foglesong?","Explaining planning by its usefulness to capital's collective interest risks assuming what must be shown; it underplays actors' intentions, pluralist conflict and contingent institutional design."],
["fog","Which perspective grounds Foglesong, and which would critique it best in a commentary?","Marxist political economy / structuralist theory of the state. Liberal pluralism or communicative planning (planning as the outcome of many groups and deliberation), Hayek (market coordination), or neo-institutionalism (national variation) are strong critiques."],
["hh","Define entrepreneurial public real estate policy.","A rent-maximising land and real estate policy carried out by municipalities and the state: selling public land or charging market rent when leasing (p. 137)."],
["hh","What four justifications were given for this policy?","Put public assets to work; make land use efficient; increase transparency; create diversity (p. 139)."],
["hh","Which three changes 'scaled down' land-use decisions in Finland?","A new state urban policy making cities compete for subsidies; a redistribution shift under 'the necessity to save'; and the 1999 Land Use and Building Act (MRL) (pp. 138–139)."],
["hh","What three harmful effects did the Eiranranta sale have?","The City ceded planning power and dropped social housing; record prices reinforced exclusion of those who cannot pay market prices; a fenced enclave for the wealthy, new to Helsinki (p. 137)."],
["hh","Why do the authors not call Eiranranta a gated community?","Residents still pay city taxes, use public services, and the fences allow right of passage (p. 143)."],
["hh","What was unique about the Finnish state's role?","By creating state real estate companies it became one player in the market, lost its impartiality and thus its ability to mediate and manage the contradictions of marketisation (p. 143)."],
["hh","How does Eiranranta illustrate Harvey's (1989) shift to entrepreneurialism?","Helsinki sold public land to attract 'good taxpayers' from Espoo/Kauniainen and a 'global city' image vs Copenhagen, Stockholm and Tallinn; the authors explicitly call this replacing managerial with entrepreneurial strategies (p. 140). Public revenue, private enclave: place over territory."],
["hh","Why might Apollo have bid €3 million more than established developers?","Established developers were likely used to undervaluing land and capturing land rent and value from public development rights; Apollo may have bid the market value (pp. 141, 143)."],
["savini","What does 'de-contextualisation' mean in Savini & Aalbers?","The detachment of investment decisions about land from the local socio-economic and political contexts where their effects are felt, as land becomes liquid and part of global portfolios (pp. 4–5)."],
["savini","Name the three trends of contemporary urban development.","Relocation of investment to riskier peripheral locations; clustering/enlargement of projects; instrumental land use planning (pp. 3–4)."],
["savini","What role do SPVs play?","They isolate project risk from the holding, can be traded, and channel gains to shareholders; they are 'both separators and connectors' between planning and investment (p. 6)."],
["savini","Which two concurrent trends explain the Falck gridlock?","Growing detachment between land planning and financial dynamics, and the municipality's growing dependence on the project's yields, which weakened its negotiating capacity (p. 13)."],
["savini","How do the authors go 'one step further than Harvey'?","Land is not only a spatial fix absorbing overaccumulated capital; it is used as collateral to create credit invested elsewhere (pp. 14–15)."],
["savini","Is the Falck outcome inevitable under financial capitalism, according to the authors?","No: the complexity of financial constructions and the regulatory position of public authorities differentiate outcomes; they call for strong regulation plus proactive intervention (p. 15)."],
["savini","Why is local government's value capture harder under financialisation?","When investment decisions are detached from land-use processes, cities poorly understand the economic calculations and cannot define a viable programme; excessive demands risk jeopardising the project (pp. 7, 15)."],
["savini","Helsinki vs Milan: how does the public sector's position differ?","In Helsinki the public sector is the landowner that chose to act as a rent-maximising seller (entrepreneurial public real estate policy); in Sesto the municipality is a regulator without land, dependent on financial owners' yields. Both show planning power drained by market/financial logics."]
