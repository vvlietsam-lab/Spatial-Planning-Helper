<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Spatial Planner helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: app shell — fixed sidebar (desktop) / top bar + bottom tabs (phone), one focused work column. Refs: Linear/Raycast shell + ⌘K, Anki card flow, GitHub activity grid. */
:root{
  --bg:#fafafa; --panel:#ffffff; --soft:#f4f4f5; --ink:#18181b; --ink2:#3f3f46; --muted:#71717a; --line:#e4e4e7; --line2:#d4d4d8;
  --accent:#c8102e; --accent-soft:#fdebee; --good:#15803d; --good-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; --info:#1d4ed8; --info-soft:#dbeafe;
  --shadow:0 1px 2px rgba(24,24,27,.04),0 4px 16px rgba(24,24,27,.05);
  --ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace; --serif:"Instrument Serif",Georgia,serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090b; --panel:#111114; --soft:#18181b; --ink:#fafafa; --ink2:#d4d4d8; --muted:#a1a1aa; --line:#232329; --line2:#34343c;
  --accent:#ff4d6a; --accent-soft:#3a1219; --good:#4ade80; --good-soft:#0f2e1c; --warn:#fbbf24; --warn-soft:#33260a; --info:#7aa2ff; --info-soft:#15213d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090b; --panel:#111114; --soft:#18181b; --ink:#fafafa; --ink2:#d4d4d8; --muted:#a1a1aa; --line:#232329; --line2:#34343c;
  --accent:#ff4d6a; --accent-soft:#3a1219; --good:#4ade80; --good-soft:#0f2e1c; --warn:#fbbf24; --warn-soft:#33260a; --info:#7aa2ff; --info-soft:#15213d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--ui);margin:0;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button{font-family:inherit}
/* shell */
.side{position:fixed;inset:0 auto 0 0;width:248px;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;padding:18px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 12px var(--mono)}
.brand b{font-weight:600;font-size:.95rem;letter-spacing:-.01em}.brand small{display:block;color:var(--muted);font:500 .68rem var(--mono);letter-spacing:.04em}
.kbtn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--muted);font-size:.84rem;cursor:pointer;margin-bottom:14px}
.kbtn span{margin-left:auto}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grp{font:500 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-size:.88rem;font-weight:500;cursor:pointer}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--soft);color:var(--ink)}
.nav button .n{margin-left:auto;font:500 .72rem var(--mono);color:var(--muted)}
.nav svg,.tabbar svg,.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sidefoot{margin-top:auto;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel)}
.sidefoot .big{font:400 2rem/1 var(--serif)}
.sidefoot .lbl{font:500 .7rem var(--mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.main{margin-left:248px;min-height:100%}
.wrap{max-width:960px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:36px 96px}
.topbar{display:none}
.tabbar{display:none}
@media (max-width:899px){
  .side{display:none}.main{margin-left:0}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .topbar .cd{margin-left:auto;font:500 .75rem var(--mono);color:var(--accent)}
  .topbar button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:5px 8px;cursor:pointer}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:.66rem;font-weight:500;padding:4px;cursor:pointer}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar svg{width:20px;height:20px}
  .wrap{padding-block:20px 110px}
}
/* type */
.eyebrow{font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1.hero{font:400 clamp(2.2rem,5vw,3.4rem)/1.02 var(--serif);letter-spacing:-.01em;margin:6px 0 10px;text-wrap:balance}
h1.hero em{color:var(--accent);font-style:italic}
h2{font:600 1.5rem/1.2 var(--ui);letter-spacing:-.02em;margin:4px 0 8px;text-wrap:balance}
h2.serif{font:400 2.1rem/1.1 var(--serif);letter-spacing:-.01em}
h3{font:600 1rem/1.3 var(--ui);letter-spacing:-.01em;margin:28px 0 10px;text-wrap:balance}
h4{font:600 .9rem var(--ui);margin:16px 0 6px}
p{margin:0 0 10px;max-width:68ch}
.lede{color:var(--muted);max-width:64ch}
.small{font-size:.82rem}.mut{color:var(--muted)}
a{color:var(--info)}
/* surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.flat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.divider{height:1px;background:var(--line);margin:18px 0}
/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;font:500 .85rem var(--ui);border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:8px 14px;cursor:pointer;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--soft)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9;background:var(--ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.sm{padding:5px 10px;font-size:.78rem}
.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd,.kbd{font:500 .7rem var(--mono);color:var(--muted);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--soft)}
.btn.primary kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.6}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 .7rem var(--mono);padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.full{color:var(--good);background:var(--good-soft);border-color:transparent}
.chip.partial{color:var(--info);background:var(--info-soft);border-color:transparent}
.chip.slides{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.missing{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.plain::before{display:none}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--soft);border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:500 .8rem var(--ui);padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
select,textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:8px 10px}
textarea{width:100%;min-height:140px;resize:vertical;line-height:1.55}
/* progress */
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--warn);border-radius:99px;transition:width .4s}
.bar.done i{background:var(--good)}
.ring{--p:0;--c:var(--warn);width:var(--s,56px);height:var(--s,56px);border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring::before{content:"";grid-area:1/1;width:calc(100% - 10px);height:calc(100% - 10px);border-radius:50%;background:var(--panel)}
.ring b{grid-area:1/1;font:600 .78rem var(--mono);z-index:1}
.ring.done{--c:var(--good)}
.ring.lg{--s:132px}.ring.lg::before{width:calc(100% - 16px);height:calc(100% - 16px)}.ring.lg b{font:400 2.1rem var(--serif)}
.ring.sm{--s:30px}.ring.sm::before{width:calc(100% - 7px);height:calc(100% - 7px)}.ring.sm b{font-size:.58rem}
.stat{font:400 2.4rem/1 var(--serif);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
/* heatmap */
.heat{display:grid;grid-template-columns:repeat(21,1fr);gap:3px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--good) 30%,var(--panel));border-color:transparent}
.heat i.l2{background:color-mix(in srgb,var(--good) 60%,var(--panel));border-color:transparent}
.heat i.l3{background:var(--good);border-color:transparent}
.heat i.today{outline:1.5px solid var(--ink);outline-offset:1px}
.heat i.exam{background:var(--accent-soft);border-color:var(--accent)}
/* lists */
.list{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.item:first-child{border-top:0}
.item:hover{background:var(--soft)}
.item .t{font-weight:600;font-size:.92rem;line-height:1.3;min-width:0}
.item .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.item .r{display:flex;align-items:center;gap:10px}
.item.mastered .t::after{content:" ✓";color:var(--good)}
@media (max-width:560px){.item .r .chip{display:none}}
.wkhead{display:flex;align-items:baseline;gap:10px;margin:26px 0 8px}
.wkhead b{font:400 1.5rem var(--serif)}
/* reading page */
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px;align-items:start}
.rside{position:sticky;top:24px;display:flex;flex-direction:column;gap:12px}
@media (max-width:1100px){.rgrid{grid-template-columns:1fr}.rside{position:static}}
.back{display:inline-flex;align-items:center;gap:6px;font:500 .82rem var(--ui);color:var(--muted);background:none;border:0;cursor:pointer;padding:0;margin-bottom:14px}
.oneliner{font:400 1.45rem/1.3 var(--serif);border-left:2px solid var(--accent);padding:2px 0 2px 16px;margin:18px 0;color:var(--ink);max-width:62ch}
.fig{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:16px 0}
.fig svg{display:block;max-width:min(100%,760px);height:auto;margin:0 auto}
.fig figcaption{font-size:.78rem;color:var(--muted);margin-top:8px;text-align:center}
svg text{fill:var(--ink);font-family:var(--ui)}
svg .mut{fill:var(--muted)} svg .acc{fill:var(--accent)} svg .accs{stroke:var(--accent)} svg .ln{stroke:var(--muted);fill:none}
svg .bx{fill:var(--panel);stroke:var(--line2)} svg .bxa{fill:var(--accent-soft);stroke:var(--accent)} svg .bxg{fill:var(--good-soft);stroke:var(--good)} svg .bxi{fill:var(--info-soft);stroke:var(--info)} svg .bxw{fill:var(--warn-soft);stroke:var(--warn)}
svg .fg{fill:var(--good)} svg .fi{fill:var(--info)} svg .fw{fill:var(--warn)} svg .fm{fill:var(--muted)}
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px;margin:0}
.concepts div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.concepts dt{font-weight:600;font-size:.88rem}.concepts dd{margin:3px 0 0;font-size:.85rem;color:var(--ink2)}
blockquote{margin:8px 0;padding:10px 14px;border-radius:10px;background:var(--soft);font-size:.9rem;border:1px solid var(--line)}
.note{font-size:.84rem;padding:10px 12px;border-radius:10px;background:var(--warn-soft);border:1px solid transparent;color:var(--ink)}
.note.ok{background:var(--good-soft)}.note.bad{background:var(--accent-soft)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font:500 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
tr:last-child td{border-bottom:0}
.matrix td{min-width:110px}.matrix td:first-child{min-width:170px;font-weight:600}
.pos{display:inline-block;padding:1px 8px;border-radius:6px;font:500 .74rem var(--mono);background:var(--soft)}
.dims{display:grid;gap:10px}
.dim{font-size:.76rem}
.dim .lab{display:flex;justify-content:space-between;color:var(--muted);font-family:var(--mono);font-size:.68rem;margin-bottom:4px}
.scale{position:relative;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--soft),var(--line2),var(--soft))}
.scale span{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);transform:translate(-50%,-50%);box-shadow:var(--shadow)}
/* flashcard */
.stage{perspective:1400px;margin:14px 0}
.fc{position:relative;min-height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.face.back{transform:rotateY(180deg);background:var(--soft)}
.face .q{font:400 clamp(1.4rem,3vw,1.9rem)/1.25 var(--serif);text-wrap:balance}
.face .a{font-size:1.02rem;line-height:1.6;color:var(--ink)}
.face .tag{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);cursor:pointer;font:500 .85rem var(--ui)}
.rate button small{font:400 .7rem var(--mono);color:var(--muted)}
.rate button:hover{background:var(--soft)}
.rate .again{border-color:color-mix(in srgb,var(--accent) 50%,var(--line2))}.rate .good{border-color:color-mix(in srgb,var(--good) 55%,var(--line2))}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.boxes div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:var(--panel)}
.boxes strong{display:block;font:400 1.4rem var(--serif);font-variant-numeric:tabular-nums}
.boxes span{font:500 .66rem var(--mono);color:var(--muted)}
.boxes .ok{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.pbar{display:flex;gap:3px}.pbar i{flex:1;height:4px;border-radius:9px;background:var(--line)}.pbar i.on{background:var(--ink)}.pbar i.r{background:var(--good)}.pbar i.w{background:var(--accent)}
/* quiz */
.qcard{border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow);padding:24px}
.qcard .qq{font:500 1.08rem/1.5 var(--ui);margin:10px 0 16px;max-width:none}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;width:100%;text-align:left;font:400 .93rem/1.5 var(--ui);color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;margin:7px 0;cursor:pointer;transition:background .12s,border-color .12s}
.opt:hover{background:var(--soft)}
.opt .k{font:500 .72rem var(--mono);border:1px solid var(--line2);border-radius:6px;text-align:center;padding:2px 0;color:var(--muted);background:var(--soft)}
.opt.right{background:var(--good-soft);border-color:var(--good)}.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:var(--accent-soft);border-color:var(--accent)}.opt.wrong .k{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.sel{background:var(--info-soft);border-color:var(--info)}
.opt:disabled{cursor:default}
.expl{margin-top:12px;font-size:.9rem;padding:12px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
/* checks */
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;padding:6px 0;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--good);width:16px;height:16px}
.check.done span{text-decoration:line-through;color:var(--muted)}
.plan .day{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.plan .day:first-child{border-top:0}
.plan .d{font:500 .75rem var(--mono);color:var(--muted);padding-top:6px}
.plan .day.today .d{color:var(--accent)}
.plan .day.exam .d{color:var(--accent);font-weight:700}
@media (max-width:560px){.plan .day{grid-template-columns:1fr;gap:2px}}
.weeks{display:grid;gap:10px}
.wk{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.wk .n{font:400 2rem/1 var(--serif);color:var(--muted)}
.wk.now{border-color:var(--ink);box-shadow:var(--shadow)}.wk.now .n{color:var(--accent)}
.wk.past{opacity:.72}
.wk ul{margin:6px 0 10px;padding-left:18px;font-size:.88rem}
@media (max-width:560px){.wk{grid-template-columns:1fr}}
/* palette */
.pal{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--ink) 25%,transparent);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.palbox{width:min(620px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:0 24px 64px rgba(0,0,0,.25);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:1rem;background:transparent;outline:none}
.palres{max-height:52vh;overflow:auto;padding:6px}
.palres button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:10px 12px;border-radius:9px;cursor:pointer;font-size:.9rem}
.palres button.on{background:var(--soft)}
.palres .k{margin-left:auto;font:500 .7rem var(--mono);color:var(--muted)}
.palres .h{font:500 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:.82rem;padding:8px 14px;border-radius:99px;z-index:70;box-shadow:var(--shadow)}
@media (max-width:899px){.toast{bottom:84px}}


/* ===== V2 home: course picker (Apple-style product tiles) ===== */
body.is-home .main{margin-left:0}
body.is-home .side{display:none}
body.is-home .wrap{max-width:1240px}

{id:"fw", wk:1, title:"Course framework: four dimensions & normative commitments", cite:"Lecture 8 Sept (Bossuyt & Bouwmeester) + Rydin (2021) Introduction: Theory and Planning Research, pp. 1–17", theory:"Meta-framework", status:"slides",
statusNote:"Lecture slides on file. Rydin (2021) ch.1 itself is NOT on file (your Rydin upload starts at ch.2); content here comes from the slides that quote it.",
one:"Every planning theory takes a position on four dimensions (structure/agency, reproduction/change, knowledge, normative commitments). Those positions shape which research questions and designs make sense.",
summary:[
"Theory is 'a body of assumptions, of which the mutual relations have been made explicit' (Føllesdal et al. 1990) and, for Rydin (2021, p. 9), 'a heuristic aid to understand a situation, a way to try to know what is essentially unknowable in its completeness'. Ontology + epistemology + values together make up a theory, and a theory steers research design, questions and analysis.",
"The course compares theories on four dimensions: (1) sources of planning outcomes (structure ↔ agency); (2) reproduction and change (reproduction ↔ transformation; deliberate ↔ emergent); (3) knowledge and expertise (universal ↔ situated; monist ↔ pluralist; plus realism ↔ relativism added in the knowledge lecture); (4) normative commitments (efficiency, democracy, equity, sustainability, justice).",
"Theories make three kinds of claims: explanatory (how does planning work, why do outcomes occur), evaluative (which processes/outcomes are fair or good) and prescriptive (what should planners do). Normative commitments are the underlying values used to evaluate planning. They shape what we see as a problem, what planning should achieve, and what we measure in research."],
concepts:[["Theory","A coherent set of assumptions/knowledge claims whose relations are explicit; a heuristic aid, never complete (Rydin 2021)."],["Ontology","What reality is and what exists to be known."],["Epistemology","What knowledge is, who can produce it, how claims are judged."],["Structure","Recurrent, patterned arrangements that limit the choices and opportunities available."],["Agency","The capacity of individuals to act independently and exercise free will."],["Reproduction vs transformation","Does the theory explain why arrangements persist, or how they change?"],["Deliberate vs emergent","Is change designed on purpose, or does it emerge from many interacting actions?"],["Explanatory / evaluative / prescriptive claims","How it works / whether it is good / what to do."],["Normative commitment","Assumption about what ought to be valued, pursued, protected."]],
fig:`<svg viewBox="0 0 640 250" role="img" aria-label="Four dimensions of the course framework"><g font-size="13">
<text x="10" y="22" font-weight="700">1 · Sources of outcomes</text><line x1="230" y1="18" x2="620" y2="18" class="ln" stroke-width="2"/><text x="230" y="36" class="mut" font-size="11">structure</text><text x="620" y="36" class="mut" font-size="11" text-anchor="end">agency</text>
<text x="10" y="72" font-weight="700">2a · Reproduction/change</text><line x1="230" y1="68" x2="620" y2="68" class="ln" stroke-width="2"/><text x="230" y="86" class="mut" font-size="11">reproduction</text><text x="620" y="86" class="mut" font-size="11" text-anchor="end">transformation</text>
<text x="10" y="112" font-weight="700">2b · How change happens</text><line x1="230" y1="108" x2="620" y2="108" class="ln" stroke-width="2"/><text x="230" y="126" class="mut" font-size="11">deliberate</text><text x="620" y="126" class="mut" font-size="11" text-anchor="end">emergent</text>
<text x="10" y="152" font-weight="700">3 · Knowledge</text><line x1="230" y1="148" x2="620" y2="148" class="ln" stroke-width="2"/><text x="230" y="166" class="mut" font-size="11">universal · monist · realist</text><text x="620" y="166" class="mut" font-size="11" text-anchor="end">situated · pluralist · relativist</text>
<text x="10" y="200" font-weight="700">4 · Normative</text><g font-size="12"><rect x="230" y="184" width="70" height="24" rx="12" class="bxa"/><text x="265" y="200" text-anchor="middle">efficiency</text><rect x="308" y="184" width="82" height="24" rx="12" class="bxa"/><text x="349" y="200" text-anchor="middle">democracy</text><rect x="398" y="184" width="58" height="24" rx="12" class="bxa"/><text x="427" y="200" text-anchor="middle">equity</text><rect x="464" y="184" width="96" height="24" rx="12" class="bxa"/><text x="512" y="200" text-anchor="middle">sustainability</text><rect x="568" y="184" width="52" height="24" rx="12" class="bxa"/><text x="594" y="200" text-anchor="middle">justice</text></g>
<text x="10" y="240" class="mut" font-size="11">Place any author on these lines, then ask: what does this position make visible, and what does it hide?</text></g></svg>`,
cap:"The four dimensions you use to position every author in the course.",
example:"A thesis asking 'which municipal instrument best raises housing output?' assumes a deliberate, planner-centred, universal-knowledge view (governmental model). A thesis asking 'how do tenant groups' experiences of renovation differ?' assumes situated, pluralist knowledge.",
quotes:["\"a heuristic aid to understand a situation, a way to try to know what is essentially unknowable in its completeness\" (Rydin 2021, p. 9)"],
dims:null,
exam:"Expect MCQs that give a quote or case and ask where it sits on a dimension. The trap: a survey of 1,000 residents does NOT make an approach pluralist (see Knowledge)."},

{id:"buit", wk:1, title:"Buitelaar (2026) Making sense of The Just City", cite:"Buitelaar, E. (2026). Making sense of The Just City. Defining, choosing, and applying different conceptions of urban justice. Planning Theory. doi:10.1177/14730952261415602", theory:"Normative / political philosophy", status:"partial",
statusNote:"Abstract + lecture slides only. The article is open access (CC BY) but I could not download the PDF from here; see Missing PDFs.",
one:"'The Just City' means four different, partly incompatible things: the Happy, Equal, Supportive and Free City. Planners must choose explicitly.",
summary:["Few people oppose the idea of a just city, but once you look at distribution, people disagree about what it looks like. Buitelaar draws on political and economic philosophy to build four ideal types, each translating into different planning policies. They can look sympathetic at first sight, yet they do not all go together and some are incompatible. Being precise about what urban (in)justice means is necessary for effective and legitimate policy.",
"In the lecture: the Supportive City is illustrated with room-stress (adequacy thresholds) and Vienna's social housing; the Free City with Houston (no zoning) and Almere Oosterwold (framework rules, organic development). The Metropolis case (2,000 market homes with no subsidy vs 1,600 mixed homes with 40% affordable and a €50m contribution) shows how each conception picks a different plan."],
concepts:[["Happy City (utilitarianism)","A city is just when total (or average) well-being is maximised; distribution matters only via the sum."],["Equal City (egalitarianism)","A city is just when goods/opportunities are distributed (more) equally; inequality itself is the problem."],["Supportive City (sufficientarianism)","A city is just when everyone reaches a threshold of 'enough' (adequate housing, e.g. room-stress ≥ 0); above it inequality is acceptable."],["Free City (liberalism)","A city is just when individual liberty and equal rights are protected; fair procedures, not end-state patterns (Houston, Oosterwold)."],["Room stress factor","Rooms available ÷ rooms required − 1; below 0 = inadequate housing (Jonkman 2019)."]],
fig:`<svg viewBox="0 0 640 230" role="img" aria-label="Four just cities judge the same five households differently"><g font-size="12">
<text x="10" y="18" font-weight="700">What each city looks at (5 households, bars = housing quality)</text>
${[["Happy · sum",20,[60,80,30,90,70],"maximise the total"],["Equal · gap",180,[60,62,58,61,59],"shrink the differences"],["Supportive · floor",340,[32,95,45,70,52],"everyone above the line"],["Free · rights",500,[30,90,55,75,65],"fair rules, any pattern"]].map(([t,x,v,s],k)=>`<text x="${x}" y="45" font-weight="600">${t}</text>`+v.map((h,i)=>`<rect x="${x+i*24}" y="${170-h}" width="18" height="${h}" class="${k==2&&h<40?'fw':'fi'}"/>`).join('')+(k==2?`<line x1="${x-4}" y1="130" x2="${x+118}" y2="130" class="accs" stroke-width="2" stroke-dasharray="4 3"/><text x="${x+118}" y="58" class="acc" font-size="10" text-anchor="end">- - threshold</text>`:'')+`<text x="${x}" y="190" class="mut" font-size="11">${s}</text>`).join('')}
<text x="10" y="220" class="mut" font-size="11">Same city, four verdicts: the conceptions can be incompatible (Buitelaar 2026).</text></g></svg>`,
cap:"The criterion changes the verdict, not the data.",
table:{head:["Conception","Philosophy","'A city is just when…'","Metropolis case would pick"],rows:[["Happy","Utilitarian","…aggregate welfare is highest","Probably 2,000 market homes (more homes, no €50m cost), unless welfare gains of the poor weigh heavily"],["Equal","Egalitarian","…differences between groups are smallest","Mixed plan (40% affordable, priority to low incomes)"],["Supportive","Sufficientarian","…nobody falls below a decent minimum","Mixed plan, judged on how many of the 2,000 inadequately housed get adequate homes"],["Free","Liberal","…rights are equal and people are free to use property","Market plan: it complies with the rules and needs no coercion or subsidy"]]},
example:"Amsterdam's 40-40-20 rule (40% social, 40% mid, 20% free sector) mixes Equal and Supportive thinking. Houston's lack of zoning is the textbook Free City.",

/* ================= WEEK 2 ================= */
{id:"hall", wk:2, title:"Hall (2014/2020) The City of Theory", cite:"Hall, P. (2020). 'The City of Theory', from Cities of Tomorrow (4th edn, 2014), in The City Reader, pp. 440–453", theory:"Intellectual history of planning thought", status:"full",
statusNote:"Full chapter on file (your scanned PDF; I ran OCR on all 29 pages).",
one:"After 1955 planning became an academic discipline and swung from craft (design) to science (systems/rational planning), then fragmented (Lindblom, Davidoff, Marxists, communicative theory), and in the process lost its 'priestly clothing'.",
summary:["Before 1955 planning was an extension of architecture and engineering: design-based, blueprint end-state plans, survey–analysis–plan (Geddes), with 'theory in planning but no theory of planning'. Goals were implicit, the planner 'would get it right first time', and the political environment was passive: Batty calls it planning's golden age (e.g. Abercrombie's static city with a green belt).",
"The 1950s baby boom, economic boom and mass car ownership overwhelmed that static system. At the same time a 'quantitative revolution' (location theory: von Thünen, Weber, Christaller, Lösch; Isard's regional science) and cybernetics (Wiener) arrived. 1960–70: the systems revolution. Cities are systems to be modelled, monitored and controlled (McLoughlin, Chadwick; transportation studies Detroit 1955, Chicago 1956; Lowry model). Rational planning is the theory of the process (Faludi), systems planning the theory of the object. Planning becomes a science, not an art.",
"From 1965 to 1975 critiques 'stripped the planner of whatever priestly clothing' he or she had: from the right/pluralists (Lindblom's muddling through; Meyerson & Banfield; Altshuler) and from the left (Davidoff's advocacy planning; Arnstein). Rittel & Webber's wicked problems undercut optimal solutions. Then came the Marxist ascendancy (Harvey, Massey, Castells, Lefebvre): planning serves the reproduction of capital and labour, so planning theory is a product of social forces, a logic Hall calls 'strangely quietist'. Forester tries to resolve it with Habermas: communicative action. Hall's jab: stripped of its philosophy, it is 'good old-fashioned democratic common sense', i.e. Davidoff again. Theory and practice: honeymoon in the 1960s, tiffs in the 1970s, divorce in the 1980s."],
concepts:[["Planning as craft","Pre-1955: design-based, blueprint, end-state plans, intuitive expert goals."],["Theory in vs theory of planning","Borrowed snippets of theory about cities vs a theory of what planning (the process) is."],["Systems planning","Theory of the object: the city as a system of interrelated activities in flux, monitored and controlled (cybernetics)."],["Rational (process) planning","Theory of the process: goals → inventory → model → forecast → alternatives → evaluation → choice → monitoring (Faludi 1973)."],["Priestly clothing","The planner's special status and mystique as expert, lost 1965–75."],["Marxist critique","Planning is a function of the capitalist state: it secures accumulation and reproduction of labour, and always solves one problem by creating another."],["Communicative turn","Forester (via Habermas): planning as communicative action that can distort or reveal; later Healey, Innes. Rydin (2007) calls it the 'new orthodoxy'."],["Planning graduate 1955/1965/1975","Drawing board → analysing computer output → talking to community groups in the evenings (Hall, p. 386)."]],

cap:"Lecture 15 Sept's reading of Hall: craft › positivism › fragmentation › consensus(?).",
example:"The Dutch Vinex-era models and MKBA practice are the 1960s systems/rational legacy still alive; a participatory 'omgevingsdialoog' under the Omgevingswet is the communicative legacy.",

{id:"know", wk:2, title:"Rydin (2007) Re-examining the role of knowledge within planning theory", cite:"Rydin, Y. (2007). Planning Theory, 6(1), 52–68 · + lecture 'Knowledge in planning theory' (15 Sept) + exit-ticket answers", theory:"Epistemology of planning", status:"slides",
statusNote:"Article NOT on file. Built from the knowledge lecture and the exit-ticket document, which reproduce its core (Figure 1, opening up/closing down, Collins & Evans). Please upload the PDF.",
one:"Planning links knowledge to action. After the communicative turn we accept many knowledges, but not all claims are equally valid: planners must open up to claims AND close down by testing them, and they co-produce knowledge in the process.",
summary:["Planning = linking knowledge to action, in the governing of shared spaces, for desirable futures (Friedmann 1987; Healey 1997). Planning's authority always rested on a claim about knowledge. Rydin defines knowledge as knowledge claims specifying causal relations: if we do X, then Y follows.",
"The communicative turn is a 'new orthodoxy': knowledge is held by residents and other groups, not only planners. But deliberation has limits: knowledges are not additive (Evans & Marvin 2006), consensus does not guarantee the best knowledge won, and consensus fits cases of fully shared information or very high uncertainty, while planning deals with wicked problems.",
"Rydin distinguishes types of knowledge claims (Figure 1): empirical (the situation now, A), predictive (what happens without planning, B2), processual (the causal links between states, how intervention leads to outcomes) and normative (the desired planned future, B1). Each needs a different test. Opening up gives voice to many actors and claims; closing down tests claims and decides which count as knowledge for this decision. Experience 'is not of itself a sufficient condition for it to be knowledge' (p. 56, after Collins & Evans).",
"Her own position: knowledge is socially constructed (soft relativism), many actors can bring valid knowledge (pluralist), yet claims can be ranked against each other (not strong relativism)."],
concepts:[["Universal ↔ situated","Does the validity of a claim depend on who produced it and from where? Universal: no. Situated: yes. Positionality is the tell-tale sign."],["Monist ↔ pluralist","How many independent sources can give a claim the status of knowledge? Monist: one (the scientific method, 'the scientific prism'). Pluralist: several (local, experiential, lay)."],["Realism ↔ relativism","Can competing claims be judged against each other? Realist: yes, about a real world. Relativist: only within frameworks. Soft relativism: knowledge is produced in contexts. Strong relativism: no claim is better."],["Positivism","Universal + monist; one method for nature and society; value-free science; bias = error to remove."],["Post-positivism","Situated + pluralist; science never fully value-free; many shades of grey."],["Empirical / predictive / processual / normative claims","What is / what will be without planning / how X causes Y / what should be."],["Opening up & closing down","Invite many claims, then test which count as knowledge for this decision."],["Co-production","Planners don't just manage claims; they co-produce knowledge in the process."],["Multi- vs transdisciplinary","Multi = several academic disciplines (can still be monist). Trans = non-academics as knowledge producers (pluralist)."]],

cap:"Redrawn after Rydin (2007) Fig. 1, as in the lecture. Practice: 'Car ownership in Utrecht fell 12% 2015–2023' = empirical; 'Rijnenburg demand will exceed supply by 2030' = predictive; 'densification near stations reduces car use because it changes relative costs' = processual; 'Rijnenburg should prioritise affordability' = normative.",
table:{head:["Position","What is knowledge?","Who produces it?","Judging claims","Planning style"],rows:[["Positivism","Universal","Monist (science)","Realist","Rational/systems planning, MKBA, models"],["Rydin 2007","Situated (socially constructed)","Pluralist","Soft relativist, claims can be tested","Opening up + closing down, co-production"],["Strong relativism","Situated","Pluralist","No claim better than another","(rarely held in planning)"],["Communicative theory","Situated","Pluralist","Consensus/deliberation","Healey, Innes, Forester"]]},
example:"Grenfell Tower: the Grenfell Action Group's warnings (local experiential knowledge) were ignored. Opening up would have heard them; closing down would have tested them against fire-safety evidence.",
quotes:["\"The experience of local stakeholders may be an important basis for claiming local or experiential knowledge but [..] such experience is not of itself a sufficient condition for it to be knowledge\" (Rydin 2007, p. 56)"],
dims:{sa:null,rt:null,de:null,us:75,mp:80,norm:"Better decisions through tested, co-produced knowledge; democratic inclusion balanced by validity."},
exam:"Classic traps from the lecture: (1) a survey of 1,000 people is not pluralism; (2) a positivist can admit bias but treats it as error; (3) situated ≠ anything goes (that is the realism/relativism axis)."},

{id:"marx", wk:2, title:"Marx (1844) Estranged Labour", cite:"Marx, K. (1844). Economic and Philosophic Manuscripts of 1844: Estranged Labour. Marxists Internet Archive · + lecture 17 Sept", theory:"Marxism / historical materialism", status:"full",
statusNote:"The assigned reading IS the online Marxists Internet Archive text (marxists.org/archive/marx/works/1844/manuscripts/labour.htm); quotes checked against it. Plus the HC4 lecture (17 Sept).",
one:"Under capitalism workers are estranged from their product, their activity, their species-being and each other. History is driven by class struggle over the means of production, so real change needs a structural change of the base: abolition of private property.",
summary:["Humans realise themselves through labour, their transformative relation with nature. Under private property and wage labour this relation is inverted: 'The worker becomes all the poorer the more wealth he produces.' Marx names four estrangements: from the product (it confronts him as an alien power), from the act of production (labour is 'not voluntary, but coerced; it is forced labor'), from species-being (conscious creative activity reduced to a means to survive) and from other humans.",
"Private property is the 'product, the result, the necessary consequence, of alienated labor', though it then reproduces it. An enforced increase of wages would be 'nothing but better payment for the slave' and would not restore human significance to labour.",
"Lecture framing: Marx adapts Hegel's dialectic but replaces 'the Spirit' with material relations (historical materialism). The base (means and relations of production) determines the superstructure (values, norms, ideology). This is a deterministic view: humans are subject to, not actors of, broad change. Politically this becomes revolution: abolish private property, pass through a socialist state towards a stateless society. For planning: markets produce material inequality by design, so the progressive planner plans for the poor and the working class through decommodified models (Madden & Marcuse 2016)."],
concepts:[["Estranged/alienated labour","Four forms: from the product, from the labour process, from species-being, from other people."],["Species-being","The human capacity for conscious, free, purposeful creative activity."],["Historical materialism","The material base (means and relations of production) drives history and shapes the superstructure."],["Base / superstructure","Economy and property relations / ideology, law, culture, norms."],["Dialectic","History as the clash of opposites: owners vs the disowned (class struggle)."],["Means of production","Land, factories, tools; ownership defines class."],["Commodification","Turning things (labour, housing, land) into goods produced for exchange value, not use value."]],
fig:`<svg viewBox="0 0 620 230" role="img" aria-label="Marx base and superstructure"><g font-size="12">
<polygon points="310,20 520,110 100,110" class="bxi"/><text x="310" y="70" text-anchor="middle" font-weight="700">SUPERSTRUCTURE</text><text x="310" y="90" text-anchor="middle" class="mut" font-size="11">law · planning · ideology · norms · culture</text>
<rect x="100" y="140" width="420" height="60" class="bxa"/><text x="310" y="165" text-anchor="middle" font-weight="700">BASE</text><text x="310" y="185" text-anchor="middle" class="mut" font-size="11">means + relations of production (owners ↔ workers)</text>
<path d="M310 138 L310 114" class="accs" stroke-width="3"/><polygon points="303,118 317,118 310,108" class="acc"/>
<text x="540" y="170" font-size="11" class="mut">determines</text><text x="20" y="222" class="mut" font-size="11">Change = transform the base (abolish private property); planning inside capitalism mostly reproduces it.</text></g></svg>`,
cap:"Structure dominates: planning sits in the superstructure.",
example:"HC4 slide, quoting Madden & Marcuse (2016): overcrowding and unaffordable homes 'are not market failures, they are how the market works'. The answer is decommodified housing (public, cooperative), not a tweak of zoning.",
quotes:["\"The worker becomes all the poorer the more wealth he produces\"","\"Private property is thus the product, the result, the necessary consequence, of alienated labor\""],
dims:{sa:15,rt:80,de:35,us:30,mp:25,norm:"Material equality through shared ownership of the means of production."},
exam:"Contrast with Hayek. Marx: structure, determinism, material equality, the state redistributes. Hayek: agency, indeterminism, equality of rights, framework rules. Both are ontological realists (exit ticket)."},

{id:"hayek", wk:2, title:"Hayek (1944) Planning and democracy", cite:"Hayek, F.A. (1944). Planning and democracy. In Hillier & Healey (eds) (2008) Critical Essays in Planning Theory Vol. 1, pp. 42–53 (ch. 5 of The Road to Serfdom)", theory:"Liberalism / Austrian economics", status:"slides",
statusNote:"Chapter NOT on file. Built from the lecture (17 Sept) plus my general knowledge of The Road to Serfdom ch. 5; check against the text.",
one:"Central planning needs agreement on a complete scale of values that does not exist. Assemblies cannot agree on detail, so power slides to experts and ultimately to dictatorship. No one can know enough to plan society; spontaneous order under general rules works better.",
summary:["Context: the Great Depression and WWII made central (economic) planning look inevitable. Hayek argues that directing the economy towards a single social goal requires a 'complete ethical code' ranking all ends. No such agreement exists in a free society. Democratic assemblies can agree that there should be a plan but not on its content, so planning is delegated to experts, democracy becomes a talking shop, and the demand for a strong man grows (the road to serfdom).",
"Epistemologically (and in 'The theory of complex phenomena', 1989 per the lecture): total understanding of society is unknowable. Knowledge is dispersed among individuals, local and often tacit. So stop trying to steer phenomena to a desired end-state. A spontaneous order, decentralised and emerging from individuals acting under general rules, is more efficient and adaptable than any central plan.",
"For planning: set framework conditions (equality of rights, the rule of law) and let order emerge. Intervention may still be justified for conflicting land uses, poor quality space and locational matters (Glaeser & Gyourko on the liberal side of the lecture)."],
concepts:[["Spontaneous order","Order that emerges from decentralised actions under general rules, not from a designer's plan."],["Dispersed knowledge","Knowledge of particular circumstances is spread over many people; no planner can collect it."],["Indeterminism","Social events are not fully determined or predictable (vs Marx's determinism)."],["Individualism","The individual, not the collective, as the basis of ends and values."],["Equality of rights","Formal equality before general rules (vs material equality)."],["Road to serfdom","Central planning leads, via delegation to experts, to loss of freedom."]],

cap:"Hayek's core contrast, which Moroni (week 4) calls taxis vs kosmos.",
example:"Glaeser & Gyourko (2003): strict zoning acts like a tax on new construction and raises prices, so reform the rules instead of building a few subsidised units.",
quotes:[],
dims:{sa:80,rt:40,de:85,us:70,mp:75,norm:"Liberty; equality of rights; efficiency through spontaneous order."},
exam:"Hayek on knowledge is subtle: knowledge is dispersed and local (situated/pluralist-ish), but his claims about markets and order are general. The exam may ask 'emergent or deliberate?' → emergent."},

{id:"cozz", wk:2, title:"Cozzolino (2020) The (anti) adaptive neighbourhoods", cite:"Cozzolino, S. (2020). Environment and Planning B: Urban Analytics and City Science, 47(2), 203–219 · Tutorial 1 slides", theory:"Complexity / liberal (Hayek–Moroni line)", status:"slides",
statusNote:"Article NOT on file. Built from the Tutorial 1 slides (which quote pp. 205–206) plus my knowledge of the paper; please upload it.",
one:"Many recent neighbourhoods are anti-adaptive: their design, ownership and rules block small, incremental changes by residents. Planners should distribute design control and use simple framework rules so neighbourhoods can keep adapting.",
summary:["A conceptual article with illustrative examples (Bergamo; Almere Oosterwold), no empirical test. Aims: 'characterizing the causes behind the formation and perpetuation of AANs' and 'providing policy and design implications' (p. 205).",
"Problem: anti-adaptive neighbourhoods (AANs) resist the ordinary, incremental change that made traditional cities rich and diverse. Causes: large-scale, one-shot, top-down production by a single developer/designer; over-detailed plans and regulations; ownership forms (large plots, condominium or collective ownership) that concentrate or freeze design control. Mechanism: residents and small actors cannot modify, add or replace, so change needs costly big interventions. Alternative: adaptive neighbourhoods have small plots, many owners, distributed design control and simple, general rules (Oosterwold: framework rules, organic development). Implication: plan the conditions and rules, not the end-state.",
"Tutorial analysis: normative preference for individual autonomy, distributed control, diversity, anti-paternalism, which fits the Free City. On structure/agency: 'action (as the main source of urban change)' (p. 206), while acknowledging the 'institutional framework that shaped [the city's] evolutionary process' (p. 206), so it leans to agency with institutions enabling or constraining."],
concepts:[["Anti-adaptive neighbourhood (AAN)","Neighbourhood whose physical, ownership and regulatory set-up blocks incremental change."],["Adaptability","Capacity of the built environment to change gradually through many small actions."],["Distribution of design control","Many actors each controlling small parts vs one actor controlling everything."],["Framework rules","Simple general rules within which people build freely (Oosterwold)."],["Incremental development","Small, step-by-step change over time."]],

<text x="150" y="20" text-anchor="middle" font-weight="700">Adaptive: many small plots</text><text x="470" y="20" text-anchor="middle" font-weight="700">Anti-adaptive: one block, one owner</text>

/* ================= WEEK 3 ================= */
{id:"gov", wk:3, title:"Rydin (2021) Governmental models: the hope of rational public administration", cite:"Rydin, Y. (2021). Theory in Planning Research, ch. 2, pp. 19–40. Springer · + lecture 22 Sept", theory:"Rational-comprehensive planning (governmental model)", status:"full",
statusNote:"Full chapter on file.",
one:"The governmental model frames planning as a rational, linear (with feedback) process in which politicians set goals and expert planners choose the best means. Research within it becomes policy evaluation: 'a critical friend shadowing the steps'.",
summary:["Justification comes from welfare economics: markets fail through externalities, missing markets (information), public and merit goods and monopoly (including landowners'), so the public sector intervenes in the public interest. The public interest in this view is the greatest net benefit to society, and planning is welfare optimisation.",
"In the Weberian tradition goals 'stand outside the planning process'. Politicians set ends; public administration brings 'expert knowledge to bear on the options available'. The ideal process is Lichfield et al.'s (1975) eleven steps, from problem definition to review. Four features: (1) evidence-based planning, where knowledge 'can be gathered and made available to the planning process in a positive way' (p. 22); (2) a comprehensive synthesis across all dimensions (triple bottom line, systems thinking à la McLoughlin); legitimacy 'comes from the rationality of the analysis' (p. 24); tools such as EA/SEA, CBA, MCA and GIS inform but do not decide; (3) formulation to implementation, with policy instruments (direct investment, strategic spatial planning, regulation, fiscal measures, tradeable permits, information/nudges); (4) implementation studies show how tools are used matters, planners exercise discretion and negotiate, and the politics/administration line blurs.",
"Critiques from the lecture: wicked problems (Rittel & Webber 1973), incrementalism/muddling through (Lindblom 1959), advocacy planning (Davidoff 1965). Its ideal-typical assumptions are complete information, clear agreed goals, and objective value-free decisions separated from politics. Yet 'rationality is dead but keeps showing up' (Brooks 2002): e.g. the Dutch MKBA (social cost-benefit analysis) of the toll-free Westerscheldetunnel (net welfare gain €27–39m, ratio 1.5, but 'the feeling of injustice about the toll' could not be priced)."],
concepts:[["Instrumental rationality","Choosing the most efficient means for given ends; planning = optimisation."],["Weberian separation","Politicians set goals; trained officials apply impersonal rules and expertise to choose means."],["Market failure","Externalities, missing markets, public goods, merit goods, monopoly; justifies planning (welfare economics)."],["Lichfield's 11 steps","Problem definition → decision to act → data/forecast → constraints/objectives → criteria → design → test alternatives → evaluate → decide → implement → review."],["Comprehensive synthesis","Integrating all dimensions of a problem into one balanced view; source of legitimacy."],["Evidence-based planning","'we can make policies work better if we understand how policy mechanisms bring about change' (Sanderson 2002)."],["Implementation studies","How tools are used; discretion and negotiation; goals reformulated during implementation."],["Critical friend","Research within this model mirrors the model: evaluation of steps, goals taken as given."],["MKBA","Dutch social cost-benefit analysis: compares options with a no-policy future, in euros where possible."]],
fig:`<svg viewBox="0 0 640 250" role="img" aria-label="Rational planning cycle with politics setting goals"><g font-size="11">
<rect x="230" y="8" width="180" height="36" rx="8" class="bxa"/><text x="320" y="31" text-anchor="middle" font-weight="700" font-size="12">Politics sets goals</text>

cap:"Linear with feedback loops (after Lichfield et al. 1975 / CATS steps). Goals come from outside the process.",
table:{head:["Assumption","Challenged by"],rows:[["Complete, accurate information","Wicked problems (Rittel & Webber); Lindblom's bounded knowledge; Hayek's dispersed knowledge"],["Clear, agreed goals","Lindblom (means and ends chosen together); Davidoff (plural interests); Buitelaar (conflicting justice)"],["Objective, value-free, politics separate from administration","Davidoff (planners aren't neutral); implementation studies (discretion); Marxists (serves capital)"]]},

{id:"scott", wk:3, title:"Scott (1998/2020) The high-modernist city", cite:"Scott, J.C. (2020). Seeing Like a State, ch. 4 'The High-Modernist City: An Experiment and a Critique', pp. 103–146. Yale UP", theory:"Critique of authoritarian high modernism", status:"full",
statusNote:"Full chapter on file (from your book text).",
one:"High-modernist planning (Le Corbusier, CIAM, Brasília, Chandigarh) imposed a legible, geometric, functionally segregated order seen from above. It produced visual order but social failure, and an unplanned city at the margins. Jane Jacobs's street-level view shows real order is complex and experienced.",
summary:["High modernism = a strong belief in scientific and technical progress, rational design of the social order, and state power to impose it (with a weak civil society). Le Corbusier's 'total city planning': a tabula rasa, geometry and standardisation (right angles, the straight line), strict functional segregation (work, home, leisure, traffic), and 'rule by the plan, the planner, and the state': the plan is to be imposed, with no consultation. He saw the city from the air; the plan was a utopian project, legible and easy to police.",
"Brasília (Costa and Niemeyer, under Kubitschek) is 'the closest thing we have to a high-modernist city'. It was built from zero on state land as a 'utopian miniaturization' meant to transform Brazil. Residents got 'brasilite': no street corners, no crowds, uniform superquadra blocks, disorientation. Legibility for administrators meant confusion for residents. By 1980, 75% of the population lived in unplanned settlements; the planned city depended on the unplanned one ('symbiotic'). Chandigarh (Le Corbusier) repeated this: monumental axes, empty squares, hawkers banned.",
"Jacobs (1961) critiques from street level: visual order ≠ experienced order; function, not surface regularity, defines order; mixed use and complexity ('cross-use') are functionally superior; single-use zoning simplifies for planners. Planning as 'urban taxidermy': cities treated as works of art instead of living systems. Scott's wider point (ch. 9) is that high modernism ignores practical, local knowledge (mētis)."],
concepts:[["High modernism","Faith in science/technology and state power to rationally redesign society and space."],["Legibility","Making society readable and controllable from the centre through simplification and standardisation."],["Functional segregation","Separating work, housing, leisure and traffic into zones."],["Utopian miniaturisation","Building a model city from scratch to demonstrate a new society."],["Brasilite","Residents' 'disease' of anonymity and missing street life in Brasília."],["Unplanned Brasília","Squatter and satellite settlements housing most people, symbiotic with the planned core."],["Visual vs experienced order","Jacobs: tidy geometry ≠ a well-functioning, lived environment."],["Mētis","Practical, local, experience-based knowledge high modernism ignores."]],

<circle cx="200" cy="125" r="95" class="bxa" fill-opacity=".35"/><circle cx="200" cy="125" r="40" class="bxi"/><text x="200" y="122" text-anchor="middle" font-weight="700" font-size="12">Plano Piloto</text><text x="200" y="138" text-anchor="middle" class="mut">legible, geometric</text>
${[[70,40],[330,50],[340,200],[60,210],[200,20],[20,125],[380,125]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="16" class="bxw"/>`).join('')}

cap:"Scott: the cost of order at the centre required an unplanned city at the margins.",
example:"Dutch post-war 'wijkgedachte' neighbourhoods (Bijlmermeer: high-rise, separated traffic levels) are a local high-modernist case, and its 1990s partial demolition a Jacobs-style correction.",
quotes:["\"the cost of this kind of order and legibility at the center of the plan virtually required that it be sustained by an unplanned Brasília at the margins. The two Brasílias were not just different; they were symbiotic.\"","\"there is no necessary correspondence between the tidy look of geometric order on one hand and systems that effectively meet daily needs on the other\" (on Jacobs)"],
dims:{sa:40,rt:60,de:70,us:80,mp:80,norm:"Scott's own view: respect for local practical knowledge, livability, humility about state planning."},
exam:"Careful: high modernism itself is universal/monist/deliberate; Scott's critique of it is situated/pluralist (mētis) and shows emergent, unplanned outcomes. An MCQ may ask about either."},

{id:"davoudi", wk:3, title:"Davoudi (2006) Evidence-based planning: rhetoric and reality", cite:"Davoudi, S. (2006). DisP – The Planning Review, 42(165), 14–24", theory:"Post-positivist critique of evidence-based policy", status:"missing",
statusNote:"NOT on file. Your seminar team led this article on 24 Sept, so you probably have it: upload it and I'll check this card. Built from the lecture/exit ticket plus my knowledge of the paper.",
one:"The 'evidence-based' turn in (UK New Labour) policy assumes a linear, rational link from research to decision. In planning, evidence is contested, value-laden and used selectively, so we should speak of evidence-informed planning and recognise knowledge use as an interactive, 'enlightenment' process.",
summary:["Evidence-based policy became a mantra ('what matters is what works') and revived the rational model's hope that better knowledge produces better decisions. Davoudi questions this: the rhetoric assumes a hierarchy of evidence with quantitative, generalisable research at the top and a direct, instrumental use of research in decisions.",
"In reality planning deals with contested values and wicked problems; evidence can become 'policy-based evidence', gathered to justify decisions already made. Research influences policy in several ways (after Weiss): instrumental/problem-solving, but more often conceptual or enlightenment (gradually changing how problems are framed), interactive and political/tactical.",
"She argues for evidence-informed rather than evidence-based planning, a broader, pluralist notion of what counts as evidence, and attention to how knowledge is interpreted in practice. The lecture and exit ticket add Hoch's image, which Davoudi uses: planners do not uncover facts like geologists, but, like lawyers, organise facts as evidence within arguments. That is a post-positivist position."],
concepts:[["Evidence-based planning/policy","The rational-model hope that research evidence directly determines 'what works'."],["Policy-based evidence","Evidence selected or produced to justify a decision already made."],["Evidence-informed planning","Evidence as one input among values, politics and judgement."],["Instrumental vs enlightenment use","Direct problem-solving use vs gradual reframing of how problems are understood (Weiss)."],["Planners as lawyers (Hoch)","Organising facts as evidence in arguments, not discovering facts like geologists."]],
fig:`<svg viewBox="0 0 620 200" role="img" aria-label="Linear versus interactive model of evidence use"><g font-size="12">
<text x="20" y="22" font-weight="700">Rhetoric: linear model</text>

<text x="20" y="110" font-weight="700">Reality: interactive, value-laden</text>
<circle cx="310" cy="150" r="30" class="bxa"/><text x="310" y="154" text-anchor="middle" font-size="11">decision</text>

cap:"From evidence-based to evidence-informed.",
example:"A municipality commissions a housing-demand study after it has already chosen a location: policy-based evidence.",
quotes:[],
dims:{sa:null,rt:null,de:null,us:70,mp:70,norm:"Legitimate, transparent use of knowledge; humility about evidence."},
exam:"Positions Davoudi as a critic of the rational model's knowledge assumptions (post-positivist), not as an opponent of evidence as such."},

{id:"alex", wk:3, title:"Alexander: after rationality (contingency theory)", cite:"Alexander, E.R. (2017/orig. 1990s). After Rationality: Towards a Contingency Theory for Planning · + his 2000 definition of rationality in the 22 Sept lecture", theory:"Rationality debate / contingency theory", status:"full",
statusNote:"Chapter on file (the PDF's text layer was scrambled; I decoded it, so punctuation and numbers are lost, but the argument is readable). Note: this chapter is not listed in the syllabus week plan.",
one:"Rationality has broken down as planning's single paradigm, but nothing has replaced it. Alexander proposes a contingency framework: classic rationality (individual deliberation) and Habermas's communicative action (interaction) are mirror images, each valid in its own domain.",
summary:["Rationality plays two roles: a descriptive model (explaining decisions as if actors are rational) and a normative paradigm (analytic standard and prescription), and it remains the basis of planners' claims to expertise.",
"Responses to its breakdown: ritual (keep using it with token acknowledgment of anomalies), avoidance (swap in descriptive models such as Simon's satisficing or Lindblom's disjointed incrementalism), abandonment (drop process models for intuition, or for a substantive ideology such as neo-Marxism or public choice) and search (new paradigms, contingency models). The procedural-vs-substantive debate is sterile: it is really about level of abstraction (two dimensions: procedural↔structural focus; concrete↔abstract).",
"Critical theory/TCA (Habermas) adds reflexive consciousness and the shift from decision to interaction, but it is normative, procedural, and ignores the pre-interactive deliberation by which actors decide what to pursue. Most real interaction is strategic, not communicative. Rationality ignores interaction; TCA ignores deliberation. 'One paradigm cannot supplant another', so a contingency framework combines them.",
"Lecture use: rationality is 'no more than a more sophisticated word for reason' (Alexander 2000, 4): having reasons (linking means to ends) and giving reasons (justification). The midterm example question also quotes Alexander's institutional design: 'the deliberate creation of institutions by planners to achieve politically defined societal goals', which Moroni criticises (week 4)."],
concepts:[["Rationality (Alexander 2000)","Having reasons (means-ends) + giving reasons (justification)."],["Four responses","Ritual · avoidance · abandonment · search."],["Contingency theory","Different models are valid under different conditions; a framework assigns domains."],["Communicative vs strategic action","Oriented to consensus through argument vs to success through power and manipulation."],["Institutional design (Alexander 2005)","Devising rules, procedures and organisational structures to achieve held values/objectives; at macro, meso and micro levels."]],
fig:`<svg viewBox="0 0 620 170" role="img" aria-label="Rationality and communicative action as mirror images"><g font-size="12">
<rect x="20" y="30" width="260" height="110" rx="10" class="bxi"/><text x="150" y="55" text-anchor="middle" font-weight="700">Classic rationality</text><text x="150" y="78" text-anchor="middle" class="mut" font-size="11">individual deliberation</text><text x="150" y="96" text-anchor="middle" class="mut" font-size="11">utilitarian consequences</text><text x="150" y="120" text-anchor="middle" class="acc" font-size="11">misses: interaction</text>
<rect x="340" y="30" width="260" height="110" rx="10" class="bxg"/><text x="470" y="55" text-anchor="middle" font-weight="700">Communicative action</text><text x="470" y="78" text-anchor="middle" class="mut" font-size="11">interaction, consensus</text><text x="470" y="96" text-anchor="middle" class="mut" font-size="11">normative, procedural</text><text x="470" y="120" text-anchor="middle" class="acc" font-size="11">misses: deliberation</text>
<text x="310" y="90" text-anchor="middle" font-size="20">⇄</text><text x="310" y="162" text-anchor="middle" class="mut" font-size="11">contingency framework = assign each its domain</text></g></svg>`,
cap:"Each paradigm focuses on exactly what the other neglects.",
example:"A municipality internally ranks options with an MCA (deliberation, rational), then negotiates with developers and residents (interaction, strategic or communicative).",
quotes:["\"One paradigm cannot supplant another\""],
dims:null,
exam:"Know the midterm sample: a sociological institutionalist critiques Alexander's institutional design by saying institutions are embedded in cultural norms and cognitive scripts that shape planners' own perceptions (answer B)."},

{id:"rc", wk:3, title:"Rational choice & self-interest (lecture) + Coase", cite:"Lecture 24 Sept (Bouwmeester): rational choice, property rights, rent-seeking, Airbnb, Coase (1960), Gurran et al. (2018)", theory:"Rational choice theory", status:"full",
statusNote:"Lecture slides on file. Needham, Hindmoor and Taylor have their own cards.",
one:"All actors (citizens, developers, municipalities) maximise self-interest; property rights and institutions shape their incentives. Planning faces both market failure and state failure, and can work by clarifying rights and cutting transaction costs.",
summary:["Rational-comprehensive planning is an ideal standard for planning decisions (expert, value-free welfare optimisation). Rational choice theory is an analytical framework for how planning works: rational decision-making by ALL actors, market and state failure, emulating market rationality in state processes.",
"Public interest has no objective, universal goal; it is the aggregate of private interests (agency-focused). Land-use planning is limited: landowners have a de facto veto ('Land-use planning will only succeed if it can influence private decisions', Needham 2012, p. 24). Rent = income from owning land above the cost of production (Ricardo). Asymmetry: when planning raises land values owners keep the betterment; when it lowers them (downzoning, heritage, regulatory takings) they claim compensation. Landowner strategies (Rijnenburg, Buitelaar et al. 2025): framing ('low-hanging fruit'), collaborating (consortium), lobbying, negotiating. Swiss hypothesis: the peasant land law bars outsiders buying farmland and caps price gains, so there is no speculative expansion lobby and insiders gain from densification.",
"Airbnb: incentives differ (hosts, guests, neighbours, planners). Under-regulation is a collective action problem (Olson): small concentrated interests organise; large diffuse groups free-ride. Regulation (Utrecht 2018: 60 nights, guest cap, registration, fines €150–€21,750) suffers from enforcement, data, transaction costs, legal challenges and waterbed effects. Coase (1960): with clearly defined property rights and zero transaction costs, bargaining yields the efficient outcome regardless of who holds the right. Since transaction costs are never zero (information, bargaining, enforcement, holdouts, many parties), design Coasean interventions: clarify rights and cut transaction costs (tradable hosting permits, VvE negotiation, hosting tax into a neighbourhood fund, platform monitoring).",
"Core assumptions: self-interest maximisation (not only economic); applies to all actors; property rights/institutions shape incentives and can be deliberately changed; outcomes judged in costs and benefits; knowledge mostly positivist (models, game theory, CBA). Can explain reproduction (insiders protect interests) and transformation (deliberate redesign of rules). Critiques: over-simple human model, ignores power and inequality, too agency-focused, limiting assumptions, reverse nirvana fallacy."],
concepts:[["Self-interest","Actors weigh costs and benefits to pursue their own interests (not only money)."],["State failure","Government also fails: rent-seeking, capture, information and incentive problems."],["Externality","Effect of one actor's action on others not reflected in prices (noise, safety, housing pressure)."],["Collective action problem","Individually rational free-riding leads to collectively suboptimal outcomes."],["Coase theorem","Clear property rights + zero transaction costs → efficient bargaining outcome, whoever holds the right."],["Transaction costs","Information, bargaining, enforcement, strategic behaviour (holdouts), many parties."],["Rent / rent-seeking","Unearned income from land; efforts to capture it via the political process."],["Betterment / compensation asymmetry","Owners keep planning gains but claim planning losses."],["Regulatory taking","Public regulation that reduces the value of private property."]],
fig:`<svg viewBox="0 0 620 210" role="img" aria-label="Coase noisy factory example"><g font-size="12">
<text x="20" y="20" font-weight="700">Coase: the noisy factory (quiet worth €1,000; insulation costs €700)</text>
<rect x="20" y="36" width="280" height="130" rx="8" class="bxi"/><text x="160" y="58" text-anchor="middle" font-weight="700">Right to make noise: factory</text><text x="160" y="84" text-anchor="middle" font-size="11">homeowner pays factory €700</text><text x="160" y="102" text-anchor="middle" font-size="11">→ factory insulates</text><text x="160" y="140" text-anchor="middle" class="acc" font-weight="700">insulation ✓</text>
<rect x="320" y="36" width="280" height="130" rx="8" class="bxg"/><text x="460" y="58" text-anchor="middle" font-weight="700">Right to quiet: homeowner</text><text x="460" y="84" text-anchor="middle" font-size="11">compensation €1,000 &gt; €700</text><text x="460" y="102" text-anchor="middle" font-size="11">→ factory insulates</text><text x="460" y="140" text-anchor="middle" class="acc" font-weight="700">insulation ✓</text>
<text x="20" y="195" class="mut" font-size="11">Same efficient outcome; only who pays whom differs. Only if transaction costs = 0.</text></g></svg>`,
cap:"Coase's claim from the lecture example.",
example:"Airbnb in Amsterdam: hosts form a small, concentrated, organised interest; neighbours are a large, diffuse group who free-ride, so regulation lags.",
quotes:["\"Property rights can be deliberately changed in order purposefully to influence land use.\" (Needham, p. 28)","\"Landowner-led pressure on policy makers ultimately led to a set of modifications to the GAIC bill.\" (Taylor, p. 272)"],
dims:{sa:85,rt:50,de:25,us:15,mp:15,norm:"Efficiency; public interest = aggregate of individual interests."},
exam:"Midterm sample Q2 answers: I = False (large groups fail to organise: free riding), II = True (Olson), III = True (lower transaction costs), IV = False (no objective public interest)."},

{id:"needham", wk:3, title:"Needham (2016) Interests and rights in property", cite:"Needham, B. (2016). Interests and rights in property, and their place in land-use planning: a theoretical investigation. In Planning by Law and Property Rights Reconsidered, pp. 23–36. Routledge", theory:"Rational choice / institutional economics of property", status:"slides",
statusNote:"Chapter NOT on file. Built from the lecture (quotes p. 24 via Needham 2012 and p. 28) plus my knowledge of Needham's work; check it against the text.",
one:"Land-use planning works through property rights: it only succeeds if it influences private owners' decisions. Rights are institutions that can be deliberately changed to steer land use.",
summary:["Property is a bundle of rights (use, exclude, transfer, derive income) held by various parties. People have interests in land (what they want) and rights (what they are entitled to do). Public land-use planning is the state restricting or redistributing these rights through public law.",
"The state plays a dual role (lecture slide): it defines and protects private property rights, AND it pursues public policies whose target groups are owners and whose end-beneficiaries are often non-owners. Because owners can simply not develop (a de facto veto), 'land-use planning will only succeed if it can influence private decisions'.",
"Since rights shape incentives, 'property rights can be deliberately changed in order purposefully to influence land use' (p. 28): a rational-choice/institutional view where institutions are external rules affecting cost-benefit calculations, and change is deliberate (transformation)."],
concepts:[["Bundle of rights","Property as separable rights: use, exclusion, transfer, income."],["Interests vs rights","What actors want vs what they are legally entitled to."],["Dual role of the state","Guarantor of private rights and actor pursuing public goals through them."],["Veto of landowners","Planning permits but can't force development."]],

cap:"State property rights vs state policies.",
example:"Dutch 'kostenverhaal' and pre-emption rights (Wvg) redefine what landowners can do so the municipality can steer development.",

exam:"Needham shows that rational choice can explain transformation (deliberate change of rights), while Taylor shows reproduction by insiders."},

{id:"olson", wk:3, title:"Hindmoor (2006) Mancur Olson and The Logic of Collective Action", cite:"Hindmoor, A. (2006). Rational Choice, ch. 5. Basingstoke: Palgrave", theory:"Rational choice (public choice)", status:"slides",
statusNote:"Chapter NOT on file. Built from the lecture's Olson slides plus my knowledge of Olson/Hindmoor; please upload it.",
one:"Rational individuals won't contribute to a collective good they get anyway, so large, diffuse groups fail to organise while small, concentrated groups succeed, unless selective incentives or coercion exist.",
summary:["Olson overturned pluralist group theory, which assumed that people with a shared interest would organise to pursue it. If a collective good benefits all group members whether or not they contribute, the rational individual free-rides. The larger the group, the smaller each member's share and the less noticeable each contribution, so large ('latent') groups are under-organised.",
"Small ('privileged') groups, in which at least one member gains enough to provide the good alone, or where contributions are noticeable, organise more easily. Hence the 'exploitation of the great by the small' and the outsized influence of concentrated interests (landowners, developers, platform hosts) versus diffuse ones (tenants, neighbours, taxpayers).",
"Large groups can organise through selective incentives (private benefits only for members, the 'by-product theory', e.g. insurance via a union) or coercion (compulsory membership). Hindmoor discusses the critiques: people do participate for moral or expressive reasons, and political entrepreneurs can lower costs."],
concepts:[["Collective (public) good","Non-excludable benefit for all group members."],["Free-riding","Enjoying the good without contributing."],["Latent vs privileged group","Large diffuse group that won't organise vs small group that will."],["Selective incentives","Private rewards/sanctions that make contribution individually rational."],["Exploitation of the great by the small","Small groups carry the cost and gain, large groups get the policy they didn't fight for (or lose)."]],

{id:"taylor", wk:3, title:"Taylor (2016) Urban growth boundaries and betterment: rent-seeking in Melbourne", cite:"Taylor, E.J. (2016). Growth and Change, 47(2), 259–275. doi:10.1111/grow.12110", theory:"Rational choice (rent-seeking)", status:"slides",
statusNote:"Article NOT on file. Built from the lecture slides (p. 272 quote) plus my knowledge of the case; please upload it.",
one:"When Melbourne expanded its urban growth boundary and introduced a betterment levy (GAIC), landowners behaved as rational rent-seekers: those inside tried to keep restrictions and scarcity, those outside lobbied to be included and to weaken the levy, and they succeeded in modifying the bill.",
summary:["An urban growth boundary (UGB) creates a sharp land-value jump at the line: zoning land urban creates windfall betterment for owners. Victoria expanded the UGB (2010s) and introduced the Growth Areas Infrastructure Contribution (GAIC) to capture part of that uplift for infrastructure.",
"Taylor analyses the 'rational behaviour' of existing owners: (1) those who aim to preserve restrictions on growth (keeping scarcity rents), and (2) those who try to avoid controls limiting future development or to get their land included. Both are rational from a rent-seeking perspective.",
"'Landowner-led pressure on policy makers ultimately led to a set of modifications to the GAIC bill' (p. 272): concentrated interests shaping value-capture rules, a clear case of reproduction of owners' advantages."],
concepts:[["Urban growth boundary","Line separating land where urban development is allowed from where it isn't."],["Betterment","Land-value increase caused by public action (rezoning, infrastructure)."],["GAIC","Victoria's betterment levy on land brought inside the UGB."],["Rent-seeking","Using political influence to capture unearned land rents."]],
