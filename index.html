{id:"ni", wk:4, title:"Neo-institutionalism: the map", cite:"Hall & Taylor (1996) typology as adapted by Dembski & Salet (2010), Table 1 · lecture 29 Sept (Bouwmeester), slides not yet uploaded", theory:"New institutionalism", status:"partial",
statusNote:"Built from Dembski & Salet's Table 1 (on file). Tomorrow's lecture slides (29 Sept) aren't uploaded yet; add them and I'll update this card.",
one:"Institutions = patterns of social rules ('rules of the game'). Schools differ on whether institutions are external constraints or internalised, and whether they exist prior to action or are validated in action.",
summary:["The 'new institutionalism' (March & Olsen 1989; Powell & DiMaggio 1991) is not unified. Institutions are 'patterns of social rules' that enable collective action in a world of individual choices (Dembski & Salet), 'the rules of the game… humanly devised constraints' (North 1990), or for planning 'collectively enforced rules and expectations with respect to the creation, management, and use of urban space and property' (Sorensen 2015).",
"Four quadrants: rational choice institutionalism (external, prior to action: transaction costs, collective action dilemmas, homo economicus; North, Williamson, Buchanan & Tullock); historical institutionalism (internal, prior to action: path dependency, critical junctures; Pierson, Thelen, Mahoney); actor-centred/political institutionalism (external, in action: Ostrom, Scharpf, Mayntz; policy learning); sociological institutionalism (internal, in action: culture, legitimacy, logic of appropriateness; Berger & Luckmann, Bourdieu, March & Olsen, Scott).",
"Institutions ≠ organisations: institutions are the rules of the game, organisations the players (North; Moroni). Moroni adds an evolutionary (Hayekian) view: most institutions are the unintended result of human action, not human design."],
concepts:[["Institution","Pattern of social rules; formal (laws) or informal (norms, conventions)."],["Organisation","Purposeful arrangement of resources to achieve goals: the players, not the rules."],["Path dependency","Earlier choices constrain later ones; reversing course gets costlier (positive feedback)."],["Critical juncture","Short period with heightened probability that agents' choices shape lasting outcomes."],["Logic of appropriateness","Acting because it is normal/legitimate, not because it maximises utility (March & Olsen)."],["Transaction costs","Costs of exchange that institutions reduce (Williamson, North)."]],

{id:"dembski", wk:4, title:"Dembski & Salet (2010) The transformative potential of institutions", cite:"Dembski, S. & Salet, W. (2010). Environment and Planning A, 42(3), 611–625. doi:10.1068/a42184", theory:"Sociological institutionalism", status:"full",
statusNote:"Full article on file.",
one:"Whether symbolic markers (metaphors, landmarks, events) can give new meaning to changing city-regions depends not on the symbol's design but on its institutional embedding: symbols work only if their meaning is inculcated in the audience's mental maps.",
summary:["Changing city-regions (Zwischenstadt, edge cities, métapolis) lack a crystallised identity, so planners use symbolic markers (Flemish Diamond, Pearl River Delta, Guggenheim Bilbao, IBA Emscher Park) to frame change and mobilise actors. Most fail. Central question: why does symbolisation of new urban spaces strengthen social meaning in some cases, while elsewhere symbols remain powerless or even backfire? Communicative/interpretive planning studies the symbol itself; the authors look for the answer in institutions.",
"They reject the view that institutions are 'rusty old fixtures' that only explain preservation, and position themselves with two choices (Table 1): institutions as internalised in actors' mindsets (not external constraints) and as validated in action (not fixed prior to action), which places them in sociological institutionalism. Institutions are the 'chance' of validating rules (Weber) and must be confirmed again and again in everyday practice: 'Institutions are not carved in stone.'",
"Theory: Berger & Luckmann (habitualisation, reciprocity of expectations), Bourdieu (habitus: practice informed by structure, the card-game metaphor; 'instituting'; rites of institution consecrate arbitrary boundaries and produce discontinuity out of continuity: 'Become what you are'), Geertz (symbols 'saying something of something'; the Balinese cockfight), Paasi (regional identity has an internal and an external side), Billig (banal nationalism). Symbolic markers cannot be used in a voluntaristic way: 'institutional transformation is deliberate change', yet it needs a sound notion of existing norms. The art of planning is finding under-institutionalised niches or institutional voids (Hajer).",
"Methodology (Box 1): 8 steps: (1) symbolic markers; (2) encoded message; (3) subjective context (who symbolises, legitimacy); (4) objective context (social structure, habitus: are symbols genuine?); (5) audience; (6) process of articulation over time; (7) internalisation of symbolic meaning; (8) sanctions for misrecognition."],
concepts:[["Symbolic marker","Metaphor, landmark, event or design used to frame and mobilise change."],["Institutional embedding","Symbols' meaning anchored in internalised social norms; the condition for their efficacy."],["Internalised vs external institutions","In people's mental maps/habitus vs outside constraints on choice."],["Validated in action","Institutions must be reaffirmed in each practice; meaning is never fixed."],["Habitus (Bourdieu)","Durable dispositions: structure internalised, informing but not determining practice."],["Rites of institution","Consecrating an arbitrary boundary so that representation changes reality ('social magic')."],["Inculcation","The audience absorbing and guaranteeing a symbol's meaning."],["Institutional void","Under-institutionalised space where new practices can take root (Hajer)."]],

{id:"moroni", wk:4, title:"Moroni (2010) An evolutionary theory of institutions and a dynamic approach to reform", cite:"Moroni, S. (2010). Planning Theory, 9(4), 275–297. doi:10.1177/1473095210368778", theory:"Evolutionary institutionalism (Hayekian / liberal)", status:"full",
statusNote:"Full article on file.",
one:"Planning's institutional turn is right, but many planners treat institutions 'engineeristically', as objects to design. Institutions mostly evolve unintentionally and embody dispersed knowledge, so reform should be kosmos-oriented: modest, gradual, open, general rules.",
summary:["Taxis-oriented approach = the engineer's method applied to society (complete problem, one goal, all knowledge). It fails because social problems are 'incomplete' and involve practical, tacit knowledge (Oakeshott). A first-order taxis approach plans activities (end-state land-use plans). A second-order one redesigns institutions themselves for specific goals, and it lurks in the planning literature's institutional turn (e.g. Alexander's 'institutional design', Bolan).",
"Institutions ≠ organisations: institutions are basic rules of conduct acknowledged by a community and enforced by sanctions (rules of the game); organisations are systematic arrangements of resources for explicit shared goals (players) (North 1990). Institutions do two jobs: pattern-coordination of individual actions, and a fund of knowledge accumulated over generations.",
"Descriptive side: Scottish Enlightenment (Hume, Ferguson, Smith): institutions are 'the result of human action, but not the execution of any human design' (Ferguson). Evolution = variation → selection → propagation; open-ended, contingent, sub-optimal, no inevitable stages. Invisible-hand explanations (Jacobs on safe streets, Schelling on segregation). Three kinds of phenomena: natural; artificial by design (organisations); artificial but unintended (most institutions).",
"Prescriptive side: rename 'institutional design' → 'organisational design' vs 'institutional intervention'. Kosmos-oriented approach with 10 principles: peculiarity, knowability, sense-making, motivational realism, non-tabula-rasa, modesty, robustness, gradualism, adaptive efficiency (North), openness. Rather 'learn' than 'educate', 'recognize' than 'invent', 'improve' than 'reconstruct', indirect over direct intervention. 'Planning strictu senso cannot be applied to institutions.'"],
concepts:[["Taxis vs kosmos","Made, designed order vs grown, spontaneous order (Hayek)."],["First- vs second-order taxis","Designing activities (end-state plans) vs designing the institutional rules themselves."],["Institutions vs organisations","Rules of the game vs players (North)."],["Invisible-hand explanation","Order explained as the unintended outcome of dispersed actions, with an element of surprise."],["Three kinds of phenomena","Natural; artificial by design; artificial but not designed (most institutions)."],["Adaptive vs allocative efficiency","Rules that foster learning and discovery over time vs optimal allocation of known resources."],["Radical ignorance","Ignorance is ineradicable in a complex world, not just bounded rationality."],["Kosmos principles","Peculiarity, knowability, sense-making, motivational realism, non-tabula rasa, modesty, robustness, gradualism, adaptive efficiency, openness."]],

cap:"The Greek physei / thesei / nomō distinction, made threefold after Hume, Ferguson and Smith.",
example:"Instead of a detailed zoning plan per site (taxis), a city sets simple, stable, general rules (plot coverage, nuisance rules) and lets development emerge (Oosterwold, Cozzolino).",
quotes:["\"the result of human action, but not the execution of any human design\" (Ferguson, quoted p. 278)","\"the question is not to apply planning also at the level of institutions … but to understand that planning strictu senso cannot be applied to institutions\"","\"institutions are sets of basic rules of conduct, acknowledged by a community, and usually enforced through some form of sanction; while organizations are systematic arrangements of resources for achieving explicit, shared goals\""],
dims:{sa:60,rt:30,de:90,us:65,mp:70,norm:"Liberty, peaceful coexistence, adaptive efficiency; anti-engineering humility."},
exam:"Sample Q1 option D ('emerge historically through evolutionary, trial-and-error processes that escape deliberate control') is Moroni's position, not the sociological one. Don't mix them up."},

{id:"sorensen", wk:4, title:"Sorensen (2024) Urban intensification and land value capture in Toronto", cite:"Sorensen, A. (2024). Environment and Planning A: Economy and Space, 56(6), 1803–1819. doi:10.1177/0308518X231216535", theory:"Historical institutionalism (+ conjunctural analysis)", status:"full",
statusNote:"Full article on file.",
one:"Land value capture (LVC) redistributes the costs and benefits of development; its Toronto history is a historical-institutionalist sequence of critical junctures (1946, 1989, 2019–22) followed by reactive sequences of contestation within a developmental pathway. HI adds analytical clarity to conjunctural analysis.",
summary:["Three contributions: (1) LVC is a purposeful attempt to alter the public/private distribution of development costs and benefits and should be a key metric of social equity ('growth should pay for growth'); (2) historical institutionalism (HI) complements conjunctural analysis (Gramsci → Stuart Hall → Peck; Inch & Shepherd; Leitner & Sheppard), which reads how political, economic and ideological forces 'con-join', but says little about specific institutional change; (3) the Toronto case reveals institutional change, path dependence mechanisms and how global hegemonic ideologies are translated locally.",
"Critical juncture: 'relatively short periods of time during which there is a substantially heightened probability that agents' choices will affect the outcome of interest' (Capoccia & Kelemen 2007). Sequence (Fig. 1): antecedent conditions → crisis creates permissive conditions (Soifer) → critical juncture, where productive conditions (actors, legal structures, ideology, timing) shape the choice → reactive sequence of contestation → relative stability. Both permissive and productive conditions are needed. Urban institutions are prone to CJs because of multilevel governance, disasters and constant new challenges. The planning system forms a Strategic Action Field (Fligstein & McAdam).",
"Toronto: CJ1 = the 1946 Planning Act (postwar housing crisis; subdivision agreements → lot levies spread); CJ2 = the Development Charges Act 1989 (1980s real-estate bubble) plus Section 37 density bonusing; recent CJ = Bill 108 (2019) and Bill 23 (2022, More Homes Built Faster) which cut LVC (S37 capped ~4% of uplift). 2009–18: C$490m S37 and C$2.29bn in DCs. Housing crises gave permissive conditions each time, but different productive conditions gave different outcomes (the first two enhanced LVC, the last reduced it).",
"Path dependence is usually not 'lock-in': contestation and incremental change are constant, but within a developmental pathway of bounded contestation that the critical juncture set up. Vancouver captures ~70% of uplift, Toronto negotiated 10–15%: variation comes from contingent institutional histories."],
concepts:[["Land value capture (LVC)","Public recovery of land-value uplift created by public action (DCs, density bonuses, levies, land readjustment)."],["Historical institutionalism","Institutions as historically produced, unequally distributive, contested, path-dependent."],["Conjunctural analysis","Reading the moment where multiple forces and contradictions 'con-join' (Gramsci, Stuart Hall, Peck)."],["Critical juncture","Short window of heightened agency whose choices set a lasting path."],["Permissive vs productive conditions","What opens the window (crisis) vs what shapes the outcome (actors, rules, ideology, timing)."],["Reactive sequence","Chain of contestation and refinement after a critical juncture."],["Developmental pathway","Bounded range of options within which contestation continues (path dependence without lock-in)."],["Strategic action field","Meso-level order where actors interact under shared rules and understandings."],["Section 37 / Development charges","Toronto density-bonus contributions / impact fees for growth infrastructure."]],

cap:"Top: Sorensen's Fig. 1 logic. Bottom: the three Toronto junctures.",
example:"The Dutch 2008 crisis ended many municipalities' active land policy: a permissive condition. Whether it became a critical juncture depended on productive conditions such as the Omgevingswet and the kostenverhaal rules.",
quotes:["\"relatively short periods of time during which there is a substantially heightened probability that agents' choices will affect the outcome of interest\" (Capoccia & Kelemen, quoted)","\"In most cases path dependence is not a matter of 'lock-in' … but within a developmental pathway representing a relatively constrained range of options.\""],
dims:{sa:35,rt:45,de:45,us:40,mp:30,norm:"Social equity: fair distribution of costs and benefits of urban development."},
exam:"Identifiers of HI: path dependence, critical junctures, sequences, contestation, power-distributive institutions. Compare with the sample open question (Old Fadama): 'once actors have ventured far down a particular path… difficult to reverse course' = path dependence → (historical) institutionalism."},

{id:"mm", wk:2, title:"Madden & Marcuse (2016) In Defense of Housing, ch. 1", cite:"Madden, D. & Marcuse, P. (2016). In Defense of Housing, ch. 1 'The residential is political'. Verso", theory:"Marxist / critical political economy", status:"slides",

const FC = [
// fw
["fw","Two definitions of theory used in the course","'A body of assumptions, of which the mutual relations have been made explicit' (Føllesdal et al. 1990) and 'a heuristic aid to understand a situation… essentially unknowable in its completeness' (Rydin 2021, p. 9)."],
["fw","The four dimensions of the course framework","1 Sources of outcomes (structure↔agency) · 2 Reproduction & change (reproduction↔transformation; deliberate↔emergent) · 3 Knowledge (universal↔situated; monist↔pluralist; + realism↔relativism) · 4 Normative commitments."],
["fw","Structure vs agency: definitions","Structure = recurrent, patterned arrangements that limit choices and opportunities. Agency = capacity of individuals to act independently and exercise free will."],
["fw","Three kinds of claims theories make","Explanatory (how/why), evaluative (is it fair/good), prescriptive (what should planners do)."],
["fw","What are normative commitments and what do they shape?","Assumptions about what ought to be valued, pursued, protected. They shape what we see as a problem, what planning should achieve, and how we evaluate outcomes (so what we measure)."],
["fw","Deliberate vs emergent change","Deliberate: change designed on purpose by actors. Emergent: change arising from many interacting actions and wider processes, not intended by anyone."],
// buit
["buit","Buitelaar's four Just Cities","Happy (utilitarian), Equal (egalitarian), Supportive (sufficientarian), Free (liberal)."],
["buit","Sufficientarian 'Supportive City': a city is just when…","…everyone reaches a threshold of 'enough' (e.g. adequate housing, room stress ≥ 0); inequality above the threshold is not the problem."],
["buit","Which Just City fits Houston and Oosterwold?","The Free City (liberalism): equal rights, freedom to use property, framework rules."],
["buit","Buitelaar's main point about the four conceptions","Each seems attractive but they translate into different policies and can be incompatible, so planners must be precise and choose."],
["buit","Room stress factor","Rooms available ÷ rooms required − 1. Below 0 = inadequate housing (used for the Supportive City)."],
// hall
["hall","Hall: 'theory in planning' vs 'theory of planning'","Before 1955 planners used snippets of theory about cities (theory in planning) but had no theory of what planning itself is (theory of planning)."],
["hall","Hall's three planning graduates","1955 at the drawing board drawing a land-use plan · 1965 analysing computer output of traffic patterns · 1975 talking in the evenings to community groups."],
["hall","Systems planning vs rational planning (Hall/Taylor)","Systems = theory of the object (city as a system of interrelated activities). Rational = theory of the process (Faludi). Together they broke with design-based planning."],
["hall","'Priestly clothing'","Hall: between 1965 and 1975 critiques (Lindblom, Davidoff, etc.) stripped planners of their special expert status and mystique."],
["hall","Hall's verdict on the Marxist critique of planning","Powerful, but 'strangely quietist': if planning just serves capital, it has no normative content and the planner retreats to the ivory tower."],
["hall","Hall on Forester's communicative planning","Stripped of Habermas's philosophy it is 'good old-fashioned democratic common sense', much like Davidoff's advocacy planning."],
["hall","Theory–practice relationship over time (Hall)","1960s honeymoon, 1970s tiffs and reconciliations, 1980s divorce."],
["hall","Why did the static 1950s planning system break down?","Baby boom, economic boom, mass consumption (homes, cars) accelerated urban change; plus the quantitative revolution (location theory, Isard) and cybernetics."],
// know
["know","Rydin's definition of knowledge","Knowledge claims specifying causal relations: if we do X, then Y follows. Theory = a coherent set of such claims."],
["know","Universal vs situated: the core question","Does the validity of a knowledge claim depend on who produced it and from where? Universal: no. Situated: yes (positionality)."],
["know","Monist vs pluralist: the core question","How many independent sources can give a claim the status of knowledge? Monist: one (science). Pluralist: several (lay, local, experiential)."],
["know","Realism vs relativism","Can competing claims be judged against each other? Realism: yes, about a real world. Relativism: only within frameworks."],
["know","Soft vs strong relativism","Soft: knowledge is produced in specific times/places/conditions. Strong: therefore no claim can be shown better than another. Rydin holds soft, not strong."],
["know","Does surveying 1,000 residents make research pluralist?","No. Pluralism concerns who is authorised to produce valid knowledge, not how many people you ask. A survey through the 'scientific prism' is monist."],
["know","Positivism vs post-positivism","Positivism: universal + monist, value-free, one method for nature and society, bias = error to remove. Post-positivism: situated + pluralist, never fully value-free."],

const OPEN = [
{t:"ni",pts:15,q:"Read this excerpt (from the midterm guidelines): 'the paper builds on Lowndes' (2009) analogy of a game by devising a novel typology of the different players that shape both formal and informal rules… offers a dynamic approach to history, giving agency to all kinds of social groups (North, 1992). It also provides critical insights into why once actors have ventured far down a particular path, they are likely to find it very difficult to reverse course (Reinalda, 2013)… reinforcing a particular socio-political path into the future.' (a) Which theoretical perspective do the authors adopt? (5) (b) Support your answer with two arguments, each with a direct quote. (10)",
model:"(a) Neo-institutionalism, specifically historical institutionalism (with actor-centred elements: formal and informal rules, players).\n(b) Argument 1, institutions as rules of the game: they analyse the 'formal and informal rules and practices' shaped by 'players', using Lowndes' 'analogy of a game' and citing North (institutions = rules of the game). Argument 2, path dependency: 'once actors have ventured far down a particular path, they are likely to find it very difficult to reverse course' and 'reinforcing a particular socio-political path into the future', which explains why the status quo (informality) endures despite pressure for change: reproduction via vested interests.",
rubric:["Names neo-institutionalism / historical institutionalism","Argument 1 about rules (formal/informal) + quote","Argument 2 about path dependency / reproduction + quote","Explains HOW each quote shows the perspective (not just quotes)"]},
{t:"know",pts:12,q:"A municipality organises a large participation process on a new neighbourhood and states that 'the residents' experience is the knowledge base of the plan'. Using Rydin (2007), evaluate this statement. Use the concepts universal/situated, monist/pluralist and opening up/closing down.",
model:"The statement is pluralist (residents are recognised as knowledge producers) and situated (local experience is valid knowledge). Rydin supports opening up to such claims after the communicative turn, but warns that experience 'is not of itself a sufficient condition for it to be knowledge' (p. 56): claims must be tested (closing down), and knowledges are not additive, so consensus does not guarantee the best knowledge. The planner should also co-produce knowledge and combine experiential claims with empirical, predictive and processual claims (e.g. traffic or flood risk). So: legitimate as opening up, insufficient without closing down.",
rubric:["Correctly classifies as pluralist + situated","Uses opening up AND closing down","Uses the Collins & Evans point (experience ≠ automatically knowledge)","Gives a concrete example of testing a claim"]},
{t:"gov",pts:12,q:"Explain the governmental (rational public administration) model of planning according to Rydin (2021). Then give two critiques from different theorists and state which assumption each critique targets.",
model:"Model: planning justified by market failure (welfare economics); politicians set goals outside the process (Weber); planners bring expert knowledge to choose means; a linear rational process with feedback (Lichfield's 11 steps); evidence-based, a comprehensive synthesis, legitimacy from the rationality of analysis (p. 24); research = policy evaluation, a 'critical friend'. Critique 1: Rittel & Webber: wicked problems have no definitive formulation, so complete information is impossible (targets complete information). Critique 2: Lindblom: ends and means are chosen together through incremental bargaining (targets clear, agreed goals). Alternative: Davidoff: planners aren't neutral, plural interests (targets value-free decisions / separation of politics).",
rubric:["Welfare-economic justification + public interest","Politics sets goals / planners choose means (Weber)","Rational process steps or evidence/synthesis","Two named critiques linked to specific assumptions"]},
{t:"hayek",pts:10,q:"Compare Marx and Hayek on (a) structure vs agency, (b) how change occurs, and (c) the role of the planner.",
model:"(a) Marx: structure dominant; the base (means/relations of production) determines the superstructure; deterministic. Hayek: agency/individualism; society is too complex to know or steer. (b) Marx: change via class struggle and deliberate revolutionary transformation of the base (abolish private property). Hayek: change is emergent: spontaneous order from individuals acting under general rules. (c) Marxist planner: redistributes towards material equality, decommodified housing (Madden & Marcuse). Hayekian planner: sets framework rules, equality of rights, avoids end-state steering (Glaeser & Gyourko: zoning reform).",
rubric:["Structure (Marx) vs agency (Hayek)","Deliberate/revolution vs emergent/spontaneous order","Material equality vs equality of rights/liberty","Planner role for each with example"]},
{t:"moroni",pts:12,q:"A planning scholar proposes to 'redesign the Dutch land-use institutions from scratch to maximise housing production'. How would Moroni (2010) respond? And how would Dembski & Salet (2010) respond differently?",
model:"Moroni: this is a second-order taxis-oriented (engineeristic) approach, treating institutions like organisations. Institutions largely evolved unintentionally (human action, not design) and hold dispersed knowledge. There is never a tabula rasa; reform should follow kosmos principles: modesty, gradualism, robustness, openness, adaptive (not allocative) efficiency, general rules. Dembski & Salet: institutions are internalised and must be validated in action; change is possible and deliberate, but only if new meanings are inculcated and embedded in existing norms and habitus. A blueprint won't work 'voluntaristically'; find institutional voids, use legitimate symbolic markers. Difference: Moroni stresses emergent evolution and limits of knowledge (Hayekian); D&S stress cultural meaning and see deliberate transformation as possible.",
rubric:["Moroni: taxis/second-order + evolutionary nature of institutions","At least 2 kosmos principles","D&S: internalised, validated in action, embedding/inculcation","States the contrast (emergent vs deliberate but embedded)"]},
{t:"sorensen",pts:10,q:"Using Sorensen (2024), explain the concepts critical juncture, permissive and productive conditions, and reactive sequence with the Toronto land value capture case.",
model:"Critical juncture: short period of heightened probability that agents' choices shape outcomes (Capoccia & Kelemen), e.g. the 1946 Planning Act. Permissive conditions: crises that loosen constraints (postwar housing crisis; 1980s real-estate bubble; post-2010 affordability crisis). Productive conditions: actors, legal structures, ideology, timing that shape the outcome, e.g. a conservative government allowing subdivision agreements in 1946, the DC Act 1989, and in 2019–22 a pro-supply provincial government cutting LVC (Bills 108/23). Reactive sequence: subsequent contestation (court challenges, tribunal appeals, revisions in 1997 and later) within a developmental pathway: path dependence without lock-in.",
rubric:["Correct CJ definition","Permissive vs productive distinction with Toronto example","Reactive sequence + example","Path dependence as bounded pathway"]},
{t:"rc",pts:10,q:"Analyse the problem of short-term rental (Airbnb) in Amsterdam from a rational choice perspective. Use Olson and Coase, and name one critique of this approach.",
model:"Actors are self-interested: hosts earn more than from long-term tenants, guests get cheap, flexible stays, neighbours bear externalities (noise, housing pressure). Olson: hosts/investors are a small concentrated group that organises and lobbies; neighbours are large and diffuse and free-ride, so regulation lags. Regulation faces enforcement and transaction costs. Coase: with clear rights and zero transaction costs, bargaining would be efficient; since TC > 0, clarify rights and reduce TC: tradable night permits, VvE bargaining, a hosting tax into a neighbourhood fund, platform data sharing. Critique: ignores power and inequality (tenants can't bargain), or an oversimplified human model.",
rubric:["Identifies actors' incentives","Olson collective action applied","Coase + transaction costs + Coasean instrument","One critique"]},
{t:"scott",pts:10,q:"Explain why Scott calls Brasília a high-modernist experiment and what its failures reveal about high modernism's assumptions about knowledge.",
model:"High modernism: faith in science and the state to rationally redesign society. Brasília was built from zero on state land according to CIAM/Le Corbusier doctrines: geometry, functional segregation, superquadra, a utopian miniaturisation meant to transform Brazil. Failures: brasilite (no street corners, anonymity), disorientation for residents (legible to administrators, confusing to users), and the unplanned Brasília housing 75% of residents by 1980, symbiotic with the core. Knowledge: it assumed universal, expert, monist knowledge seen from above and ignored local practical knowledge (mētis) and experienced order (Jacobs). Visual order ≠ functional order.",
rubric:["Defines high modernism","Describes Brasília plan features","Two failures incl. unplanned Brasília","Link to universal/monist knowledge vs mētis/Jacobs"]}
];

const UPDATES = [
{id:"fw", status:"full", title:"Course framework + Rydin (2021) Introduction: Theory and planning research",
statusNote:"Full text on file: Rydin (2021) ch. 1 plus the 8 Sept lecture slides.",
one:"Theory is not optional: every definition of 'planning' already frames the object. A theory (ontology + epistemology + values) tells you what to focus on, links your case to a broader story, and lets research build theory. The course compares theories on four dimensions.",
summary:[
"Rydin (2021) writes about theory OF planning (analytic: how planning works), not normative planning theory FOR planning (how it should be done), while admitting the two are entangled: 'all research—including analytic research—is imbued with value judgements'. Even defining planning is theoretical: planning as goal-directed decision-making (instrumental, public administration, e.g. Næss & Saglie 2000) → as state action to order the environment in the collective interest → as intervention affecting diverse interests and system features. Each small shift implies a different view of the process.",
"Knowledge is more than information: it is about understanding the dynamics that produced a situation, 'a claim to know the cause of things' (rerum cognoscere causas). Research combines general understanding with a specific case. Theory can be seen as law-like (natural-science model; rejected by Flyvbjerg et al. 2012 because of complexity and Giddens' double hermeneutic) or, Rydin's view, as 'a heuristic aid to understand a situation, a way to try to know what is essentially unknowable in its completeness' (p. 9): 'a set of ideas that fit together coherently and make general statements about the world or a part of it'. Theories carry ontological, normative and epistemological positions, so the terrain of theory is contested and choosing one is a value choice.",
"Is theory necessary? Empiricism ('let the facts speak', Latour's 'modernist settlement') fails: data selection and interpretation involve value judgements, and pure empiricism gives a disparate, unconnected field. Flyvbjerg's phronesis (practical wisdom; four questions: where are we going, who gains/loses by which mechanisms of power, is it desirable, what should we do?) still relies on unacknowledged theory (double hermeneutic, praxis). Three advantages of theory: (1) it focuses attention under time/money limits; (2) it links partial findings to a broader, persuasive narrative, enabling generalisation; (3) empirical research can build and revise theory.",
"The course then compares theories on four dimensions: (1) sources of planning outcomes (structure ↔ agency); (2) reproduction and change (reproduction ↔ transformation; deliberate ↔ emergent); (3) knowledge (universal ↔ situated; monist ↔ pluralist; + realism ↔ relativism); (4) normative commitments. Theories make explanatory, evaluative and prescriptive claims. Rydin's book runs from the linear rational model (ch. 2), through actor-centred approaches (rational choice, institutions, governance, urban politics; chs 3–6) and structural political economy (ch. 7), to relational perspectives (Foucault, assemblage; chs 8–9)."],
concepts:[["Theory (Rydin 2021)","A heuristic aid; a coherent set of ideas making general statements about (part of) the world; a narrative account, never complete."],["Theory of vs theory for planning","Analytic (how planning works) vs normative (how it should be done) (Faludi's distinction)."],["Empiricism","'Let the facts speak for themselves': rejected because data choice and interpretation are value-laden and findings stay disconnected."],["Phronesis","Flyvbjerg's practical-wisdom research: situated, value-deliberative, attentive to power. Rydin: it still hides theoretical choices."],["Double hermeneutic","Social scientists interpret how people interpret the world (Giddens), so social science ≠ natural science."],["Three advantages of theory","Focus; link to a broader narrative (generalisation); build/revise theory."],["Structure / agency","Patterned arrangements limiting choice / capacity to act independently."],["Explanatory / evaluative / prescriptive claims","How it works / whether it is good / what to do."],["Normative commitment","Assumption about what ought to be valued, pursued, protected."]],
quotes:["\"a heuristic aid to understand a situation, a way to try to know what is essentially unknowable in its completeness\" (Rydin 2021, p. 9)","\"Theory is, therefore, best seen as a set of ideas that fit together coherently and make general statements about the world or a part of it.\"","\"all research—including analytic research—is imbued with value judgements\""],
exam:"Expect MCQs asking which role theory plays (focus, generalise, build theory) or that give a quote or case and ask where it sits on a dimension. Remember: defining 'planning' is itself a theoretical choice."},

{id:"buit", status:"full", statusNote:"Full article on file (Planning Theory 25(4), 351–370).",
one:"'The Just City' is a concept everyone supports, but its conceptions differ: the Happy, Equal, Supportive and Free City. Each has different materials of justice and policies, and they are not à la carte: some are internally or externally incongruent. Planners need 'justice literacy'.",
summary:["Concept vs conception (Moroni 2020, after Rawls): nobody opposes the concept of a just city, but conceptions differ. Three problems in debates: justice kept vague to avoid controversy (superficial consensus); justice defined narrowly as if only one conception exists (e.g. Fainstein's anti-neoliberal framing); and inconsistency when incompatible conceptions are pursued at once (you can't condemn segregation and gentrification AND support free settlement). Aim: improve 'justice literacy', i.e. the vocabulary (conceptions) and grammar (how they connect).",
"Premises: strictly, a city cannot be just; only institutions (formal and informal rules) can (Moroni). 'City' = the target territory where goods, duties or rights are allocated. Each conception decomposes into five materials of justice (Dawkins 2021): value (what is distributed), principle (how), scope (to whom/where), ground (why), basis (goal-based vs rights/duty-based).",
"Happy City (utilitarianism): value = utility/preference satisfaction; principle = maximum collective utility; goal-based. Policies: CBA, agglomeration economies (often labelled 'neoliberal'). Critique: ignores distribution and individual rights. Equal City (egalitarianism): value = equality of outcomes/opportunities; 'the more equal, the better'; inequality instrumentally problematic (neighbourhood effects) and intrinsically wrong. Policies: redistribution, social mixing. Supportive City (sufficientarianism, + prioritarianism, limitarianism): everyone ENOUGH (absolute, not relative poverty); access to primary goods/capabilities, e.g. affordable housing (≤30% of income), commuting limits; setting the threshold is key; rights/duty-based. Free City (liberalism; Hayek, Nozick): equal rights and freedom; 'assigning rights rather than distributing outcomes'; the city as spontaneous order; Nozick's entitlement theory (justice in acquisition and transfer); refrain from growth controls, inclusionary zoning, rent control; Oosterwold. A positive-freedom variant: the capability approach (Sen, Nussbaum).",
"Congruence: internal = do the materials within one conception fit (e.g. utility + individual rights don't)? External = do conceptions fit each other? Free + Supportive can combine (primary goods can be rights; capabilities fit sufficiency). The Free City is incompatible with the goal-based Happy and Equal Cities: formal equality clashes with material equality, and 'liberty upsets patterns' (Nozick), e.g. free settlement produces clustering. 'Justice is not à la carte.'"],
concepts:[["Concept vs conception","The general idea of justice vs a specific version of it."],["Justice literacy","Knowing the vocabulary (conceptions) and grammar (connections) of justice."],["Materials of justice","Value, principle, scope, ground, basis (Dawkins 2021)."],["Goal-based vs rights-based","Aims at an end-state for the collective (Happy, Equal) vs secures rights/duties (Supportive, Free)."],["Happy City","Utilitarian; maximum collective utility; CBA, agglomeration."],["Equal City","Egalitarian; everyone the same (relative); social mixing, redistribution."],["Supportive City","Sufficientarian; everyone enough (absolute); spatial primary goods such as affordable housing."],["Free City","Liberal; equal rights and freedom; refrain from intervening; Oosterwold; capabilities (positive freedom)."],["Internal / external (in)congruence","Fit between materials within one conception / between conceptions."],["Entitlement theory (Nozick)","A distribution is just if it came about through just acquisition and transfer."]],

{id:"know", status:"full", statusNote:"Full article on file (author's version) + lecture 15 Sept + exit-ticket answers.",
one:"Modernist planning reified knowledge as an object; postmodern planning celebrates many knowledges but has no institutional arrangements to handle them. Rydin argues for treating knowledge as claims about causal relations, distinguishing them from other (ethical, aesthetic) claims, and creating arenas where planners open up to and test (close down) them.",
summary:["Starting point: the breakdown of the modernist consensus (Latour): knowledge is not a mirror of nature produced by neutral experts, but socially constructed and embedded in social relations and networks (epistemic communities, communities of practice). Modernist planning rested on planners' command of knowledge for progress. Knowledge differs from information and data because it specifies a causal relationship: planners need to know how impacts follow from actions.",
"The 'new orthodoxy' in planning theory (consensus building: Innes; collaborative: Healey; radical: Sandercock's 'epistemology of multiplicity') places knowledge outside planning organisations. But deliberation has limits: general ones (vague practice, planner skills, capture by powerful interests, unresolved conflict) and knowledge-specific ones: knowledges are not additive (Evans & Marvin); Innes's consensus building works when information is fully shared or 'uncertainty is rampant', whereas most planning lies in between. 'Engaging different knowledges is fundamentally different to engaging different voices.'",
"Knowledge claims must be distinguished from ethical, pragmatic, efficiency or aesthetic claims, since stakeholder rights ≠ expertise rights (Collins & Evans). Habermas's validity claims support this: truth (constatives), normative legitimacy (regulatives), truthfulness (expressives). Labelling all community claims 'knowledge' is politically understandable but wrong: experience 'is not of itself a sufficient condition for it to be knowledge' (p. 9 of MS / p. 56). Planners are co-producers of knowledge (Mode 2): they give voice (opening up) AND test and recognise claims (closing down), aiming at 'socially robust knowledge'. This is a realist constructivism: knowledge is socially constructed yet engages material reality.",
"Typology (Figure 1): planning seeks to turn State A into B1; without planning A becomes B; the actual result is B2. Seven knowledge types: (1) empirical State A, (2) predictive State B, (3) process A→B, (4) process A→B1 (how planning works), (5) empirical B2 (outcomes), (6) process A→B2, (7) normative B1 (desired future, normative yet grounded in possible paths). Collapsed into four: empirical, process, predictive, normative (Table 2). None is value-free and each carries a causal story. Each type needs different arenas and planner roles: empirical = lay + expert, planner as client, analyst or facilitator; process = theory-framed research, even action research; predictive = mostly expert-led, planner as client; normative = public-sphere debate, planners keep possible futures on the table (an ethical voice)."],
concepts:[["Knowledge (Rydin 2007)","A claim specifying causal relationships, not just data or information."],["Modernist consensus","Knowledge as an objective mirror of nature produced by experts; its breakdown = knowledge as socially constructed."],["New orthodoxy","Communicative/collaborative planning: many stakeholders, many knowledges, consensus."],["Knowledge vs other claims","Knowledge claims differ from ethical, pragmatic, efficiency and aesthetic claims (Habermas's validity claims; Collins & Evans)."],["Opening up & closing down","Give voice to claims; test and recognise which count as knowledge."],["Co-production","Planners help generate knowledge by testing and recognising claims."],["Seven → four knowledge types","Empirical, predictive, process (×3), normative → empirical, process, predictive, normative."],["Universal ↔ situated","Does validity depend on who produced the claim and from where?"],["Monist ↔ pluralist","How many independent sources can confer the status of knowledge?"],["Realism ↔ relativism","Can claims be judged against each other? Rydin: soft relativism, but claims can be tested."],["Multi- vs transdisciplinary","Several disciplines (can still be monist) vs non-academics as knowledge producers (pluralist)."]],
cap:"Rydin (2007) Figure 1 as redrawn in the lecture. Processual claims cover A→B, A→B1 and A→B2. Practice: 'Car ownership in Utrecht fell 12% 2015–2023' = empirical; 'Rijnenburg demand will exceed supply by 2030' = predictive; 'densification near stations reduces car use because it changes relative costs' = process; 'Rijnenburg should prioritise affordability' = normative.",
table:{head:["Knowledge type (Table 2)","Who generates it","Planner's role","How it is tested"],rows:[["Empirical","Lay and expert (experiential)","Client (consultancy), analyst, facilitator of community input","Forums: expert–expert, lay–lay, lay–expert; procedures to resolve claims"],["Process","Theory-framed research, action research","Object of research and co-researcher","Engaging rival causal models; evaluations"],["Predictive","Mostly expert-led","Client of researcher, alert to lay input","Challenging causal models + prediction methods"],["Normative","Public-sphere debate; academia's scenarios","Manage informed debate; keep possible futures open","Is the future scenario warranted as possible?"]]},
quotes:["\"engaging different knowledges is fundamentally different to engaging different voices\"","\"The experience of local stakeholders may be an important basis for claiming local or experiential knowledge but … such experience is not of itself a sufficient condition for it to be knowledge\"","\"Contemporary planning theory has tended to be better at discussing opening-up than closing-down.\""],
exam:"Traps: (1) a survey of 1,000 people isn't pluralism; (2) a positivist treats bias as error; (3) situated ≠ anything goes. New from the article: knowledge claims ≠ ethical claims, seven knowledge types → four, and Innes's two conditions for consensus."},

{id:"davoudi", status:"full", statusNote:"Full article on file (disP 165, 2/2006). Correction: the Hoch 'planners as lawyers' image is from Davoudi (2012), quoted in the exit ticket, not this 2006 article.",
one:"The UK enthusiasm for evidence-based policy rests on an instrumental, linear, utilitarian view of research, the same naive assumptions as 1960s–70s positivist planning. In the real world evidence competes with ideology, interests, institutions and prior information, so Davoudi argues for an enlightenment model: evidence-informed policy.",
summary:["Context: New Labour's Modernising Government White Paper (1999): 'what matters is what works'. Two models of the policy–research interface. The instrumental model (linear, direct) has two variants: 'expert on top' (research leads, evidence-driven policy) and 'expert on tap' (research follows policy concerns; speed, usable evidence on demand). The enlightenment model: indirect, long-term; research 'illuminates the landscape' and informs public debate, i.e. evidence-INFORMED rather than evidence-BASED policy.",
"The instrumental view rests on three misconceptions: policy-making is a rational process; evidence can only be generated by positive science; experts are apolitical and value-free, 'and they know best'. These echo planning history: Geddes' survey-analysis-plan (linear, but intuitive visionary planners); then 1960s–70s systems and rational planning (cybernetics, McLoughlin, Chadwick, location theory, Popper's falsifiability) which conceived planning as a science solving well-defined problems, 'the paradox of policy analysis'.",
"Real world: policy is bricolage (Ball); more information can confuse (Keynes); research sits on shelves ('problem of little effect', Weiss). Evidence competes with Weiss's four I's: ideology (e.g. urban containment/Green Belt sustained by values despite Hall's 1973 evidence), interests (DEFRA: evidence 'to turn strategic priorities into something concrete' → the political/tactical model, cherry-picking; think tanks under Thatcher; the Barker review), institutional norms and practices (quick fixes, unread reports), and prior information (facts only become evidence when used to support a proposition; evidence includes expert and experiential, formal and tacit knowledge; what counts is what is available; validity of relations matters). 'Power is knowledge' (Flyvbjerg): power determines what counts as knowledge.",
"The 2004 planning reform's 'soundness' test (PPS12: a 'robust and credible evidence base') became a largely procedural, tick-box exercise. Conclusion: the evidence-based enthusiasm and positivist planning share 'ambitious and naïve assumptions that the complex political and socio-economic processes could be technicized, commanded and controlled'. Keep a broad enlightenment view and two-way interaction between policy and research, and aim at an 'evidence-informed society'."],
concepts:[["Instrumental model","Linear, direct research→policy (expert on top) or policy→research (expert on tap)."],["Enlightenment model","Research indirectly illuminates the context and informs debate: evidence-informed policy."],["Expert on top / on tap","Research leads policy / research serves policy demands."],["Three misconceptions","Policy-making is rational; evidence only from positive science; experts are value-free and know best."],["Weiss's four I's","Ideology, interests, institutional norms/practices, prior information: competitors of evidence."],["Political/tactical model","Evidence gathered or cherry-picked to justify decisions already made."],["Evidence (OED, per Davoudi)","Facts become evidence only when used to (dis)prove a proposition; includes experiential and tacit knowledge."],["Soundness test","UK 2004 plan test on a 'robust and credible evidence base'; in practice procedural, tick-box."]],

{id:"cozz", status:"full", cite:"Cozzolino, S. (2020). Environment and Planning B: Urban Analytics and City Science, 47(2), 203–219. doi:10.1177/2399808319857451",
statusNote:"Full article on file.",
one:"Cities as a whole are complex adaptive systems, but many 20th-century neighbourhoods built all at once are anti-adaptive. The cause lies in neglected factors: action (the source of change), ownership (which distributes design control) and time. Planners should create room for incremental, self-organised adaptation instead of more central plans.",
summary:["AANs = large residential neighbourhoods built all-at-once and from scratch in the 20th century (e.g. 'La Clementina', Bergamo, vs historic 'Borgo Santa Caterina'). They answered housing pressures and gave affordable ownership, but they are 'in a lock-in situation': they can't self-regenerate, so they call for top-down, 'paternalistic' regeneration. Aims: characterise the causes of AAN formation and perpetuation, and give policy/design implications. Adaptability matters for persistence, identity and innovation (use of dispersed local knowledge, Hayek, Jacobs).",
"Traditional cities grew from private ownership, incremental development and organic adjustment among households, governed by legal codes that protected neighbours. Modern planning shifted from proscriptive rules ('thou shalt not', only preventing externalities) to prescriptive rules that predefine spatial configurations. Complexity is emergent (spontaneous action); simplicity is designed: 'the more one neighbourhood is designed from the top, the less space there is for complexity to evolve'.",
"Planning's direct responsibility: pushing large-scale developments, demanding large public open spaces, and rules that freeze adaptation. Implications: include time (after construction, leave room for unpredictable adaptation); use 'locality knowledge' while preventing negative externalities; welcome multiple independent ownerships and distributed design control ('everything depends on the pattern of ownership', Moudon). Regeneration: abandon paternalism. New areas: top-down design only for certain common structures; Oosterwold as an experiment. Final point: the problem isn't too few central plans but 'the lack of flexible space for incremental adaptation and the evolution of self-organized orders'. Not nostalgic: the focus is 'the institutional framework that shaped [the traditional city's] evolutionary process', and a distance from New Urbanism."],
concepts:[["Anti-adaptive neighbourhood (AAN)","Built all-at-once from scratch, reluctant to incremental change, 'lock-in'."],["Action · ownership · time","The three under-estimated factors behind adaptability."],["Proscriptive vs prescriptive rules","Prohibitions preventing externalities vs rules predefining spatial outcomes."],["Complexity vs simplicity","Emergent order from spontaneous action vs designed artificial order: a trade-off."],["Distribution of design control","Ownership as the legal title that spreads design control among many actors."],["Locality knowledge","Jacobs: people's situated knowledge of their own needs and place."],["Paternalistic circle","AANs can't self-regenerate, so top-down interventions follow, which reproduce dependence."]],
quotes:["\"action (as the main source of urban change), ownership (as the legal title that effectively distributes 'design control' in the built environment), and time (as the essential condition in incremental processes of adaptation)\" (p. 4)","\"the more one neighbourhood is designed from the top, the less space there is for complexity to evolve\"","\"the main problem with AANs is not so much … the need for further centrally coordinated plans … but rather the lack of flexible space for incremental adaptation and the evolution of self-organized orders\""],
exam:"Agency-leaning, emergent, Free City; draws on Hayek, Jacobs and Moroni. Tutorial critiques: unequal actors (tenants), markets as power structures, a romanticised traditional city."},

{id:"taylor", status:"full", cite:"Taylor, E.J. (2016). Urban Growth Boundaries and Betterment: Rent-seeking by Landowners on Melbourne's Expanding Urban Fringe. Growth and Change, 47(2), 259–275. doi:10.1111/grow.12110",
statusNote:"Full article on file.",
one:"Analysing 264 public submissions on Melbourne's 2010 UGB expansion and the Growth Areas Infrastructure Contribution (a betterment tax), Taylor shows that landowners as 'insiders' rent-sought successfully: they discredited expected windfalls and got the GAIC shifted to purchasers, so costs are passed on to homebuyers ('outsiders').",
summary:["Melbourne's UGB (2002) expanded substantially in 2010; land inside rose 89% per hectare relative to comparable land outside, creating 'instant millionaires'. The GAIC was a hypothecated per-hectare tax on the expected betterment, to fund infrastructure.",
"Landowners have multiple interests: premium-seeking owners (often broadacre farmers, vacant land) want inclusion and to unlock development value, and containment creates speculation through 'dual predictability' (Nelson). Others, affluent rural-residential 'lifestyle' owners and hobby farmers, want to preserve restrictions for amenity and value stability ('homevoters', Fischel). Among submissions: 33 included owners were happy, 11 wanted to stay rural; 52 excluded owners wanted inclusion; grassland-zone owners called protection 'conning landowners from their rights'.",
"Landowners framed the GAIC as 'unbelievable, unethical, outright robbery', disputed that betterment would occur (a 'Taxed Out!' campaign), and argued it should be paid by developers/buyers. 'Landowner-led pressure on policy makers ultimately led to a set of modifications to the GAIC bill' (p. 272): exemptions for small parcels (0.41–5 ha, ~56% of liable parcels), liability shifted to purchasers (30% at purchase, rest at development), and in 2011 fully deferred to development, which protected hobby farmers.",
"Conclusion: the outcome legitimised landowners' misinterpretation of development gain; representations of self-interest were taken 'at face value as more equitable'. Policies 'are decided in large part on the basis of whether or not they survive conflict with groups with an existing economic stake'. Containment creates land premiums that are redistributed through the lobbying of 'insiders', with costs passed to housing consumers ('outsiders'). Rent-seeking by existing owners can decide whether and how strategic planning is implemented."],
concepts:[["Urban growth boundary (UGB)","Legislated line separating urban from non-urban land."],["Betterment","Land-value increase caused by public action; here the windfall from the UGB shift."],["GAIC","Growth Areas Infrastructure Contribution: hypothecated betterment tax, later made 'purchaser pays'."],["Rent-seeking","Lobbying to capture or keep unearned rents."],["Premium-seeking vs homevoter","Owners wanting development value vs owners protecting amenity and property value through restrictions."],["Dual predictability","Containment makes clear which land can be developed AND that it is scarce, fuelling speculation."],["Insiders vs outsiders","Existing property owners who capture gains vs future homebuyers who pay."]],
quotes:["\"Landowner-led pressure on policy makers ultimately led to a set of modifications to the GAIC bill.\" (p. 272)","\"policies with broader implications are decided in large part on the basis of whether or not they survive conflict with groups with an existing economic stake in the outcomes\""],
exam:"Rational choice/rent-seeking + Olson: a concentrated insider group beats diffuse future buyers. Shows reproduction of owners' advantages. Links to Sorensen (land value capture, analysed with historical institutionalism instead)."},

{id:"ni", status:"full", cite:"Lecture 29 Sept (Bouwmeester): Neo-institutionalism & planning · + Dembski & Salet (2010) Table 1",
statusNote:"Lecture slides on file.",
one:"Institutions are the formal and informal rules of the game, not organisations. They are 'ontologically both the context and object of planning' (Savini 2019). New institutionalism comes as rational choice, sociological, historical and evolutionary strands, which disagree on what institutions are, what they do and how they change, and so on how much planners can deliberately design them.",
summary:["Institutions = systems of established rules and norms that guide, constrain and regulate behaviour; organisations = concrete entities with a purpose (Eurovision: EBU = organisation; statutes and informal norms = institutions). Double life: they constrain actors but are also outcomes of action (context AND object of planning). Alexander (2005): if planning aims to transform society, 'institutional transformation must be a critical aspect of planning'. Some even say 'planning is institutional design' (Innes 1995): planners → design institutions → shape behaviour → reshape society/space.",
"Origins (Part A): Hardin's tragedy of the commons (1968): rational self-interest depletes shared resources. Ostrom (1990) shows how self-interested people self-organise rules to overcome the 'problem of commitment'. Her IAD framework has seven rule types: position, boundary, choice, aggregation, information, payoff, scope (applied to informal real estate by Bouwmeester & Hartmann 2021). New institutionalism explains how institutions shape behaviour and how they arise and change, and reconciles structure and agency (Giddens). Example: institutional arrangements shape residential morphology in NL, Flanders and NRW (Tennekes et al. 2015).",
"Strands (Part B, after Sorensen 2017 and Salet 2018). (1) Rational choice institutionalism: 'formal and informal rules of the game … humanly devised constraints' (North 1990); they coordinate and give certainty, information and credible commitment; they change when self-interested actors create rules to enhance cooperation. (2) Sociological: institutions 'establish the very criteria by which people discover their preferences'; goodness-of-fit with legitimate templates (DiMaggio & Powell); symbol systems, cognitive scripts, moral templates (Hall & Taylor); internalised; hegemonic norms. Example: Amsterdam-Noord's symbols linking the shipyard past to a creative future (Savini & Dembski 2016). (3) Historical: procedures, routines and norms embedded in the polity; path dependency, critical junctures, structural emphasis. Example: why participation in Norwegian land-use planning stayed weak (Holsen 2021). (4) Evolutionary (Moroni): institutions as unintended outcomes of evolution.",
"The key debate is institutional change and the limits of design. Dembski & Salet: symbols can't be used voluntaristically; find under-institutionalised niches. Sorensen: critical junctures, then bounded developmental pathways. Moroni: emergent institutions can't be designed like organisations, so a kosmos approach. 'How we conceptualize institutions shapes how we conceptualize planning agency.'"],
concepts:[["Institution vs organisation","Rules and norms (formal/informal) vs a concrete purposive entity."],["Context and object","Institutions constrain planning AND are what planning produces (Savini 2019)."],["Tragedy of the commons","Hardin: rational individuals overuse shared resources."],["Ostrom's IAD rules","Position, boundary, choice, aggregation, information, payoff, scope."],["Rational choice institutionalism","Rules of the game; certainty and credible commitment; changed by self-interested actors."],["Sociological institutionalism","Institutions shape preferences; legitimacy, goodness-of-fit, cognitive scripts; internalised."],["Historical institutionalism","Embedded routines; path dependency; critical junctures; structural."],["Evolutionary institutionalism","Institutions as unintended results of evolution (Moroni)."],["Planning as institutional design","Innes/Alexander: planners deliberately change institutions."]],
table:{head:["","Rational choice","Sociological","Historical","Evolutionary"],rows:[["What are institutions?","Rules of the game, constraints (North)","Symbols, cognitive scripts, moral templates","Procedures, routines, norms embedded in the polity","Unintended outcomes of long evolution"],["What do they do?","Coordinate; give certainty, information, commitment","Define appropriateness; shape preferences","Constrain; channel development along paths","Coordinate; store dispersed knowledge"],["Change","Deliberate redesign by self-interested actors","Deliberate but must be embedded (symbols, habitus)","Critical junctures, then bounded pathways","Emergent trial and error; only modest intervention"],["Planners","Rule designers (e.g. Ostrom, Coase)","Meaning-makers in niches","Actors exploiting junctures","Humble rule-keepers (kosmos)"],["Course author","Needham, Taylor (RC)","Dembski & Salet; Savini & Dembski","Sorensen; Holsen","Moroni"]]},
example:"Lecture homework: 'Housing is becoming unaffordable'. HI: the problem is path-dependent rules (e.g. mortgage-interest deduction); look for a crisis as a critical juncture. SI: norms of homeownership as 'normal'; change the meanings. Evolutionary: rules that block adaptation; simplify and open general rules gradually.",
quotes:["\"Institutions are ontologically both the context and object of planning practices from a relational perspective\" (Savini 2019)","\"Institutions do not just constrain options: they establish the very criteria by which people discover their preferences.\"","\"How we conceptualize institutions shapes how we conceptualize planning agency.\""],
exam:"Sample Q1: a sociological institutionalist says institutions are embedded in cultural norms and cognitive scripts that shape planners' own perceptions (B). C = historical, D = evolutionary (Moroni), A = rational choice/actor-centred."}
];

model:"(a) HI: unaffordability results from path-dependent institutions (e.g. mortgage-interest deduction, land and tenure rules) reproduced by positive feedback and the interests they create; change needs a critical juncture (a crisis as permissive condition) plus productive conditions: coalitions ready with an alternative (Sorensen). (b) SI: the problem is embedded norms and meanings, homeownership as 'normal' and the legitimate template; change requires new meanings to be inculcated, through symbolic markers and new practices in under-institutionalised niches (e.g. cooperatives), not voluntaristic top-down design (Dembski & Salet). (c) Evolutionary: over-detailed, frequently changed, prescriptive rules block adaptation and supply; solution: modest, gradual, general and stable rules that allow discovery and incremental development (Moroni; Cozzolino).",

const NEW_A=[
{id:"hayek", wk:2, title:"Hayek (1944) Planning and democracy", cite:"Hayek, F.A. (1944). Planning and democracy. The Road to Serfdom, ch. 5, pp. 42–53. London: Routledge. Reprinted in Hillier, J. & Healey, P. (eds) (2008) Critical Essays in Planning Theory, Vol. 1: Foundations of the Planning Enterprise, pp. 275–286. Aldershot: Ashgate", theory:"Liberalism / Austrian economics", status:"full",
statusNote:"Built from the full chapter (OCR of the Hillier & Healey reprint). The scan shows both paginations: original Road to Serfdom pp. 42–53 (used for all page references below) and reprint pp. 275–286 (reprint p. = original p. + 233). Lecture HC4 (17 Sept, Marx vs Hayek) used for what the slides emphasise. Several Hayek ideas on the slides (spontaneous order, dispersed knowledge, complex phenomena, indeterminism) are NOT in this chapter: see the table.",
one:"Central economic planning directs all of society towards a single goal, which presupposes a 'complete ethical code' that nobody has. Because democratic assemblies can agree that there should be a plan but not on its ends, planning shifts decisions to experts and discretion, and ultimately to dictatorship. Democracy only works when collective action is limited to fields where true agreement exists and power is bound by general rules.",
summary:["Starting point (pp. 42–44): all collectivism (communism, fascism) is 'the deliberate organisation of the labours of society for a definite social goal'. Goals such as the 'common good' or 'general welfare' are too vague to decide any concrete action; a single plan would need every need of every person ranked in one order of values, i.e. a 'complete ethical code'. No such code exists: as civilisation grew, moral rules became fewer and more general, merely marking out a sphere of individual freedom. Nobody can survey more than a limited field of needs, so only partial, mutually inconsistent scales of values exist, in individual minds. That, not egoism, is the basis of individualism: the individual is 'the ultimate judge of his ends'.",
"Limits of common action (pp. 44–45): social ends are just the identical ends of many individuals, so common action must be limited to fields where people agree; agreement is likeliest on means that serve many purposes, and its probability falls as the scope of state action widens. Once the state controls a large enough share of resources (Germany 1928: 53% of national income), it indirectly controls almost everything, and the 'social scale of values' must cover nearly all individual ends.",
"The democratic mechanism (pp. 45–51): people may agree on planning without agreeing on its ends, like a group committing to a journey without agreeing where to go. Parliaments then fail and are seen as 'talking shops'; planning is 'taken out of politics' and delegated to experts (Hayek quotes the Webbs, Laski and the Donoughmore Committee). Majority voting suits choices between limited alternatives, but a plan needs 'a unitary conception' and cannot be voted clause by clause. Unlike a general with one goal, the planner must choose between competing ends, so experts impose their own scale of preferences. Delegation of general rule-making (even to local authorities) is acceptable; delegation of discretion in particular cases ('judging the case on its merits') creates arbitrary power. Separate sectoral plans do not add up, the cry for an 'economic dictator' follows, and parliament ends up choosing persons with near-absolute power: 'plebiscitarian dictatorship'. Germany before 1933 is the example: Hitler exploited a democracy that had already decayed.",
"Conclusion (pp. 51–53): 'It is the price of democracy' that conscious control is limited to fields of true agreement and some things are left to chance. The liberal creed reduced the range of subjects needing agreement; only within a competitive system based on free disposal over private property is democracy possible. Democracy is not an end but 'a utilitarian device' for peace and freedom; a homogeneous majority can be oppressive. Planning leads to dictatorship because dictatorship is the most effective instrument of coercion. What prevents arbitrary power is 'not the source but the limitation of power'.",
"Slides vs chapter: the lecture presents Hayek through spontaneous order, indeterminism, 'the theory of complex phenomena' (cited as Hayek 1989) and equality of rights vs Marx's material equality. None of these terms appears in this chapter. Dispersed local knowledge comes from Hayek (1945) 'The use of knowledge in society' (cited by Cozzolino); spontaneous order (kosmos vs taxis) from Law, Legislation and Liberty (1973; Moroni cites the 1982 edition). The chapter itself argues from value pluralism, the limits of any one mind's view of needs and ends, and the political mechanics of majority rule and delegation. The slide headings 'The philosophy of individualism' and 'Planning in democracy' are the parts actually drawn from this chapter."],
concepts:[["Collectivism","'The deliberate organisation of the labours of society for a definite social goal' (p. 42); denies autonomous spheres where individual ends are supreme."],["Complete ethical code","A ranking of all human values complete enough to decide every choice a central plan requires; Hayek says it does not exist (pp. 43–44)."],["Individualism (Hayek)","Not egoism: because no mind can survey more than a sector of society's needs, the individual should be the ultimate judge of his own ends within defined limits (p. 44)."],["Limits of agreement","Common action is legitimate where individual views coincide; agreement falls as the scope of state action grows (p. 45)."],["Delegation to experts","When assemblies cannot agree on a plan, it is handed to experts, who then impose their own scale of preferences (pp. 46–48)."],["General rules vs discretion","Delegating general rule-making is acceptable; delegating decisions on particular cases 'on their merits' produces arbitrary power (p. 49)."],["Plebiscitarian dictatorship","End state of democratic planning: parliament only confirms a leader who holds practically absolute power (p. 51)."],["Price of democracy","Conscious control restricted to fields of true agreement; 'in some fields things must be left to chance' (p. 51)."],["Democracy as means","'A utilitarian device for safeguarding internal peace and individual freedom' (p. 52), not the highest end."]],

example:"The chapter's own cases: Germany, where by 1928 public authorities controlled 53% of national income and democracy had in effect broken down before 1933, so 'Hitler did not have to destroy democracy' (p. 50); and Britain, where Laski proposed governing by delegated legislation and Order in Council (pp. 46–47). Planning illustration (not in the text): a permit system that decides each project 'on its merits' is what Hayek calls discretion; a zoning code of general rules is the acceptable form.",
quotes:["\"It presupposes, in short, the existence of a complete ethical code in which all the different human values are allotted their due place.\" (p. 43)","\"It is the price of democracy that the possibilities of conscious control are restricted to the fields where true agreement exists, and that in some fields things must be left to chance.\" (p. 51)","\"Democracy is essentially a means, a utilitarian device for safeguarding internal peace and individual freedom.\" (p. 52)","\"it is not the source but the limitation of power which prevents it from being arbitrary.\" (p. 53)"],
dims:{sa:80,rt:40,de:75,us:40,mp:85,norm:"Individual freedom (liberty) first; democracy valued as a means; rule of general rules over discretion; limited government."},
exam:"MCQ traps: (1) Hayek's individualism is explicitly NOT an assumption of selfishness (p. 44). (2) He does not oppose delegation as such, only delegation of discretion. (3) He does not say democracy is the highest end, nor that dictatorship must always destroy freedom. (4) 'Spontaneous order' and 'dispersed knowledge' are lecture/other-work ideas, not this chapter. Framework: agency (individual ends), pluralist about values, change towards serfdom is an unintended but causal slide; liberal order leaves things 'to chance' (emergent). Commentary use: Hayek grounds critiques of discretionary, comprehensive planning; critique him from Marxism (formal freedom ignores material inequality and property power), communicative planning (agreement can be built through deliberation rather than only found), or rational-comprehensive planning (experts can rank goals)."},

{id:"needham", wk:3, title:"Needham (2012) Interests and rights in property", cite:"Needham, B. (2012). Interests and rights in property, and their place in land-use planning: a theoretical investigation. In T. Hartmann & B. Needham (eds), Planning By Law and Property Rights Reconsidered (ch. 1, pp. 23–36). Taylor & Francis Group, 2012 (the syllabus lists it as Routledge 2016; same pagination)", theory:"Institutional economics of property rights (law and economics; rational choice lens in the course)", status:"full",
statusNote:"Built from the full chapter (ProQuest ebook, copyright 'Taylor & Francis Group 2012'; pp. 23–35 text, 35–36 references). The syllabus lists it as 2016 (Routledge); pagination 23–36 matches. Lecture HC6 (24 Sept) used for how the course frames it. The 'dual role of the state' matrix and the landowner 'veto' are lecture framings, not terms in the chapter.",
one:"Land-use planning is not the public interest against the market: it is one of two ways the state protects identifiable private interests in land, the other being property rights enforced by their holders in court. Which interests get which protection is a political and technical choice that can be revised, so some planning goals could be reached by creating markets in property rights; Needham finds this feasible only under limited circumstances.",
summary:["Reframing (pp. 23–26): planning is usually justified by 'the public interest', which Needham rejects: it is hard to substantiate, economic 'distortion' arguments no longer convince, and it depersonalises: 'But we too are the public!' People have interests in how land is used, their own and their neighbours' (a deep hole, a pink door, traffic, shops, open landscape, clean air). The authority upholds 'the identifiable interests of many identifiable private persons'. Planning is also not 'command and control': owners' decisions remain voluntary, and 'Land-use planning will succeed only if it can influence the private decisions' (p. 24), via permits, subsidies/levies, persuasion or infrastructure; only taking ownership removes the decision.",
"Rights (pp. 26–28): ownership is never absolute; owners may not seriously harm others (though many countries allow harm if the benefit exceeds it, Coase), and owners can grant partial rights (a lease). A property right is a way of using land 'recognized by, and protected by, the courts', so rights are created by the state, not natural (against Locke): 'It is the fact that something is protected that makes it a right' (Bromley). The state protects interests in two ways: private law (the interest becomes a property right the holder enforces in court) and public law (a public authority such as a municipality restricts how others use their rights, e.g. via building permits). Which route applies is partly political (the door colour is not protected at all) and partly technical (right of support: clear cause and few parties; clean air: diffuse effects, hundreds of victims who cannot organise a lawsuit, so public law).",
"Rights as policy variable (pp. 28–29): because the split is a decision, it can be revised; property rights can 'be deliberately changed in order purposefully to influence land use', although rights carry high ideological content and the ECHR limits change. Example: vesting future generations' interests as rights held by trustees. A market exists when there is a wanted good, voluntary exchange with free choice of partner, and regular exchange (Hodgson). As markets cannot be excluded (Lindblom), 'planning or the market?' is the wrong question; it is about the mix (Buitelaar), and moving protection from public to private law means creating markets in property rights.",
"Method and cases (pp. 30–34): Coase's reciprocity ('Should A be allowed to harm B or should B be allowed to harm A?'), Ellickson's alternatives to zoning and Webster & Lai's club goods. Needham distinguishes this from libertarian attacks on planning, keeps the planning goals, and compares instruments by effectiveness ('remediability', Williamson), not by assumed efficiency. Four cases: housing-estate amenity via covenants and a residents' association (US, England; not binding in the Netherlands); industrial estates maintained by one investor-landlord (not possible in NL: no compulsory association, leases not tradable, so estates decay and need public money; fix: make unexpired leases saleable); privately owned public spaces under permit conditions; and regional coherence, where effects are too dispersed for a market, though US conservation agreements buy development rights.",
"Conclusions (pp. 34–35): creating markets in property rights is feasible 'only under certain limited circumstances', and feasibility is not desirability. Advantages: less inflexible, no public compensation for 'takings'; risks: exclusive developments such as gated communities and urban fragmentation. Politically neither left nor right: with Blomley, Needham argues poorer people can be empowered by giving them rights in property. Course framing (HC6): rational choice can explain transformation through deliberate redesign of rights, while Taylor shows reproduction by insiders."],
concepts:[["Interest in land","What a person wants regarding how any land is used (own or others'); only some interests are protected, as rights or by planning (pp. 25–28)."],["Property right","'A way of using land (and buildings), where that way is recognized by, and protected by, the courts' (p. 27); created by the state, never absolute."],["Private-law protection","The state makes an interest a property right; the holder takes the violator to court on her own initiative (p. 27)."],["Public-law protection","A public authority uses powers (permits, prohibitions) to protect those who cannot protect their interests otherwise: land-use planning (pp. 27–28)."],["Political vs technical allocation","Whether an interest is protected at all is political; whether as right or by regulation depends on clarity of cause–effect and number of parties (p. 28)."],["Property rights as policy variable","Since rights are created, they can be deliberately changed to steer land use, like land tenure reform (pp. 28–29)."],["Market (Hodgson)","Something wanted; voluntary exchange with free choice of partner; regular exchange among more people (p. 29)."],["Coasean reciprocity","Restricting A to protect B harms A; the question is who may harm whom (p. 30)."],["Remediability","Williamson's approach: compare how effectively alternative instruments reach the same policy goal, not maximum efficiency (p. 30)."],["Creating markets in property rights","Shifting protection from public law to private law, creating exchange structures in which people realise planning goals themselves (pp. 29–31)."]],
