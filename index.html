const OPEN_B=[
{t:"harvey",pts:20,q:"Write a short theoretical commentary on Harvey (1989), 'From managerialism to entrepreneurialism'. (a) Identify the theoretical perspective that grounds the argument and show how it shapes Harvey's explanation of the shift. (b) Critique the argument from one alternative perspective covered in the course.",model:"(a) Harvey argues that since the early 1970s urban governance shifted from managerialism (local provision of services, facilities and benefits) to entrepreneurialism: public-private partnerships, speculative projects in which the local public sector absorbs risk, and the construction of place rather than improvement of territory (pp. 7–8). The grounding is Marxist political economy. The explanation is structural: the 1973 recession, deindustrialisation, austerity and mobile multinational capital make inter-urban competition an 'external coercive law' (p. 12). Cities pursue four options (production, consumption, command functions, central-state redistribution); copying renders advantage ephemeral, PPPs subsidise the affluent at the expense of the poor, and the shift facilitates flexible accumulation. Agency lies in class coalitions (he refuses to reify 'the city'), and he rejects a captive local state: competition disciplines choices after the event (pp. 14–15). (b) From historical neo-institutionalism the broad convergence is too strong: national land, fiscal and legal regimes filter global pressures. Helsinki's public landownership made entrepreneurialism a municipal land sale (Hyötyläinen & Haila), while Sesto's weak position under the PII regime produced gridlock (Savini & Aalbers). Harvey's monist, capital-centred account risks functionalism and treats institutions as outcomes, not independent causes of variation. A strong answer credits his own nuance: the shift is incomplete (p. 5), competition may be non zero-sum (p. 5), and a progressive urban corporatism built on inter-urban alliances is possible (p. 16), which sits uneasily with the coercive logic he emphasises.",rubric:["Correctly summarises managerialism vs entrepreneurialism and its key features/strategies","Identifies Marxist political economy and links it to the structural, competition-driven explanation","Critique from a clearly named alternative perspective with its own assumptions (e.g. neo-institutionalism, regime theory, governmentality, Hayek/public choice)","Uses examples or course readings to support the critique and weighs strengths/limits (structure vs agency, monism)"]},
{t:"fog",pts:20,q:"Write a short theoretical commentary on Foglesong's 'Planning the capitalist city'. (a) Which theoretical perspective grounds his explanation of why planning exists? (b) Critique it from a liberal (Hayek) or communicative perspective. (Note: check your answer against the text on Brightspace.)",model:"(a) Foglesong grounds his account in Marxist political economy and a structuralist theory of the capitalist state. He rejects the view that planning is a neutral pursuit of the public interest and explains it by contradictions of capitalist urbanisation. The property contradiction sets the social character of land (collectively produced, collectively needed) against its private ownership and control; capital as a whole needs some socialised control of land use, while individual owners resist it. The capitalism–democracy contradiction arises because socialising control via a democratic state risks popular control going further than capital wants; planning is therefore insulated from democracy. Against instrumentalist Marxism, the state has relative autonomy and serves capital's collective interest, with class struggle shaping outcomes. (b) A Hayekian critique rejects the premise that land's social character calls for state coordination. Knowledge about land use is dispersed and tacit; prices and secure property rights coordinate it better than planners can. Where Foglesong sees planning as capital's collective interest, Hayek sees a risk of arbitrary state power, and would read cases such as Eiranranta as a rational revealing of land's opportunity cost rather than as capture. Hayek also questions whether 'capital's collective interest' can be known or served by the state at all. The Hayekian critique exposes Foglesong's functionalism, but it ignores the distributive consequences of market allocation that Foglesong puts centre stage.",rubric:["Explains the property contradiction and capitalism–democracy contradiction accurately","Identifies the Marxist/structuralist theory of the state and distinguishes it from instrumentalism","Critique from a named alternative perspective, with its assumptions made explicit","Balanced evaluation (e.g. functionalism risk vs distributive blind spots of the alternative)"]},
{t:"hh",pts:20,q:"Write a theoretical commentary on Hyötyläinen & Haila (2018), 'Entrepreneurial public real estate policy: the case of Eiranranta, Helsinki'. (a) Identify the theoretical perspective(s) that ground the argument. (b) Critique the argument from an alternative perspective covered in the course.",model:"(a) The authors argue that Finnish cities and the state shifted from administrative land allocation and leasing to an entrepreneurial public real estate policy: selling land or charging market rent. In Eiranranta, Helsinki sold shoreline land to the highest bidders (record €2621/m²), ceding planning power, dropping social housing and enabling a fenced enclave for the wealthy. The grounding perspective is the political economy of urban land (Harvey's land as financial asset, Haila's rent theory), combined with neoliberal urbanism (Brenner & Theodore; Harvey's 1989 managerial-to-entrepreneurial shift, invoked explicitly on p. 140). Structural pressures (the 1990s recession, the 'necessity to save', state urban policy making cities compete) explain the policy, and a Bourdieuian 'strong discourse' naturalises market rule. Normatively the authors defend Nordic welfare-city values: public land, social mix, public capture of land value. (b) From a public choice / Hayekian perspective, the 'apologists' have a point the authors do not test. Selling at market prices reveals the opportunity cost of public land and ends hidden subsidies to developers, who (as the authors admit) captured land rent under discount pricing. The study offers no counterfactual or welfare analysis: would leasing have produced social housing on this site? It relies on 5 of 9 REC interviews and one case. A neo-institutionalist could add that the change is best explained by institutional reform (MRL 1999, corporatised state real estate), which is contingent and reversible, rather than by an inevitable neoliberal logic. The paper remains convincing on distributive outcomes, but its causal claim is weaker than its normative one.",rubric:["Accurate summary of the policy, the Eiranranta case and its three outcomes","Identifies political economy of land / neoliberal urbanism (and the explicit Harvey 1989 link)","Critique from a named alternative perspective (public choice/Hayek, neo-institutionalism, communicative), with assumptions made explicit","Uses evidence from the text (justifications, Apollo/Skanska, MRL, method) and weighs strengths and limits"]},
{t:"savini",pts:20,q:"Write a theoretical commentary on Savini & Aalbers (2016), 'The de-contextualisation of land use planning through financialisation'. (a) Which theoretical perspective grounds the argument, and how does it shape the explanation of the Falck case? (b) Critique the argument from an alternative perspective (e.g. neo-institutionalism or rational choice).",model:"(a) The authors argue that financialisation turns land into a liquid asset whose investment decisions are made by layered, distant investors, de-contextualising land capital from local needs. Three trends (relocation to risky peripheries, clustering, instrumental planning) and SPVs as 'separators and connectors' produce this. In the Falck case the site was sold four times; each owner inflated the programme (≈734,000 to ≈1.2M m²) and land price (up to €405M) to cover debt and expected returns, and the yield-dependent municipality of Sesto San Giovanni lost bargaining power, ending in gridlock. The grounding is Marxist political economy of financialisation: Harvey's capital switching and land as fictitious capital, extended by the claim that land now also serves as collateral to create credit elsewhere. Structure dominates: planning becomes functional to unlocking capital. Yet they add an institutional variable: outcomes vary with the complexity of financial constructions and the regulatory versus proactive role of public authorities. (b) A neo-institutionalist critique: the explanatory weight given to financialisation is hard to separate from Italian institutions: the PII negotiation regime, a small fiscally weak municipality, and alleged bribery (fn 3). An extreme single case cannot show that financialisation, rather than these institutions, caused gridlock; comparison with Weber's Chicago suggests institutional capacity is decisive. A rational-choice reading would model value capture as a bargaining game with commitment problems (SPVs can exit by resale), which explains the municipality's dilemma without a macro theory of capitalism. The authors' own conclusion (strong regulation plus proactive intervention) implicitly concedes that institutions, not finance alone, differentiate outcomes.",rubric:["Explains de-contextualisation, the three trends, SPVs and the Falck periodisation accurately","Identifies Marxist/Harveyan political economy of financialisation and the 'one step further than Harvey' claim; notes the institutional nuance","Critique from a named alternative perspective with explicit assumptions (neo-institutionalism, rational choice, Hayek, regime theory)","Evaluates methodology (single extreme case) and structure vs agency, reaching a reasoned judgement"]}
];

{id:"rydin6", wk:7, title:"Rydin (2021) Urban politics: conflict, power and justice", cite:"Rydin, Y. (2021). Urban politics: conflict, power and justice. In Theory in Planning Research (Ch. 6, pp. 105–125). Singapore: Palgrave Macmillan. https://doi.org/10.1007/978-981-33-6568-1_6", theory:"Urban politics / social movements (framework chapter: growth coalitions, regime theory, urban social movements, agonism, justice)", status:"full",
statusNote:"Built from the full text of Chapter 6 (extracted from the whole book); page numbers are the book's running headers (pp. 105–125). Note what the chapter does NOT contain: no discussion of Lukes' three dimensions of power, and Lefebvre appears only in a reference title (Butler 2012); 'Right to the City' gets one paragraph. The only power distinction it makes is Stone's 'power to' vs 'power over'.",
one:"Where the governance frame assumes conflict can be handled towards agreement, the urban politics frame sees conflict as unavoidable, power at play within planning and inequality in its outcomes; so planners cannot be neutral and must ask how to plan justly. Rydin organises the field into three dynamics (growth coalitions/urban regimes, urban social movements, agonism) with a running concern for justice, and shows how each is used in planning research.",
summary:["Framing (pp. 105–107). Urban politics starts from the insight that conflict is part of the fibre of planning. Unlike governance theory (ch. 5), it does not assume conflicts can be handled to reach effective or agreed outcomes; it looks at power in processes and inequality in outcomes. Planners 'cannot be neutral' and should act more like advocates; the research task is how to plan justly. The perspective studies both elite and non-elite actors, and rejects pluralism (Dahl), in which group activism simply follows demand: pluralism came to be seen as 'naïve' because power and resources are unequal, some issues never get on the agenda, and it legitimated a focus on middle-class pressure groups. Urban politics instead attends to the disempowered and treats non-violent occupations and even violence against property as legitimate protest.",
"Justice (pp. 106–107). Agyeman distinguishes four aspects: recognition of groups as self-determined (more than giving voice), fair process (e.g. visioning), just exercise of procedures (regulation, implementation) and fair outcomes. This frame is widely used for environmental justice (US origins in toxic sites near communities of colour; Love Canal). A second theme is the Right to the City movement (Butler 2012), e.g. Occupy after 2008. Because conflicts are linked to wider power and inequality (links to structuralism, ch. 7), planning alone can achieve little: justice requires wider political change. The research focus is not the sociology of conflict itself but how planners, planning organisations and systems respond to it (p. 107).",
"Coalitions and regimes (pp. 108–109). Molotch's growth coalitions: actors with most to gain from land and property development coalesce, with links to local government, to secure property-led growth; a response to technocratic views, emphasising class and local elites. Critiques: too agent-based (from political economy) and too simple (coalitions are fragmented, unstable, not only local, not always growth-led). Hence Stone's urban regime (Atlanta, 1989): an 'informal yet relatively stable group' that assembles the capacity to act because local government cannot implement its agenda alone; 'power to' rather than 'power over'; based on resource interdependence, cooperation has to be achieved. Four regime types (maintenance/caretaker, development, middle-class progressive, lower-class opportunity expansion); Dowding et al.'s eight criteria. Critiques: bias to corporate interests (Pierre: leaders must cater to business to access its 'systemic power'), US-specific (property taxes, local autonomy), limited transferability (Holman's four reasons).",
"Urban social movements and agonism (pp. 109–112). Left theorists disheartened by political economy's crisis-and-revolution message turned to politics with some autonomy from capitalist structures (Gramsci: the oppressed can perceive their own interests without a vanguard). Movements express a social cleavage, not a single issue. Castells linked urban social movements to conflicts over the means of collective consumption (public services needed to reproduce labour), resisting middle-class appropriation and capitalist limitation of services. Later work links USMs to identity, difference and place (Nicholls; Gualini and Bianchi); Mayer's four phases run from industrial crisis via collective consumption and gentrification to globalisation/financialisation. Critiques: gender blindness, North Atlantic bias. The USM's distinctive feature is its physical base in a place. Agonism (Mouffe) rejects governance's promise of consensus: conflict is inevitable and productive; the aim is to turn enemies into adversaries who 'agree to disagree'; critics ask whether it accepts existing power inequalities (Yamamoto).",
"Research in practice (pp. 112–123). Regimes revisited: Turin (Ravazzi and Belligni: incubation, naming/blaming/claiming, shift from pro-welfare to market-centred regime) and Guangzhou's Three Old Redevelopment (Li and Liu: regime concept supplemented with 'fragmented authoritarianism' and 'strategic selectivity'). Racism: Sulukule, Istanbul (Uysal: a Roma USM that failed to stop demolition because of unclear property rights, speculation, lack of public support, marginalisation, fragmentation and counter-pressure) and Native American fishing rights after the 1974 Boldt decision (environmental justice as decolonisation). Managing conflict: Trapenberg Frick's Tea Party/progressive tactical coalitions (ephemeral, emergent, established), REDWatch in Sydney as monitory democracy, and Fougère and Bond's Denniston Plateau coal mine (antagonism can create space for agonism; expert knowledge depoliticises). Conclusion: qualitative, normative, often action research, from the emic perspective of the marginalised."],
concepts:[["Urban politics perspective","Frame that sees conflict as unavoidable in planning, power at play within its processes and inequality in outcomes; planners cannot be neutral technocrats (p. 105)."],
["Pluralism (Dahl) and its critique","Groups form when there is demand (supply follows demand). Rejected as naïve: unequal resources, non-issues, and a legitimation of middle-class pressure groups (p. 106)."],
["Justice (Agyeman)","Four aspects: recognition of self-determined groups, fair process, just exercise of procedures, fair outcomes; widely used in environmental justice (pp. 106–107)."],
["Right to the City","Movement and claim against limited access to the city and inequitable use of its assets (Butler 2012; Occupy after 2008). Only briefly treated; Lefebvre himself is not discussed (p. 107)."],
["Growth coalition (Molotch)","Coalition of actors with most to gain from land and property development, linked to local government, pursuing property-led growth; criticised as too agent-based and too simple (p. 108)."],
["Urban regime (Stone)","'An informal yet relatively stable group with access to institutional resources' that assembles the capacity to govern through resource interdependence; four types; criteria by Dowding et al. (pp. 108–109)."],
["'Power to' vs 'power over'","Regime power is the capacity to achieve goals by combining resources ('power to'), not domination of one actor by another ('power over'); often less visible, alongside formal politics (p. 108)."],
["Systemic power / transferability","Pierre: to reach business's 'systemic power' leaders must cater to corporate interests; regime theory reflects US local government (property taxes, autonomy), so its transfer abroad needs amendment (Holman's four factors) (p. 109)."],
["Gramsci","Politics has relative autonomy from socio-economic structure; the oppressed can recognise their own interests and achieve change short of revolution, without a vanguard (p. 110)."],
["Urban social movement / collective consumption (Castells)","Movements expressing a social cleavage, mobilising over collective means (public services) for reproducing labour; Castells' USM combines collective consumption demands, community culture and political self-management (pp. 110, 116)."],
["Mayer's four phases","Industrial crisis 1960–80; collective consumption and welfare erosion 1980–90; gentrification and regeneration 1990–2000; globalisation and financialisation since 2000 (p. 111)."],
["Agonism (Mouffe)","Conflict is inevitable and productive; turn enemies into adversaries who can 'agree to disagree'; rejects deliberative consensus as a false promise; critics: may accept existing power inequalities (p. 112)."],
["Post-political","Planning that annuls dissent and silences overt conflict, e.g. by recourse to expert knowledge (Raco; Fougère and Bond) (pp. 112, 121–122)."],
["Place attachment vs NIMBY","Place-based identity used to resist the pejorative NIMBY label (Devine-Wright) (p. 112)."],
["Emic perspective / action research","Urban politics research takes the perspective of the marginalised and often supports the groups studied (p. 123)."]],

example:"Sulukule, Istanbul (Uysal 2012, pp. 115–117): the 2006 state-led regeneration of a largely Roma area for tourism and heritage displaced most residents to the outskirts. The Sulukule Platform (NGOs, a Roma association, outside activists and academics with an alternative STOP plan) is framed as a Castellsian USM. It won national and international attention but failed to stop demolition: unclear property rights, land speculation, lack of wider public support (reluctance to align with the Roma), a resource-poor marginalised community, internal fragmentation and counter-pressure from the council and developers.",
quotes:["\"Planners cannot be neutral in this conceptual context.\" (p. 105)",
"\"Regime analysis views power as fragmented and regimes as the collaborative arrangements through which local government and private actors assemble the capacity to govern\" (Mossberger and Stoker 2016: 812, quoted p. 108)",
"\"Urban politics is seen as the realm of social movements, which are socially more significant than individual pressure groups.\" (p. 110)",
"\"In essence, agonism involves a willingness to agree to disagree.\" (p. 112)"],
dims:{sa:60, rt:70, de:50, us:65, mp:70, norm:"Explicitly normative: equity, equality and justice (recognition, process, procedure, outcomes); planners as advocates rather than neutral technocrats; research from the emic perspective of disempowered groups, often as action research; conflict accepted (agonism) rather than wished away."},
exam:"Rydin is the framework text: use it to NAME the perspective in a commentary. Grounding: urban politics sits between agency-centred coalition/regime analysis and structural political economy (ch. 7); USMs keep capitalist conflict in view but give politics relative autonomy (Gramsci). Best critiques: (1) Marxist political economy: regime and coalition analysis is too agent-based and ignores structural drivers of accumulation; incremental movements cannot change structures. (2) Rational choice/Olson: why would large, poor, diffuse groups mobilise at all? The free-rider problem predicts under-organisation, which is also why pluralism fails (Olson and urban politics agree pluralism is wrong, for different reasons). (3) Neo-institutionalism: regimes are informal institutions; historical institutionalism explains why regime theory does not travel (US property tax, autonomy). (4) Governmentality: agonism and participation can be technologies that channel conflict; the 'post-political' critique. (5) Hayek: planners as advocates politicise planning and undermine the rule of law. Critical points: normative bias of researchers; US/North-Atlantic origins; agonism may accept existing inequalities. MCQ traps: regime power is 'power to' not 'power over'; Stone not Molotch coined urban regime; collective consumption = public services for reproducing labour (not consumer goods); no Lukes in this chapter; urban politics critiques pluralism."},

{id:"bossuyt", wk:7, title:"Bossuyt & D'Ottaviano (2025) Patterns of protection for housing commons", cite:"Bossuyt, D. & D'Ottaviano, C. (2025). The patterns of protection for housing commons: building occupations in São Paulo. International Journal of Urban and Regional Research, 2025 issue 5, 1021–1039. https://doi.org/10.1111/1468-2427.13335", theory:"Urban commons (neo-Marxian commons theory combined with Ostrom-style institutionalism); urban social movements", status:"full",
statusNote:"Built from the full published open-access text (IJURR 2025, issue 5, pp. 1021–1039 per the Wiley download header; volume number not shown in the file); page numbers are the journal's. Daniël Bossuyt (UU) is the course coordinator: expect this to be one of the commentary articles or at least a reference point.",
one:"Occupying vacant (public) buildings in central São Paulo turns them into housing commons, but reclaiming is not enough: commons must be protected against enclosure over time. Two self-managed cases (Dandara, Marisa Letícia) show five patterns of protection at three levels (regularization, restoration, integration, ideation, federation), yet protection is partial because regularization converts collective use claims into individual private titles that open new routes to enclosure.",
summary:["Problem and theory (pp. 1021–1024). The global housing crisis shows the failure of markets; the commons has emerged as a paradigm for reclaiming housing. Research on common-pool resources studies stability (Ostrom), but urban-commons work neglects reproduction: how commons endure against enclosure by capital and state. Housing commons have three dimensions: use value over exchange value (decommodification), self-governance (collective-choice and operational rules), and solidarity through cohabitation. Enclosure takes three forms: commodification (selling for profit), marginalization (exclusivity towards outsiders) and cooptation (state undermining self-governance). Theorists split on property: Dardot and Laval (commons cannot be property), Harvey ('some degree of closure' needed), de Angelis and Stavrides (porosity and proliferation). The authors use de Angelis' tripartite commons (common good, community, commoning practices) and a relational view of property.",
"Context and method (pp. 1024–1028). Qualitative participatory action research (2016–2021, via the Brazilian extensão model: one team member was architect of Dandara's retrofit) plus 19 interviews (10 residents, 3 movement leaders, 3 policymakers, 2 social workers, 1 architect). São Paulo has about 590,000 vacant properties and 29,500 homeless families (2022 census). The 1988 Constitution and 2001 City Statute enshrine the right to housing and the social function of property; occupations exploit the contradiction between this principle and the right to private property, legitimising themselves by targeting vacant, tax-defaulting or public buildings. The ULC (founded 1991), part of the UMM umbrella (1987), is less confrontational and frames occupation through citizenship and social rights.",
"The cases (pp. 1028–1033). Dandara (former state court in Sé, occupied 2009, renovated 2014–2018) and Marisa Letícia (INSS warehouse site in Brás, completed 2019) are the only two occupations in central São Paulo completed as permanent self-managed housing. Stages: appropriation (forced entry, care, rules of access, legitimacy vs 'invasion'); regularization via autogestão and structural coupling with the state (SPU Ordinance 179; MCMV-Entidades, which gave movements direct access to federal funds but at a cap requiring municipal and state top-ups); renovation through mutirão, committees and an effort-based points system that allocated units and prevented free-riding; moving in, with gates, doormen, condominium courses by social workers. Property regimes diverge: Marisa Letícia became an individual condominium; Dandara a use-right concession.",
"Patterns of protection (pp. 1033–1035). Level of the common good: regularization (legal recognition, tenure security) and material restoration (habitability, night vigils, barriers). Level between housing development and movement: integration (embedding residents in the movement's political struggle; points system cultivates solidarity) and ideation (commons ideas stored in movements and materialising later, e.g. Uruguayan cooperative know-how). Interface movement–state: federation (floor committees → resident committees → entidades → movements → federations), which inserted autogestão into state policy (MCMV-E).",
"Partial protection and contribution (pp. 1035–1037). Regularization converts collectively claimed public property into individual private titles plus mortgages, making households 'indebted subjects' and eroding collective action; movements ban sale and subletting but cannot enforce it, and a unit appeared on a subletting platform. Institutionalist approaches are 'only of partial use' because they ignore the political dimension; commoning is a pragmatic practice with contradictions. Contributions: combining institutionalist and neo-Marxian understandings of the commons, and showing private law's progressive potential; they call for legal reform enabling collective property and for an 'archipelago of the commons'."],
concepts:[["Commons / commoning","Commons: resources collectively produced, shared and used for use value; commoning: the active practices of sharing and managing them. Housing is not a commons in itself but becomes one through practices and rules (p. 1022)."],
["Three dimensions of housing commons","Use value over exchange value (decommodification); self-governance (residents set collective-choice and operational rules); solidarity and participation through cohabitation (p. 1022)."],
["Enclosure (three forms)","Commodification (individual sale for profit), marginalization (exclusivity towards outsiders), cooptation (state undermining self-governance) (p. 1023)."],
["Tripartite commons (de Angelis)","A social system of common good (object, incl. relational property), community (subject) and commoning practices, within a socio-political context (pp. 1023–1024)."],
["Social function of property","Brazilian constitutional principle that private property must benefit the collective; basis for legitimising occupation of vacant property against the right to private property (p. 1027)."],
["Autogestão / mutirão","Collective self-management and collective labour: residents' organisations (entidades) run procurement, labour and construction; also a political principle of horizontal governance (pp. 1029–1031)."],
["Structural coupling","De Angelis: commons strategically align with state systems (legal frameworks, funding) to stabilise their claims and safeguard autonomy (p. 1030)."],
["MCMV-Entidades","Federal programme (2009) channelling funds to movement-led self-managed housing (3% of the MCMV budget); first direct federal access for movements; per-unit cap insufficient for central retrofits (p. 1030)."],
["Effort-based points system","Allocation of units by participation (meetings, occupations, marches) to incentivise contribution and prevent free-riding: a self-regulatory boundary (p. 1031)."],
["Five patterns of protection","Regularization and restoration (housing development); integration and ideation (development ↔ movement); federation (movement ↔ state) (pp. 1033–1035)."],
["Ideation","Varvarousis: commons 'ideated' during a liminal occupation materialise later elsewhere; know-how stored in movements awaits an opportune political moment (pp. 1034–1035)."],
["Partial protection / new enclosure","Regularization protects against eviction but creates individual titles and debt that enable commodification (subletting, sale) (p. 1035)."]],

cap:"Commoning cycle (top), the five patterns of protection by level (middle) and the contradiction that regularization reopens enclosure (bottom).",
table:{head:["Pattern","Level","What it protects","Case evidence"],rows:[
["Regularization","Housing development (common good)","Tenure security against eviction via legal recognition","SPU Ordinance 179 (Dandara, use-right concession); MCMV-E (Marisa Letícia, condominium)"],
["Restoration","Housing development","Habitability, safety, collective use rights","Mutirão renovation; night vigils; gates, doorman"],
["Integration","Development ↔ movement","Political engagement, solidarity; prevents marginalization","Entidades as entry point; effort-based points system"],
["Ideation","Development ↔ movement","Know-how that outlives hostile politics","Uruguayan cooperative federation's influence (1980s)"],
["Federation","Movement ↔ state","Resources and policy change","ULC within UMM; autogestão institutionalised in MCMV-E"]]},
example:"Dandara: a vacant former state court on Avenida Ipiranga (Sé) occupied by the ULC in 2009 after negotiations with the federal patrimony secretariat stalled. SPU Ordinance 179 designated it a public-interest asset; MCMV-Entidades funded a self-managed retrofit (federal cap of BRL 76,000 per unit, topped up by state and municipal funds). Families earned points for participation, sat on committees and slept on the mezzanine for over a year to guard the site; they moved in from December 2017 under a use-right concession. Residents may not sell or sublet, but the movement cannot enforce this.",
quotes:["\"Housing, like any other good, does not constitute a commons in and of itself; rather, it becomes one through an open-ended interaction between practices and rules (Dardot and Laval, 2019).\" (p. 1022)",
"\"Housing units were allocated by entidades using an effort-based points system designed to incentivize participation and prevent free-riding.\" (p. 1031)",
"\"Collective use claims are thus essentially transformed into individual property titles, illustrating how regularization—purely out of necessity—may reproduce a hegemonic property regime in the absence of legal options for collective ownership.\" (p. 1034)",
"\"In trying to understand the stability of housing commons, prevailing institutionalist approaches are only of partial use because they overlook the political dimension integral to such projects.\" (p. 1036)"],
dims:{sa:65, rt:55, de:55, us:80, mp:65, norm:"Decommodification of housing (use value over exchange value), right to housing and to live in the centre, social function of property, self-management and solidarity; engaged research (participatory action research with the movements); calls for legal reform enabling collective property."},
exam:"Grounding perspective: urban commons theory in a neo-Marxian register (de Angelis, Harvey, Dardot and Laval: enclosure, use vs exchange value, capitalist urbanization) combined with Ostrom-style institutionalism (collective-choice rules, boundaries, points system against free-riding); movements are USMs in Castells' sense (collective consumption, the right to the city). The authors themselves claim to bridge institutionalist and neo-Marxian views. Best critiques: (1) Neo-institutionalism / Pruijt: regularization, MCMV-E and 'structural coupling' look like institutionalization or even cooptation (movements become housing producers for a countercyclical state programme); historical institutionalism explains why only a condominium regime was available (path dependence of Brazil's ownership culture). (2) Marxist political economy (harder line): the state crafts private property and debt from collective claims; commons as a fix that lets the state off the hook; only two successes out of many occupations. (3) Rational choice/Olson: the points system IS a selective incentive; residents' homeownership aspirations and subletting show individual interest eroding the collective good once the selective incentive ends. (4) Hayek: secure private titles are what give residents security and freedom; occupations violate the rule of law and property. (5) Governmentality: condominium courses and mortgages produce responsible, indebted subjects. Critical points: two successful cases (selection on the dependent variable), researchers are involved actors (PAR), normative commitment to commons shapes interpretation, 'protection' partly means exclusion. MCQ traps: five patterns (not three), levels, 'structural coupling' is de Angelis', enclosure forms."},

{id:"pruijt", wk:7, title:"Pruijt (2003) Is the institutionalization of urban movements inevitable?", cite:"Pruijt, H. (2003). Is the institutionalization of urban movements inevitable? A comparison of the opportunities for sustained squatting in New York City and Amsterdam. International Journal of Urban and Regional Research, 27(1), 133–157. https://doi.org/10.1111/1468-2427.00436", theory:"Urban social movements / political opportunity structure, testing post-Fordist theory and Castells' life-cycle view of institutionalization", status:"full",
statusNote:"Built from the full text of the author's PREPRINT (header: 'Preprint. Published in IJURR, 2003, Vol. 27, nr. 1, March, 133-157'). Page numbers given here are the preprint's own (pp. 1–29), NOT the journal pagination 133–157; wording may differ slightly from the published version.",
one:"Institutionalization of urban movements is not inevitable: Amsterdam's squatters combined legalization with continued disruption (flexible institutionalization), whereas in New York the market-oriented regime co-opted housing-movement squatting into service provision. A squatters' movement proper, for which squatting is an end and not only a means, is immune to cooptation; paradoxically, a redistributive regime offers more opportunities for squatting than a market-oriented one.",
summary:["Question and theory (pp. 1–6). Squatting, like any movement, operates within an opportunity structure. Castells (1977) observed that states respond to radical urban movements with both repression and integration; Castells (1983) held that institutionalization, with its attendant identity loss, is inevitable, and protest-wave theory places it at the end of a cycle. Pruijt distinguishes two forms of integration. Institutionalization: a movement channelled into a stable pattern based on formalized rules; terminal (convention replaces disruption) or flexible (conventional tactics complement disruptive ones). Cooptation (after Selznick): the co-opting organization embraces some movement ideas while redefining problems so that solving them does not threaten its stability. Post-Fordist theory predicts that a market-oriented regime, cutting welfare, pushes the 'privatization of poverty' and co-opts movement groups as service providers, while city competition increases repression.",
"Cases (pp. 6–11). Both cities had a housing shortage and many vacant buildings but different regimes: the US a liberal welfare regime, the Netherlands social-democratic traits (Esping-Andersen). Amsterdam housed about 9,000 squatters (1981) with a rich infrastructure; New York's movement peaked at 500 squatters in 20 buildings. In Amsterdam the municipality bought about 200 squats and handed them to housing associations; squatters took part in planning, yet kept defending buildings and rioting (e.g. the 1980 coronation): flexible institutionalization, with hardly any cooptation. In New York, 1970s squatting by housing groups died out as organizers moved into city programmes (Tenant Interim Lease, official homesteading with 'sweat equity'), ACORN got 58 buildings only after promising to stop squatting, and Banana Kelly became a service provider: cooptation as post-Fordist theory predicts.",
"The anomaly and its explanation (pp. 11–14). After 1983 a squatters' movement proper emerged on the Lower East Side that was neither co-opted nor repressed out of existence; the city refused to negotiate, and 11 squats were legalized only in 2002 via UHAB once no squattable buildings were left: terminal institutionalization. The city did try cooptation elsewhere (ICP, Bronx, 1992), so the explanation lies in the movement. For a housing movement, squatting is a means to house the poor; officials can claim to share the goal and offer support if squatters switch to approved means. For a squatters' movement, squatting is itself institutionalized (Berger and Luckmann) as means and goal, so officials cannot claim shared goals. European activists carried this identity to New York: a pre-existing oppositional identity can partly override the opportunity structure.",
"Other opportunity-structure differences (pp. 14–18). Property protection: the 1971 Dutch Supreme Court extended 'house right' to squatters, whereas in the US squatting is criminal trespass, pushing squatters to covert action and city-owned buildings, which leaves speculators alone. Technical condition: New York's abandoned, disinvested tenements were far worse than Amsterdam's. Gentrification: squatters can be precursors but squatting is not gentrification; its effect on the Lower East Side is contested (it may have slowed it).",
"Competition with low-income housing providers and conclusion (pp. 19–24). In New York squatters clashed frequently with non-profit developers in an opaque public–private 'poverty industry'; in Amsterdam a broad consensus (affordability, profit/non-profit demarcation, reliability, democratic planning, recognition of squatters' needs) meant squatters left for renewal voluntarily. The market regime leaves one leeway: radicals can act as watchdogs against the 'Weber-Michels' scenario of co-opted groups, but conflict stays local, leaving big real estate, banking and politics unaffected. Post-Fordist theory sees only cooptation; movements that keep an oppositional identity have other options."],
concepts:[["Opportunity structure","The context that determines whether and how a movement can develop and how effective it can be; here urban regime, property law, access to officials, building condition (p. 1)."],
["Institutionalization","A movement 'channeled into a stable pattern based on formalized rules and laws'; for Castells it implies identity loss; for Kriesi et al. a shift from disruption to convention (pp. 2–3)."],
["Terminal vs flexible institutionalization","Terminal: convention replaces disruption (end of movement, e.g. New York 2002). Flexible: conventional tactics complement disruption (Amsterdam) (p. 4)."],
["Cooptation","The co-opting organization embraces some movement ideas while redefining problems so their solution does not threaten its stability; gives activists a role (Selznick; Warren et al.) (p. 4)."],
["Privatization of poverty","Post-Fordist logic: a retreating welfare state encourages self-help and uses movement groups as 'plugs for holes'; self-help becomes a cheaper substitute and absorbs activists' energy (pp. 5, 9)."],
["Market-oriented vs redistributive urban regime","Pruijt's 'urban regime' means a city's policy orientation (market forces vs state intervention/redistribution), grounded in welfare-state regimes (Esping-Andersen), not Stone's coalition concept (pp. 1, 7)."],
["Housing movement vs squatters' movement","For a housing movement squatting is one possible means to house the poor (co-optable); for a squatters' movement squatting is means and end, with its own identity (immune to cooptation) (pp. 12–13)."],
["House right (1971)","Dutch Supreme Court ruling extending protection of the home to squatters, which made long-lived squats possible; its erosion after 1986 coincided with decline (pp. 14–15)."],
["Covert squatting","Without legal rights, New York squatters hid and chose city-owned buildings, which isolated them and left speculators in peace (p. 15)."],
["Poverty industry / Weber-Michels scenario","Opaque third-sector low-income housing sector; co-opted groups may drift from movement to managerial self-interest, and radicals can act as watchdogs (pp. 22–23)."]],

example:"ACORN in Brooklyn (p. 10): in 1985 it organized the squatting of 25 city-owned buildings that were due to be auctioned. The city changed policy and turned 58 buildings over to ACORN/Mutual Housing Association of New York, with rehabilitation funds, but only after ACORN promised to abandon squatting: a textbook case of cooptation, where officials accept the goal (homes for the poor) and trade support for giving up the oppositional means.",
quotes:["\"Institutionalization means that a movement is channeled into a stable pattern based on formalized rules and laws.\" (preprint p. 2)",
"\"Terminal institutionalization implies that, in the repertoire of action, convention replaces disruption; in flexible institutionalization, conventional tactics complement disruptive ones.\" (preprint p. 4)",
"\"Thus the absence of rights gives rise to covert action which diminishes the likelihood of cooperation and self-organization.\" (preprint p. 15)",
"\"A squatters' movement such as the one in Amsterdam is immune to cooptation because it involves squatting not only as a means but also as an end.\" (preprint p. 23)"],
dims:{sa:50, rt:55, de:55, us:70, mp:55, norm:"Implicitly sympathetic to squatting: 'effective squatting' means viable squatting models for all empty buildings and a lively, low-income-people-friendly city; favours redistributive planning and the Amsterdam consensus model; critical of self-help as a cheap substitute for welfare (privatization of poverty)."},
exam:"Grounding perspective: social-movement theory (political opportunity structure, repertoires of action) used to test post-Fordist (neo-Marxian regulation) theory and Castells' claim that institutionalization is inevitable; structure (regime, law, building stock) vs agency (movement identity) is the central tension. Best critiques: (1) Neo-institutionalism: Pruijt's own key term. Sociological institutionalism explains why the squatters' identity became taken for granted (Berger and Luckmann, which he cites) and why co-opted groups converge on service-provider forms (isomorphism); historical institutionalism: the 1971 ruling as a critical juncture creating path dependence. (2) Rational choice/Olson: squatting is a rare movement where the collective good comes with a private, excludable benefit (a home), i.e. a selective incentive, which explains mobilisation; but it also explains why housing-movement squatters accept legalization (economic vs political aims, Cherki) and why homesteaders turned against squatters once they became owners. (3) Hayek: squatting violates property rights and the rule of law; the Amsterdam model depends on heavy state planning. (4) Governmentality: cooptation and the 'privatization of poverty' as governing through community and self-help ('state-organized norm of organization and control'). (5) Marxist: squatters as unwitting gentrification pioneers; conflict contained locally leaves capital untouched (Pruijt concedes this). Weaknesses: two cases, author involved in the Amsterdam scene/research (1980–84), functionalist reasoning, dated. MCQ traps: 'urban regime' here = market vs redistributive orientation, not Stone; flexible (Amsterdam) vs terminal (NY 2002); cooptation ≠ institutionalization; market regime offers FEWER opportunities for squatting except in low-income rehabilitation."}

{t:"rydin6",pts:20,q:"Rydin argues that from an urban politics perspective 'planners cannot be neutral'. Identify the theoretical perspective(s) on which her account of urban politics rests, explain how growth coalitions, urban regimes and urban social movements each conceptualise power, and critically evaluate this perspective from ONE alternative perspective discussed in the course.",
model:"Rydin's urban politics frame is a critique of governance theory: conflict is unavoidable, power operates within planning and outcomes are unequal, so the planner must plan justly and act as advocate (p. 105). It rejects pluralism (Dahl) as naïve. Its three dynamics differ in how they see power. Growth coalitions (Molotch): elites with land and property stakes steer local government towards growth, i.e. power over the agenda rooted in class and land. Urban regimes (Stone): an informal but stable coalition assembles 'power to' govern by pooling interdependent resources; business's 'systemic power' biases regimes (Pierre). Urban social movements (Castells, via Gramsci): the disempowered mobilise around social cleavages, first over collective consumption, later identity and place; politics has relative autonomy from capitalist structures. Justice (Agyeman: recognition, process, procedure, outcomes) runs through all. Critique from rational choice (Olson): urban politics assumes that the disempowered mobilise, but collective action is costly; large diffuse groups free-ride, so movements should be rare and short-lived unless selective incentives exist. This explains why some issues never become activism better than 'power' alone, and warns planners that organised voices are unrepresentative. Olson in turn underplays identity, solidarity and moral motives that USM theory highlights, and ignores unequal structural power. A second angle (political economy) would call regime theory too agent-based. Conclusion: urban politics is strong on normativity and conflict, weaker on explaining when mobilisation happens.",
rubric:["Identifies urban politics as a critique of governance/pluralism, with links to structuralism (Gramsci, Castells) and normative commitment to justice","Correctly distinguishes growth coalition, regime ('power to', Stone) and USM (collective consumption) views of power","Develops a coherent critique from one named alternative perspective (e.g. Olson, political economy, neo-institutionalism, governmentality, Hayek)","Evaluates: strengths and limits on both sides, uses chapter evidence and page references"]},
{t:"bossuyt",pts:20,q:"Write a theoretical commentary on Bossuyt and D'Ottaviano (2025). Which theoretical perspective grounds their argument about the 'patterns of protection' of housing commons? Critique their argument from an alternative perspective of your choice (for example neo-institutionalism, rational choice or Hayekian liberalism).",
model:"The article is grounded in urban commons theory in a neo-Marxian register: housing is reclaimed from enclosure by capital and state, prioritising use over exchange value (de Angelis, Harvey, Dardot and Laval), and occupations are movement-led claims based on the social function of property and the right to the city. The authors add Ostrom-style institutionalism (collective-choice rules, boundaries) and claim to bridge both (p. 1036). Argument: protection happens through five patterns at three levels (regularization and restoration; integration and ideation; federation), but is partial because regularization reproduces a hegemonic private property regime (p. 1034). Critique from neo-institutionalism, sharpened by Pruijt: what the authors call 'structural coupling' and 'federation' can equally be read as institutionalization and cooptation. MCMV-Entidades embraced the movements' goal (housing the poor) while redefining the problem so it fitted a countercyclical construction programme and homeownership; movements became producers and managers, and the end state is individual condominium titles and mortgages. Historical institutionalism explains why: Brazil's path dependence on ownership (military-era lending, cultural ideal) left no collective tenure form. So the 'protection' patterns may be the mechanism of enclosure rather than a shield against it. The authors partly concede this, but their normative commitment to commons and their role as participatory researchers, and the selection of the only two successes, bias the reading towards protection. A rational-choice angle adds that the points system is a selective incentive that disappears after allocation, explaining subletting. Evaluation: strong on contradictions and empirical richness; weaker on generalisability.",
rubric:["Identifies commons theory (neo-Marxian enclosure/use value) plus Ostrom institutionalism as grounding, with key concepts (five patterns, levels, structural coupling, enclosure)","Accurately reports the argument, including partial protection via private titles and debt","Critiques convincingly from a named alternative perspective (e.g. institutionalization/cooptation, path dependence, Olson's selective incentives, Hayek on property)","Evaluates methodology and normativity (two successful cases, participatory action research, authors' commitment)"]},
{t:"pruijt",pts:20,q:"Write a theoretical commentary on Pruijt (2003). Which theoretical perspective grounds his argument that institutionalization of urban movements is not inevitable? Critique it from an alternative perspective discussed in the course.",
model:"Pruijt's argument rests on social-movement theory (political opportunity structure, repertoires of action) used to test two structural claims: Castells' view that institutionalization, with identity loss, is inevitable, and post-Fordist theory that market-oriented regimes 'privatize poverty' and co-opt movements as service providers. Comparing Amsterdam and New York, he distinguishes terminal and flexible institutionalization and cooptation. New York's housing-movement squatting was co-opted (TIL, ACORN, Banana Kelly), confirming post-Fordism; Amsterdam's squatters were legalised yet kept disrupting (flexible). A squatters' movement proper, for which squatting is means and end, resists cooptation; opportunity structure (property law, access, building condition) still shapes outcomes, so a redistributive regime paradoxically offers more room for squatting. Critique from rational choice (Olson): squatting is unusual because the collective good comes bundled with a private, excludable benefit, a home: a selective incentive. This explains mobilisation without needing identity, and also cooptation: once legalization secures individual housing, the incentive to keep protesting falls (Cherki's economic vs political aims; homesteaders turning against squatters). Pruijt's identity explanation for the Lower East Side is thus under-theorised; rational choice would ask about costs (covert squatting, trespass law) and benefits. Olson, however, struggles with Amsterdam's continued riots after legalization, where expressive and identity motives matter. A neo-institutionalist would add that the 1971 ruling was a critical juncture. Weaknesses: two cases, author embedded in the Amsterdam scene, functionalist reasoning and a preprint-era dataset. Conclusion: a persuasive challenge to determinism, but with a thin micro-foundation.",
rubric:["Identifies social-movement/opportunity-structure theory and the tested theories (Castells, post-Fordism); correct use of terminal/flexible institutionalization and cooptation","Reports key comparative findings and the means/end mechanism accurately","Critiques from a named alternative perspective with a clear argument (e.g. Olson's selective incentives, neo-institutionalism, governmentality, Hayek, Marxist gentrification critique)","Evaluates design and bias (two cases, functionalism, author involvement, generalisability)"]}
];

const NEW_D=[
{id:"raco", wk:7, title:"Raco & Imrie (2000) Governmentality and rights and responsibilities in urban policy", cite:"Raco, M. & Imrie, R. (2000). Governmentality and rights and responsibilities in urban policy. Environment and Planning A, 32(12), 2187–2204. doi:10.1068/a3365", theory:"Foucault / governmentality (advanced liberalism, after Rose, Miller and Dean)", status:"full",
 statusNote:"Full article on file (pp. 2187–2204); page numbers are the journal pagination. No lecture slides yet for the 22 Oct session. Links to Rydin ch. 8, Taylor (2016), NPM/rational choice and Marxism are my own connections, marked as such.",
 one:"New Labour's 'rights and responsibilities' agenda, studied through the Single Regeneration Budget (SRB), is not a devolution of power to communities but a shift in the art of government: the state governs 'at a distance' by constructing active, self-responsible communities and binding them with audit, targets and competitive bidding. In return for a little extra freedom, subjects come under greater monitoring, scrutiny and surveillance.",
 summary:["Framework (pp. 2188–2191). Following Foucault, Rose, Miller and Dean, governmentality is the 'conduct of conduct': government works through political rationalities (ways of thinking about which problems authorities should address, with moral justifications and a picture of who is to be governed), programmes (white papers, guidance, inquiries that try to reorganise practice) and technologies (audit, benchmarking, devolved budgets, performance criteria that create 'calculable spaces'). Power is not reducible to the state; the state is 'no more than a specific form of government' (p. 2190). 'Advanced liberalism' governs through the self-governing capacities of free subjects; welfare retrenchment means less state intervention but 'not necessarily ... any less government' (p. 2191).",
 "Rationality and programme: government through community (pp. 2192–2196). SRB (April 1994) replaced many 1980s schemes with one competitive fund for local public–private partnerships that must 'involve the community fully at all stages'. Ten per cent of project funding goes to community 'capacity building'. Territory of government is rescaled from society to community: the local gets 'ontological status' as the site of effective government. The authors read this as directed self-government producing Rose's 'communities of obligation': more rights to define agendas, but conditional on wider responsibilities, and bids must 'work within the grain' of national frameworks. Behind the inclusion rhetoric lie 'discourses of public and private sector abandonment' (p. 2195): deprived areas must provide for themselves.",
 "Technologies: subjectivity and expertise (pp. 2196–2201). Partnerships must file quantitative progress reports every three months against a priori targets; accountability is vertical, not horizontal; underperformance can lead to intensive monitoring or withdrawal of funding. Best Value and Best Practice discipline local authorities and bidders, partly through peer comparison ('disciplinary government at a distance'). Expertise is redrawn: local knowledge is given privileged status rhetorically, yet community representatives are trained by professionals to handle bureaucratic procedures, baselines and monitoring, making community aspirations 'calculable'. Professionals too become subordinated to performance mechanisms.",
 "Conclusion (pp. 2201–2202). The Foucauldian approach links the mentalities and conduct of the population to the objectives and techniques of government. SRB 'identifies and institutionalises communities of action', gives them a minimum of competitively allocated resources, and binds them into 'rigid and closely monitored managerial frameworks'. Because the art of government is politically constructed, it can also be reconstructed: the analysis may feed 'resistance, contestation, and challenge', e.g. subpolitics of identity and a rebuilt 'social'.",
 "Method and status of the claim. The evidence is a critical reading of official documents (DETR bidding guidance, ministerial speeches, CSJ report) plus secondary evaluation evidence (mainly Foley et al. 1998); there is no primary fieldwork (p. 2192). SRB is used as a 'heuristic vehicle' to comment on governmentalisation. This matters for a commentary: the article shows how policy texts construct subjects, not how people on the ground actually experienced or resisted them."],
 concepts:[["Governmentality","Foucault's term for the ensemble of institutions, procedures, calculations and tactics through which the conduct of a population is shaped; government as 'the conduct of conduct', not reducible to the state."],["Political rationality","A way of thinking about which problems can and should be governed, with moral justifications and a description of the subjects to be governed (Rose & Miller)."],["Technologies of government","Practical techniques (audit, targets, benchmarking, devolved budgets, bidding rules) that make programmes operable and create 'calculable spaces of action'."],["Advanced liberalism","Rose's term for rule through the regulated choices of autonomous actors: marketised welfare, audit, fragmentation of collective provision, reinvented community."],["Government at a distance","Central government steers local actors through rules, funding conditions and monitoring instead of direct provision; the governed police themselves."],["Government through community","Community is made both the object and the instrument of policy; pre-existing bonds are transformed, affiliated to expertise and given duties."],["Communities of obligation","Rose: communities gain rights to shape agendas only on condition of accepting wider responsibilities for delivery."],["Responsibilisation / active citizen","Transformation of subjectivity from passive recipient to self-governing agent who takes responsibility for welfare and regeneration."],["Empowerment as technology","After Cruikshank: 'empowerment' is a technique for transforming subjectivity, producing a qualitative change in subjects, not a quantitative gain in power."],["Calculable spaces","Domains made governable through quantification (baselines, outputs, milestones) that experts can monitor from above."]],

 dims:{sa:30, rt:45, de:40, us:70, mp:65, norm:"Critical: exposes control behind empowerment rhetoric; values unconditional rights, local democratic (horizontal) accountability and the possibility of resistance/reconstruction of the 'social'."},
 exam:"Grounding perspective: Foucault/governmentality (Rose, Miller, Dean): rationalities, programmes, technologies; power as productive and dispersed, the state as one site among many; subjects constituted by discourse. Structure-leaning but not structuralist (my link: Rydin ch. 8 places Foucauldian work between actor-centred and political-economy approaches). Best critiques: (1) Rational choice / principal-agent (my link: Rydin ch. 8, p. 156, notes NPM is often justified as incentive alignment): the same evidence (managers use monitoring only to check targets; involvement is 'a necessary requirement (for funders)') suggests strategic compliance with funding incentives rather than internalised subjectivity, so governmentality may over-read the texts. (2) Marxist political economy: Raco and Imrie deliberately refuse a unified state and class analysis, yet their own sources point to cost-cutting and 'abandonment'; a Marxist reading would ground SRB in fiscal crisis and the reproduction of uneven development rather than in 'mentalities'. (3) Communicative planning / Healey (quoted in the opening): capacity building could be genuine institution-building; the article offers no way to tell empowerment from control. (4) Method: documents plus secondary evaluation only; little evidence on actual subjects or resistance, which the conclusion itself calls for. MCQ traps: governmentality is not 'less government' but different government; 'empowerment' = qualitative change in subjectivity, not quantitative gain; accountability is vertical, not horizontal; communities of obligation = rights conditional on duties; the paper is about New Labour but says it continues Thatcherite active-citizen ideas."},

{id:"gurran", wk:7, title:"Gurran & Ruming (2016) Less planning, more development? Housing and urban reform discourses in Australia", cite:"Gurran, N. & Ruming, K. (2016). Less planning, more development? Housing and urban reform discourses in Australia. Journal of Economic Policy Reform, 19(3), 262–280. doi:10.1080/17487870.2015.1065184", theory:"Discourse analysis (broadly Foucauldian: regimes of truth) within a critique of neoliberal planning reform", status:"full",
 statusNote:"Full text on file, but it is the online-first version (published online 22 Sep 2015), paginated 1–16, not the issue pagination 262–280. All page numbers here refer to the online-first pages. Figures 1–3 are charts only partly legible in the text file; the numbers used are those stated in the prose. Links to Taylor (2016), Hayek/Glaeser, Marxism and neo-institutionalism are my own connections.",
 one:"In the 2011–2014 New South Wales planning reform, the development industry's framing of planning as 'red tape' that blocks housing supply, growth and affordability became a 'regime of truth' that the government's White Paper and draft Planning Bill largely adopted, while community, environmental and affordable-housing concerns were sidelined. Housing affordability served as a 'semantic justification' for a wider deregulatory agenda; the Bill nevertheless stalled under community backlash, and approvals boomed while prices kept rising.",
 summary:["Context (pp. 1–7). Planning systems have resisted deregulation and elsewhere (UK section 106, US inclusionary zoning) are used to secure affordable housing, but their legitimacy is now questioned for slowing supply (Glaeser and Ward, Ball) and for exclusionary use by owners. Australia has one of the world's most expensive housing markets; ownership fell from about 71% (mid-1980s) to 68% (2012). A long-running national microeconomic reform agenda (COAG) prioritises deregulation of planning and development assessment. Social housing approvals in NSW fell from around 15% of dwellings in 1983 to under 2% in July 2014; the NHSC's 85,000-dwelling shortfall would have been roughly offset (90,000 extra dwellings) had social housing production stayed at its 1996 level (p. 6).",
 "Approach (pp. 2–3, 7–9). A 'broadly Foucauldian analysis' treats language as producing reality: the power of a group rests on its capacity to sustain a version of reality as 'objective truth'; discourses harden into 'regimes of truth' that fix acceptable problems and solutions (Jacobs, Hastings, Clapham). Data: the July 2012 Green Paper (over 1,200 submissions, 72% from community individuals and organisations, 1% from the development industry), 13 selected submissions (industry: PCA, UDIA, Urban Taskforce, Australand, HIA, Master Builders; plus PIA, LGSA, WSROC, Shelter NSW, EDO, NCC/TEC, and the resident group FOKE), and the April 2013 White Paper and draft Planning Bill; close reading, coding and NVIVO keyword searches.",
 "Findings: framing and objectives (pp. 10–11). Industry frames planning as dysfunctional, bureaucratic and anti-growth, and residents as part of the problem; local government and residents frame the problem as distrust and 'undue influence of developers'. PCA: the system should deliver 'an economic dividend'. Local government and residents want ecologically sustainable development, social impact and heritage objectives kept. The White Paper makes promoting economic growth the 'main purpose' of planning; the Bill positions housing as 'economic activity' and relegates environment and society through 'while' and 'having regard to'.",
 "Findings: specific reforms (pp. 11–14). Easier spot rezoning with developer appeals: supported by industry, opposed by councils, adopted. Participation: promised as central, yet no new consultation rights and curtailed statutory consultation in development assessment; Australand wants an 'antidevelopment culture' to shift. Red tape: PCA's claim of 40% cost reduction comes with no evidence; the Bill bans 'onerous' controls affecting financial viability. Infrastructure: here government resists industry, which (against its free-market line) wants broad-based public funding; developers keep paying. Affordable housing: Shelter's inclusionary zoning ignored; existing affordable housing contribution provisions are wound back.",
 "Conclusion (pp. 14–16). Industry discourse aligned with neoliberal ideology dominated the formal process, but ideology and interests are not the only drivers: the Bill stalled by the end of 2013 in parliament, where the government lacked a majority, after a backlash by the Better Planning Network (more than 300 resident groups; the 'Hazzard tape' protest), whose influence worked outside the formal process. Ironically, approvals reached a 20-year high and almost doubled (Dec 2011 to 2014) under the unreformed system, while Sydney's median house price rose from $535,000 (March 2011) to $735,000 (December 2014): more supply did not ease affordability. The authors ask whether reform discourse distracts from the real pressures on low-income renters and aspiring owners."],
 concepts:[["Discourse (Foucauldian)","Language as producing reality and knowledge, not a neutral medium; meaning is contested and tied to power."],["Regime of truth","A dominant, relatively static representation of reality that fixes which problems and solutions count as acceptable (Foucault 1980, via Jacobs)."],["Supply-side / 'red tape' discourse","The industry narrative that planning regulation constrains supply, raises costs and so causes unaffordability; deregulation is the cure."],["Semantic justification","Using housing affordability as a rhetorical warrant for deregulation whose real content is growth and development."],["Rhetorical relegation","Placing environmental and social goals in subordinate clauses ('while', 'having regard to') so that growth becomes the primary purpose."],["Neoliberal planning reform","Microeconomic reform aimed at deregulation and competition: simplified controls, faster decisions, standardised plans, user-pays infrastructure."],["Spot rezoning","Changing permissible land uses on a single site; can deliver large windfalls; the reform eased it and allowed developer appeals."],["Inclusionary zoning / value capture","Levying the value uplift from upzoning to fund affordable housing or infrastructure; proposed by Shelter and PIA, not adopted."],["Urban consolidation","Australian term for growth management: containing greenfield spread and densifying existing areas; opposed by both industry (land supply) and residents (density)."]],

{t:"raco",pts:20,q:"Theoretical commentary on Raco & Imrie (2000). (a) Identify the theoretical perspective that grounds their argument about the Single Regeneration Budget and explain the key concepts they use. (b) Critique the argument from an alternative perspective covered in the course.",model:"(a) The article is grounded in Foucault's governmentality as developed by Rose, Miller and Dean. Government is the 'conduct of conduct' and is not reducible to the state. The authors trace a political rationality (advanced liberalism: rights and responsibilities, active citizens), a programme (SRB: competitive bids by local partnerships that must involve the community) and technologies (10% capacity building, quarterly quantitative targets, audit, Best Value, peer review). The result is 'government at a distance' through 'communities of obligation'; empowerment is a qualitative transformation of subjectivity, not a gain in power (p. 2195), and subjects gain a little freedom in return for more surveillance (p. 2201). (b) From rational choice (principal-agent, NPM as incentive alignment), the same evidence reads differently: managers used monitoring only to check targets and community involvement was 'a necessary requirement (for funders)'. That is strategic compliance with funding conditions, not internalised subjectivity, so the governmentality reading over-interprets policy texts. Its method (documents plus one secondary evaluation) cannot show how subjects actually think. A Marxist reading would add that the authors' own findings (cost-cutting, 'abandonment') point to fiscal crisis and uneven development, which a focus on mentalities leaves unexplained. Still, governmentality explains well why decentralisation can increase central control.",rubric:["Correctly identifies Foucault/governmentality (Rose, Miller, Dean) as the grounding perspective","Explains rationality, programme and technology with SRB evidence (capacity building, targets, vertical accountability)","States the core claim: empowerment as transformation of subjectivity; freedom in return for surveillance","Develops a coherent critique from a named alternative (e.g. rational choice, Marxism, communicative planning) using evidence from the text","Evaluates: strengths and limits, including method (documents and secondary sources) and structure/agency"]},
{t:"gurran",pts:20,q:"Theoretical commentary on Gurran & Ruming (2016). (a) Which theoretical perspective grounds their analysis of the NSW planning reform, and how do they show that 'less planning' was made common sense? (b) Critique their argument from an alternative theoretical perspective.",model:"(a) The analysis is broadly Foucauldian discourse analysis set within a critique of neoliberal planning reform. Language constructs reality; power lies in sustaining one version of reality as 'objective truth', which hardens into a 'regime of truth' fixing acceptable problems and solutions (p. 3). Comparing 13 Green Paper submissions with the White Paper and draft Bill, they show industry framing planning as red tape that blocks supply, growth and affordability. Government adopted it: growth became the 'main purpose', environment and society were relegated by 'while' and 'having regard to', rezoning was eased, 'onerous' controls were banned and affordable housing contributions were cut. Affordability worked as a 'semantic justification' for deregulation (p. 14), even though communities made 72% of submissions. (b) From liberal economics (Hayek, Glaeser-style supply arguments), the paper shows how the supply claim was framed but never tests whether it is true. The fact that approvals and prices both rose under the old system is not a counterfactual. From rational choice (compare Taylor 2016 on rent-seeking), 'discourse' may simply reflect concentrated interests and campaign funding, and resident groups are rent-seekers too. Neo-institutionalism would stress veto points and path dependence, since the 1979 Act survived. The case is strong on framing and weak on causation.",rubric:["Identifies discourse analysis / Foucauldian regime of truth (and neoliberalism critique) as the grounding","Uses evidence: framing, relegation language, specific reforms adopted, affordability as semantic justification, 72% vs 1%","Notes the complications: infrastructure exception, Bill stalled by backlash, approvals up with prices up","Develops a critique from a named alternative (Hayek/liberal economics, rational choice, Marxism or neo-institutionalism) with specific points","Evaluates method (13 submissions, influence inferred from textual similarity) and gives a balanced judgement"]}
